      authoring: "Keep this aligned with the real state of execution.",
      agentImplications: "Use the enum value guidance to interpret whether the effort is live or historical."
    )

  """Short statement of what this effort is executing."""
  summary: String!

  """Explicit implementation plan; read its source before interpreting approval."""
  implementationPlan: EffortMaterial! @display(hover: false) @link(source: "implementation-plan", includeBodyLinks: false, includeBacklinks: false) @workspaceMember(label: "Implementation plan")

  """Explicit append-only execution history."""
  workLog: EffortMaterial! @display(hover: false) @link(source: "work-log", includeBodyLinks: false, includeBacklinks: false) @workspaceMember(label: "Work log")

  """Supporting materials explicitly selected by the author, never inferred from the folder."""
  materials: [EffortMaterial!] @display(hover: false) @link(includeBodyLinks: false, includeBacklinks: false) @workspaceMember

  """Frozen governing spec set; preserve exact selected sources."""
  governingSpecs: [SpecLike!]! @link(source: "governing-specs", includeBodyLinks: false, includeBacklinks: false)
    @policy(forbidAutonomousSemanticEdits: true, editScope: "FROZEN_SNAPSHOT", reason: "Frozen normative spec input for the effort.")


