"""
Effort note for one bounded execution thread against a frozen set of specs.
Create one when implementation starts. Efforts record the approved plan, execution trail,
deviations, and closure/backport work for that slice of delivery.
"""
type EffortNote
  implements Effort
  @display(singular: "Effort note", plural: "Effort notes")
  @node(paths: ["docs/efforts/**/*.md", "pkg/app/cli/init/templates/starters/agentic-engineering/repo/docs/efforts/**/*.md"])
  @companionDocs(paths: ["docs/efforts/README.md", "docs/engineering/review-and-approval.md", "docs/engineering/review-and-approval.md"], purpose: "workflow")
  @guidance(
    meaning: "Bounded execution artifact for one frozen slice of delivery.",
    authoring: "Use this as the durable home for frozen scope, approved plan, execution history, deviations, and actual delivery.",
    agentImplications: "Treat this as the primary execution contract once planning begins."
  ) {
  """Stable filename-derived local-minute identifier for the effort, e.g. EFF-2026-08-05-14-32."""
  id: String! @field(source: "id") @identifier(strategy: DATETIME, preferred: true, prefix: "EFF")

  """Human-readable effort title."""
  name: String! @display(hover: false)

  """Canonical effort creation/start timestamp."""
  createdAt: DateTime! @display(importance: DETAIL)
    @field(source: "created-at")
    @guidance(
      meaning: "Canonical timestamp for when this bounded effort note was opened as the active execution slice.",
      authoring: "Record the real effort creation or start time here. Do not split this into separate date/time fields or reuse plan approval time.",
      agentImplications: "Treat this as the canonical effort creation timestamp for ordering, auditability, and resume context."
    )

  """Approver for the frozen plan."""
  planApprovedBy: String @display(importance: DETAIL)
    @field(source: "plan-approved-by")
    @guidance(
      meaning: "Identity of the real human approver for the frozen plan.",
      authoring: "Leave blank until actual approval exists. Record a real human identity, not a placeholder.",
      agentImplications: "Never fabricate this value."
    )
    @policy(requiresUserConfirmation: true, reason: "Plan approval must reflect a real human approver.")

  """Current effort state."""
  status: EffortStatus! @display(importance: KEY)
    @guidance(
      meaning: "Current execution-state marker for the effort.",
      authoring: "Keep this aligned with the real state of execution.",
      agentImplications: "Use the enum value guidance to interpret whether the effort is live or historical."
    )

  """Short statement of what this effort is executing."""
  summary: String!

  """Frozen governing spec set, matching the Spec Set (Frozen) section. Older effort notes may omit it."""
  governingSpecs: [SpecLike!] @link(source: "governing-specs", includeBodyLinks: false, includeBacklinks: false)
    @policy(forbidAutonomousSemanticEdits: true, editScope: "FROZEN_SNAPSHOT", reason: "Frozen normative spec input for the effort.")

  scope: NarrativeSection @contains(level: H2, heading: "Scope", required: true)
  specSetFrozen: FrozenSpecSetSection
    @contains(level: H2, heading: "Spec Set (Frozen)", required: true)
    @guidance(
      meaning: "Normative frozen spec input for the effort.",
      authoring: "Record the exact governing spec set and snapshot context. Do not treat this as a casual related-spec list.",
      agentImplications: "Preserve this as frozen execution input rather than silently rewriting it later."
    )
    @policy(forbidAutonomousSemanticEdits: true, editScope: "FROZEN_SNAPSHOT", reason: "This section captures the frozen normative spec input for the effort.")
  storiesInScopeFrozen: FrozenStoryScopeSection
    @contains(level: H2, heading: "Stories In Scope (Frozen)", required: true)
    @guidance(
      meaning: "Frozen selected story slice and snapshot context for this effort.",
      authoring: "Record the exact story and acceptance-criterion slice as wikilinks to embedded node block targets, preserving readable ids as link display text. Do not use plain text ids; they will not index effort-to-story / effort-to-criterion graph edges.",
      agentImplications: "Preserve this as frozen execution scope rather than silently reselecting stories later. Treat missing wikilinks here as a graph-integrity bug."
    )
    @policy(forbidAutonomousSemanticEdits: true, editScope: "FROZEN_SNAPSHOT", reason: "This section captures the frozen story slice selected for the effort.")
  specCoverageChecklist: NarrativeSection
    @contains(level: H2, heading: "Spec Coverage Checklist", required: true)
    @guidance(
      meaning: "Checklist that maps the frozen scope against the governing spec commitments for this effort.",
      authoring: "Use this to verify that the planned effort covers the relevant spec obligations and to make any deliberate omissions visible. When checklist items refer to selected stories or acceptance criteria, reuse the durable wikilinks from `Stories In Scope (Frozen)` instead of plain bracketed ids.",
      agentImplications: "Treat this as a scope-accounting aid, not as disposable planning filler. Plain `[SPEC-0007.US1]` labels do not create graph edges; prefer `[[spec-file#^SPEC-0007-US1|SPEC-0007.US1]]`."
    )
  plan: NarrativeSection
    @contains(level: H2, heading: "Plan", required: true)
    @guidance(
      meaning: "Decision-complete implementation contract for executing the effort.",
      authoring: "For complex efforts, include goal/outcome, selected scope, current-state gap, architecture decisions, implementation phases, task breakdown, validation plan, docs/backport plan, and open decisions or assumptions. Each phase should include objective, affected files or modules, concrete tasks, tests, docs, and exit criteria. Include a foundation phase when the effort establishes schemas, storage contracts, public APIs, internal module interfaces, ownership boundaries, or reusable architectural patterns. Task breakdowns should cite selected stories and acceptance criteria with their durable wikilinks, using readable aliases such as `SPEC-0007.US1`.",
      agentImplications: "Do not infer schema-level workflow state from prose phases inside this section. Preserve story and criterion links so plan tasks remain navigable and queryable. Treat a sparse plan without concrete tasks, validation, documentation, and phase exit criteria as not decision-complete."
    )
  originalIntendedDelivery: NarrativeSection
    @contains(level: H2, heading: "Original Intended Delivery", required: true)
    @guidance(
      meaning: "Snapshot of what the effort originally intended to deliver when execution began.",
      authoring: "Capture the original intended outcome here and preserve it as a baseline. Do not silently rewrite it to match later reality.",
      agentImplications: "Treat this as frozen intent baseline used to interpret deviations and actual delivery."
    )
    @policy(forbidAutonomousSemanticEdits: true, editScope: "FROZEN_SNAPSHOT", reason: "This section preserves the original intended delivery baseline for the effort.")
  actualDelivered: NarrativeSection
    @contains(level: H2, heading: "Actual Delivered", required: true)
    @guidance(
      meaning: "Outcome-truth record of what this effort actually shipped or completed.",
      authoring: "Describe the real delivered outcome here, including partial delivery where relevant. Do not just restate the plan.",
      agentImplications: "Use this as the outcome truth for audit, backport, and closure rather than assuming the original plan fully landed."
    )
  executionNotes: NarrativeSection
    @contains(level: H2, heading: "Execution Notes", required: true)
    @guidance(
      meaning: "Append-only effort-local journal. Append-only historical execution evidence for the effort. Use this for human decisions, agent surprises, learnings, validation, blockers, handoffs, and resume points.",
      authoring: "Append new timestamped entries instead of rewriting prior history. Use UTC second-precision DateTime entries with event kinds like `[decision]`, `[surprise]`, `[learning]`, `[validation]`, `[blocker]`, `[handoff]`, and `[resume]`.",
      agentImplications: "Preserve prior entries and add new ones in order. Keep decisions and surprises here unless they change authoritative spec, reference, code-doc, or skill truth; then backport that truth separately and leave the effort entry as provenance."
    )
    @policy(forbidAutonomousSemanticEdits: true, editScope: "APPEND_ONLY", reason: "Execution Notes are an append-only historical record.")
  deviations: NarrativeSection
    @contains(level: H2, heading: "Deviations", required: true)
    @guidance(
      meaning: "Running record of real divergence between frozen plan or scope and execution reality.",
      authoring: "Record deviations when they happen, including omitted work, changed behavior, or delivery reality that differs from the original plan.",
      agentImplications: "Do not bury divergence in chat or code alone. Keep this current whenever execution departs from the frozen contract."
    )
  closureChecklist: NarrativeSection
    @contains(level: H2, heading: "Closure Checklist", required: true)
    @guidance(
      meaning: "Human-reviewable checklist for effort closure evidence.",
      authoring: "Track quality gates, alignment check, specs/docs backport, and follow-up or compounding triage here. Use checkboxes instead of separate closure-status frontmatter.",
      agentImplications: "Treat unchecked closure items as remaining work before marking the effort complete."
    )
  compoundingFollowUps: NarrativeSection
    @contains(level: H2, heading: "Compounding Follow-ups", required: true)
    @guidance(
      meaning: "Future-capacity follow-ups discovered during the effort.",
      authoring: "Record repeated friction, missing support, missing agent capabilities, and the smallest durable fix. Use this for compounding triage, not ordinary execution history.",
      agentImplications: "Use this section before closing the effort to decide what should become tests, scripts, specs, skills, evidence rules, access paths, safety gates, or follow-on efforts."
    )
  statusSection: NarrativeSection
    @contains(level: H2, heading: "Status", required: true)
    @guidance(
      meaning: "Narrative status block that explains the current effort state in prose.",
      authoring: "Keep this aligned with the `status` field and use it to explain the current state, blocker, or closure condition in human-readable terms.",
      agentImplications: "Keep this prose synchronized with the effort lifecycle state rather than letting the field and section drift apart."
    )
}

"""
Broad reference note family for durable supporting context.
Use `reference-kind` to distinguish guides, analysis notes, and descriptive architecture docs.
Split a new concrete subtype only when the family needs different ontology-owned semantics.
"""
type ReferenceDoc
  @display(singular: "Reference doc", plural: "Reference docs", group: "Knowledge")
  @node(paths: [
    "docs/reference/**/*.md",
    "pkg/app/cli/init/templates/starters/agentic-engineering/repo/docs/reference/**/*.md"
  ])
  @companionDocs(paths: ["docs/reference/README.md", "docs/reference/guides/ontology-driven-transcript-ingestion.md"], purpose: "workflow")
  {
  """Short statement of what this reference note explains."""
