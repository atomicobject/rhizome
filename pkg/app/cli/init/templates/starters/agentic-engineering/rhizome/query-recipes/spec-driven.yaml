apiVersion: rhizome.query-recipe.v1
id: runtime-code-evidence-pack
name: Runtime code evidence pack
problem: Load code-adjacent docs, linked notes, and tests through GraphQL before planning or implementation.
inputSpec:
  mode: required_anchor
  primaryInput: path
  inputs:
    - name: path
      required: true
      kind: string
      description: Vault-relative code path.
query:
  graphQL: |
    query RuntimeCodeEvidence($path: String!) {
      code {
        docsForCode(path: $path, first: 12) {
          available
          normalizedPath
          docs { path kind truncated }
          notes { path title kind line snippet }
          warnings { code message path }
        }
        testsForCode(path: $path, first: 12) {
          available
          normalizedPath
          tests { path kind reason }
          warnings { code message path }
        }
      }
    }
outputContract:
  expectedPaths:
    - code.docsForCode.available
    - code.testsForCode.available
  empty: The code runtime did not resolve; fall back to file-context and targeted semantic-query modes.
  partial: Missing code anchors, code index, or tests should be surfaced through warnings rather than silently widening.
  highVolume: Keep first limits small; ask for a narrower code path before broadening.
adaptationGuidance:
  summary: Preserve bounded code/doc/test evidence loading and explicit unavailable warnings.
  rules:
    - Keep normalizedPath and warnings visible for path-boundary debugging.
    - Keep docs, notes, and tests buckets separate so skills can choose the right follow-up.
tags:
  - spec-driven
  - runtime
  - code
---
apiVersion: rhizome.query-recipe.v1
id: runtime-note-code-evidence-pack
name: Runtime note-to-code evidence pack
problem: Load code paths anchored from a note through GraphQL before editing a code-linked spec, decision, reference, or code-anchor note.
inputSpec:
  mode: required_anchor
  primaryInput: path
  inputs:
    - name: path
      required: true
      kind: string
      description: Vault-relative note path.
query:
  graphQL: |
    query RuntimeNoteCodeEvidence($path: String!) {
      code {
        codeForNote(path: $path, first: 20) {
          available
          normalizedPath
          code { path kind reason }
          warnings { code message path }
        }
      }
    }
outputContract:
  expectedPaths:
    - code.codeForNote.available
    - code.codeForNote.code.path
  empty: The note path did not resolve to code anchors; fall back to file-context from known code paths or semantic-query discovery.
  partial: Missing code anchors should be surfaced through warnings rather than silently widening to unrelated code.
  highVolume: Keep this anchored to one note. Broaden only after inspecting the returned code paths.
adaptationGuidance:
  summary: Preserve bounded note-to-code evidence loading for code-linked typed notes and anchor notes.
  rules:
    - Keep normalizedPath and warnings visible for note path-boundary debugging.
    - Keep code paths separate from docsForCode results so skills can decide whether they are starting from a note or from code.
tags:
  - spec-driven
  - runtime
  - code
  - notes
---
apiVersion: rhizome.query-recipe.v1
id: topic-typed-survey
name: Topic typed survey
problem: Survey one typed ontology slice for one or more topics and return ranked note candidates with scores before an agent drafts specs or triages reference context.
inputSpec:
  mode: none
  inputs:
    - name: topics
      required: true
      kind: list
      description: One or more topic/search phrases to union across the typed slice.
    - name: type
      required: false
      kind: string
      description: Ontology type or interface to survey, such as SpecLike, FeatureArea, or ReferenceDoc.
    - name: first
      required: false
      kind: int
      description: Maximum ranked typed nodes to return; default 50.
query:
  graphQL: |
    query TopicTypedSurvey($topics: [String!]!, $type: String = "SpecLike", $first: Int = 50) {
      notes(type: $type, semantic: $topics, first: $first) {
        nodes {
          path
          title
          score
          ... on SpecLike {
            id
            summary
            specStatus
            lastUpdated
          }
          ... on ReferenceDoc {
            summary
            referenceKind
            referenceStatus: status
            lastVerified
          }
          ... on FeatureArea {
            featureAreaId: id
            summary
            owner
          }
        }
      }
    }
outputContract:
  expectedPaths:
    - notes.nodes.path
    - notes.nodes.title
    - notes.nodes.score
    - notes.nodes.summary
  empty: No typed nodes matched the supplied topics; try a broader type/interface or fall back to semantic-query for mixed code and note chunks.
  partial: Scores are ranking evidence, not proof of relevance. Inspect the top candidates before freezing scope or deciding no related contract exists.
  highVolume: Raise `first` only when the typed corpus has outgrown the default page; prefer adding another focused topic over widening to all notes.
adaptationGuidance:
  summary: Preserve typed-slice, multi-topic semantic survey with score, path, title, and thin typed projections.
  rules:
    - "Keep `semantic: $topics` on a typed `notes(type: $type, ...)` root so execution uses the typed survey path."
    - Keep `score` visible so agents can triage borderline candidates without rerunning chunk search.
    - Preserve SpecLike, FeatureArea, and ReferenceDoc projections for the spec-driven prior-art workflow.
examples:
  - name: Related specs for a feature topic
    inputs:
      type: SpecLike
      topics: typed semantic survey; query recipe prior art
  - name: Architecture reference and rationale
    inputs:
      type: ReferenceDoc
      topics: semantic retrieval ranking
tags:
  - spec-driven
  - semantic
  - ontology
  - survey
