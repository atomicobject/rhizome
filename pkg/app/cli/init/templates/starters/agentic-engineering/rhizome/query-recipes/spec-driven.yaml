apiVersion: rhizome.query-recipe.v1
id: note-by-path
name: Note by path
problem: Load one known note and its immediate note neighborhood before reshaping prose, frontmatter, links, or typed structure.
inputSpec:
  mode: required_anchor
  primaryInput: path
  inputs:
    - name: path
      required: true
      kind: string
      description: Vault-relative note path.
query:
  graphQL: |
    query NoteByPath($path: String!) {
      note(path: $path) {
        path
        title
        frontmatter
        linked(first: 20) {
          path
          title
        }
        backlinked(first: 20) {
          path
          title
        }
      }
    }
outputContract:
  expectedPaths:
    - note.path
    - note.frontmatter
    - note.linked.path
    - note.backlinked.path
  empty: The note path did not resolve; confirm the vault-relative path before editing.
  partial: Use the returned neighborhood and call out missing linked or backlinked notes before widening.
  highVolume: Keep the first page and ask before widening the neighborhood.
adaptationGuidance:
  summary: Keep this packet centered on one known note path and its immediate linked/backlinked context.
  rules:
    - Use this before ad hoc note-neighborhood GraphQL when the target note path is already known.
    - Preserve path, title, frontmatter, linked, and backlinked fields in the result.
tags:
  - notes
  - neighborhood
---
apiVersion: rhizome.query-recipe.v1
id: effort-execution-context
name: Effort execution context
problem: Load the active effort's frozen scope, plan approval, execution plan, delivery truth, deviations, and closure checklist before planning, implementing, auditing, backporting, or compounding.
inputSpec:
  mode: required_anchor
  primaryInput: path
  inputs:
    - name: path
      required: true
      kind: string
      description: Vault-relative Markdown effort note or HTML effort workspace entry path.
query:
  graphQL: |
    query EffortExecutionContext($path: String!) {
      note(path: $path) {
        path
        title
        ref { ref notePath typeName }
        ... on Effort {
          id
          name
          status
          summary
          planApprovedBy
        }
        ... on EffortNote {
          scope {
            content
          }
          specSetFrozen {
            content
            frozenSpecs {
              id
              summary
              specStatus
              lastUpdated
              ... on TechnicalSpec { path title }
              ... on ProductSpec { path title }
              ... on ProcessSpec { path title }
              ... on ExperienceSpec { path title }
              ... on OperationsSpec { path title }
            }
          }
          storiesInScopeFrozen {
            content
          }
          specCoverageChecklist {
            content
          }
          plan {
            content
          }
          originalIntendedDelivery {
            content
          }
          actualDelivered {
            content
          }
          executionNotes {
            content
          }
          deviations {
            content
          }
          closureChecklist {
            content
          }
          compoundingFollowUps {
            content
          }
          statusSection {
            content
          }
        }
        ... on EffortWorkspace {
          implementationPlan { path title ref { ref notePath typeName } }
          workLog {
            path title ref { ref notePath typeName }
            specSetFrozen { content }
            storiesInScopeFrozen { content }
            planApproval { content }
            originalIntendedDelivery { content }
            actualDelivered { content }
            deviations { content }
            closureChecklist { content }
            statusSection { content }
            executionNotes { content }
          }
          materials { path title ref { ref notePath typeName } }
          governingSpecs {
            id summary specStatus lastUpdated
            ... on NoteNode { path title ref { ref notePath typeName } }
          }
        }
      }
    }
outputContract:
  expectedPaths:
    - note.path
    - note.specSetFrozen.frozenSpecs.path
    - note.closureChecklist.content
    - note.ref.ref
    - note.implementationPlan.path
    - note.workLog.path
    - note.workLog.planApproval.content
    - note.workLog.actualDelivered.content
    - note.workLog.closureChecklist.content
    - note.materials.path
    - note.governingSpecs.path
  empty: The effort path did not resolve; confirm the current effort before making scope or closure decisions.
  partial: A blank planApprovedBy means no approval is recorded on the effort, not that approval is missing. Policy accepts explicit approval in chat and requires recording it only when a current user is configured, so reconcile the metadata with the actual authorization in the conversation before asking again, and ask only when neither exists. Expected paths are form-dependent; Markdown efforts return inline sections, while workspaces return explicit component and governing-spec links with source references. Work-log lifecycle sections are explicit snapshots, not substitutes for source reads. Read the workspace entry source and linked plan, log, and materials before interpreting frozen scope or closure evidence. Compare the frozen snapshots with the entry and require an exact approved plan revision; report disagreements rather than choosing authority silently. Missing components, unresolved links, or empty delivery evidence must be reported; absence does not authorize execution or closure. A resolved non-effort note is the wrong anchor.
  highVolume: Keep this anchored to one effort. Do not broaden to every effort unless doing a process audit.
adaptationGuidance:
  summary: Preserve one-effort anchored loading of frozen scope, plan approval, plan, delivery truth, execution notes, deviations, closure checklist, and current status.
  rules:
    - Preserve both concrete effort forms under the single note(path) anchor and use ref.typeName to interpret the returned fields.
    - Keep workspace component paths, titles, and source references. Read only explicitly linked components; never infer membership from directory proximity or substitute inline Markdown sections for unread HTML sources.
    - Component links use canonical vault-relative paths. Preserve missing or partial evidence explicitly and fetch sources by the returned paths before lifecycle decisions.
    - Keep `path` as the primary input so phase skills can load a known effort without discovery.
    - Preserve frozen spec identity, closure checklist, and status evidence even if section field names evolve.
    - If effort lifecycle fields move, adapt the query to keep audit/backport/compound/status evidence visible.
examples:
  - name: Saved-query-recipes effort
    inputs:
      path: docs/efforts/2026-04-30-13-31-saved-query-recipes.md
tags:
  - spec-driven
  - effort
  - phase-context
---
apiVersion: rhizome.query-recipe.v1
id: frozen-spec-index-pack
name: Frozen spec index pack
problem: Load a compact index-first view of one frozen spec so agents can decide which requirements, stories, criteria, references, or prior efforts need deeper fetching.
inputSpec:
  mode: required_anchor
  primaryInput: path
  inputs:
    - name: path
      required: true
      kind: string
      description: Vault-relative spec note path.
query:
  graphQL: |
    query FrozenSpecIndexPack($path: String!) {
      note(path: $path) {
        path
        title
        linked(type: "ReferenceDoc", first: 20) {
          path
          title
        }
        backlinked(type: "Effort", first: 20) {
          path
          title
        }
        ... on TechnicalSpec {
          id
          summary
          specStatus
          lastUpdated
          requirements {
            references { path title summary referenceKind }
          }
          technicalStories: userStories {
            stories {
              id
              title
              summary
              status
              increment
              references { path title summary referenceKind }
              acceptanceCriteria {
                content
              }
            }
          }
        }
        ... on ProductSpec {
          id
          summary
          specStatus
          lastUpdated
          requirements {
            references { path title summary referenceKind }
          }
          productStories: userStories {
            stories {
              id
              title
              summary
              status
              increment
              references { path title summary referenceKind }
              acceptanceCriteria {
                content
              }
            }
          }
        }
        ... on ProcessSpec {
          id
          summary
          specStatus
          lastUpdated
          requirements {
            references { path title summary referenceKind }
          }
        }
        ... on ExperienceSpec {
          id
          summary
          specStatus
          lastUpdated
          requirements {
            references { path title summary referenceKind }
          }
          experienceStories: userStories {
            stories {
              id
              title
              summary
              status
              increment
              references { path title summary referenceKind }
              acceptanceCriteria {
                content
              }
            }
          }
        }
        ... on OperationsSpec {
          id
          summary
          specStatus
          lastUpdated
          requirements {
            references { path title summary referenceKind }
          }
          operationsStories: userStories {
            stories {
              id
              title
              summary
              status
              increment
              references { path title summary referenceKind }
              acceptanceCriteria {
                content
              }
            }
          }
        }
      }
    }
outputContract:
  expectedPaths:
    - note.path
    - note.linked.path
    - note.backlinked.path
    - note.technicalStories.stories.acceptanceCriteria.content
    - note.productStories.stories.acceptanceCriteria.content
    - note.experienceStories.stories.acceptanceCriteria.content
    - note.operationsStories.stories.acceptanceCriteria.content
  empty: The spec path did not resolve; confirm the frozen spec path before planning or auditing against it.
  partial: Process specs may not have user stories. Use returned paths, summaries, ids, statuses, references, and acceptance criteria content to decide whether to run the detail pack or fetch full files. The inbound effort list is capped at 20 and includes closed efforts, so it is for reading only; after editing the spec, list affected efforts with `validate frozen-scope-drift` and the Deviations search described in the specification reference.
  highVolume: Prefer this index pack before the detail pack when an effort has several frozen specs.
adaptationGuidance:
  summary: Preserve compact index-first loading of one governing spec without full section content.
  rules:
    - Keep path, id, title, summary, status, and lastUpdated for spec identity.
    - Keep story ids, statuses, acceptance criteria content, and reference paths for targeted follow-up.
    - Keep reference, decision, and inbound effort summaries so agents can choose deeper context intentionally.
examples:
  - name: Saved-query-recipes spec index
    inputs:
      path: docs/specs/technical/saved-query-recipes.md
tags:
  - spec-driven
  - spec
  - phase-context
  - index-first
---
