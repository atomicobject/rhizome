apiVersion: rhizome.query-recipe.v1
id: story-acceptance-pack
name: Story acceptance pack
problem: Load the story and acceptance-criterion scope for a spec so effort creation, planning, implementation, and audits freeze exact story ids and acceptance criteria content.
inputSpec:
  mode: required_anchor
  primaryInput: path
  inputs:
    - name: path
      required: true
      kind: string
      description: Vault-relative story-bearing spec note path.
query:
  graphQL: |
    query StoryAcceptancePack($path: String!) {
      note(path: $path) {
        path
        title
        ... on TechnicalSpec {
          id
          summary
          specStatus
          technicalStories: userStories {
            stories {
              id
              locator { wikilink requiresFix linkTarget { blockId } }
              title
              summary
              status
              increment
              efforts { id status ... on NoteNode { path title } }
              references { path title summary referenceKind }
              acceptanceCriteria {
                id
                content
                criteria {
                  summary
                  verification
                  locator { wikilink requiresFix linkTarget { blockId } }
                }
              }
            }
          }
        }
        ... on ProductSpec {
          id
          summary
          specStatus
          productStories: userStories {
            stories {
              id
              locator { wikilink requiresFix linkTarget { blockId } }
              title
              summary
              status
              increment
              efforts { id status ... on NoteNode { path title } }
              references { path title summary referenceKind }
              acceptanceCriteria {
                id
                content
                criteria {
                  summary
                  verification
                  locator { wikilink requiresFix linkTarget { blockId } }
                }
              }
            }
          }
        }
        ... on ExperienceSpec {
          id
          summary
          specStatus
          experienceStories: userStories {
            stories {
              id
              locator { wikilink requiresFix linkTarget { blockId } }
              title
              summary
              status
              increment
              efforts { id status ... on NoteNode { path title } }
              references { path title summary referenceKind }
              acceptanceCriteria {
                id
                content
                criteria {
                  summary
                  verification
                  locator { wikilink requiresFix linkTarget { blockId } }
                }
              }
            }
          }
        }
        ... on OperationsSpec {
          id
          summary
          specStatus
          operationsStories: userStories {
            stories {
              id
              locator { wikilink requiresFix linkTarget { blockId } }
              title
              summary
              status
              increment
              efforts { id status ... on NoteNode { path title } }
              references { path title summary referenceKind }
              acceptanceCriteria {
                id
                content
                criteria {
                  summary
                  verification
                  locator { wikilink requiresFix linkTarget { blockId } }
                }
              }
            }
          }
        }
      }
    }
outputContract:
  expectedPaths:
    - note.path
    - note.technicalStories.stories.efforts.path
    - note.technicalStories.stories.locator.wikilink
    - note.technicalStories.stories.acceptanceCriteria.criteria.locator.wikilink
    - note.productStories.stories.efforts.path
    - note.productStories.stories.locator.wikilink
    - note.productStories.stories.acceptanceCriteria.criteria.locator.wikilink
    - note.experienceStories.stories.efforts.path
    - note.experienceStories.stories.locator.wikilink
    - note.experienceStories.stories.acceptanceCriteria.criteria.locator.wikilink
    - note.operationsStories.stories.efforts.path
    - note.operationsStories.stories.locator.wikilink
    - note.operationsStories.stories.acceptanceCriteria.criteria.locator.wikilink
    - note.technicalStories.stories.references.path
    - note.productStories.stories.references.path
    - note.experienceStories.stories.references.path
    - note.operationsStories.stories.references.path
  empty: The spec path did not resolve or the spec family does not carry embedded user stories.
  partial: "Only stories with `status: ready` should be selected for ordinary execution efforts unless the effort is explicitly story-shaping work."
  highVolume: Do not widen beyond one spec during effort creation; freeze explicit story ids, acceptance criteria content, and durable link locators.
adaptationGuidance:
  summary: Preserve ready story, acceptance criterion, locator, reference, decision, and prior effort visibility for story selection, implementation linking, and audit.
  rules:
    - Keep story ids, status, increment, acceptance criteria content, and locator fields in the result. Select an individual criterion through its `criteria` entry; the section-level result is context, not a criterion link.
    - Use `locator.wikilink` or `locator.linkTarget` for code/doc links only when `requiresFix` is false. A planned locator does not exist yet and must never be persisted as a citation. When `requiresFix` is true, inspect the repair with `rzm agent node-link --ensure plan`; if source mutation is authorized, apply it through a write-capable Rhizome surface, rerun this recipe, and cite only the returned durable link. Otherwise cite the nearest durable parent and record the missing precise target as follow-up.
    - Keep prior effort links so agents avoid reselecting stale or already-closed scope blindly.
    - If story families move out of spec notes, adapt this recipe to the new story root while keeping exact story ids, acceptance criteria content, and locator metadata.
examples:
  - name: Saved-query-recipes stories
    inputs:
      path: docs/specs/technical/saved-query-recipes.md
tags:
  - spec-driven
  - stories
  - acceptance-criteria
---
