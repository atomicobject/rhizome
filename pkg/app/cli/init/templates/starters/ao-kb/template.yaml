id: ao-kb
name: AO KB knowledge
description: "Browse, trace, and edit an existing AO KB's knowledge beside AO's own skills, with the selected product model read-only"
requires:
  - core
optionalAddon: true
# The starter declares no source ownership; a repository's own
# .rhizome/source-ownership.yml is left to it. module/bindings/ is the model
# binding compiler; it runs only through the
# refresh-bindings action, never from init.
installedAssetTypes:
  - ontology
  - query-recipes
  - views
  - actions
  - scripts
  - skills
  - managed-docs
