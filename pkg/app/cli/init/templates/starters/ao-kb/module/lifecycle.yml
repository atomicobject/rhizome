title: AO Knowledge Base
observe: readiness
setup: refresh-bindings
index: index
verify: readiness
inputs:
  - .rhizome/modules
  - .rhizome/ontology
  - .rhizome/config.yml
  - AGENTS.md
  - CLAUDE.md
  - .rhizome/ignore
  - .obsidianignore
  - .gitignore
  - .rhizome/source-ownership.yml
  - .kb/config
  - .kb/curation
  - assertions
  - sources
  - concepts
  - artifacts
  - products
  - MOCs
  - _moc.md
  - _improvements
excludes:
  - .rhizome/modules/*/bindings/refresh.lock
  - .rhizome/modules/*/bindings/refresh.*.tmp
  - sources/_raw
  - products/*/sources/_raw
