"""An AO KB source record. Archived files under sources/_raw are evidence bytes, never Source records."""
type Source @node(matches: ["sources AND NOT sources/_raw"], propertyCase: AS_DEFINED) @display(group: "Knowledge") {
  """AO logical source identity; native nodeId and path retain physical identity."""
  aoId: String @field(source: "id")
  """AO KB authored name; absent and unknown values are preserved without inferred defaults."""
  name: String @field(source: "name")
  """AO KB authored headline; absent and unknown values are preserved without inferred defaults."""
  headline: String @field(source: "headline")
  """AO KB authored abstract; absent and unknown values are preserved without inferred defaults."""
  abstract: String @field(source: "abstract")
  """AO KB authored source kind, read from the legacy `format` key when `kind` is absent."""
  kind: String @field(sources: ["kind", "format"])
  """The source's recorded date as authored (`sourceDate`, then `meetingDate`, then `date`). Readers treat only an ISO calendar date, optionally with a time, as a date; any other value is an unreadable recorded date. Never a file-name, ingestion, or modification date."""
  recordedDate: String @field(sources: ["sourceDate", "meetingDate", "date"])
  """AO KB authored sourceKind; absent and unknown values are preserved without inferred defaults."""
  sourceKind: String @field(source: "sourceKind")
  """AO KB authored status; absent and unknown values are preserved without inferred defaults."""
  status: String @field(source: "status")
  """AO KB authored ingestedAt; absent and unknown values are preserved without inferred defaults."""
  ingestedAt: String @field(source: "ingestedAt")
  """AO KB authored convertedFrom; absent and unknown values are preserved without inferred defaults."""
  convertedFrom: String @field(source: "convertedFrom")
  """AO KB authored hash; absent and unknown values are preserved without inferred defaults."""
  hash: String @field(source: "hash")
  """AO KB authored sensitivity; absent and unknown values are preserved without inferred defaults."""
  sensitivity: String @field(source: "sensitivity")
  """AO KB authored topics; absent and unknown values are preserved without inferred defaults."""
  topics: [String!] @field(source: "topics")
  """AO KB authored products; absent and unknown values are preserved without inferred defaults."""
  products: [String!] @field(source: "products")
  """AO ids of the claims extracted from this source, in authored order. Extraction history, never evidential support or corroboration. Resolve each id by an exact aoId filter; reference bindings that resolve logical ids natively arrive with the structured-data batch."""
  extractedAssertionIds: [String!] @field(source: "extractedAssertionIds")
  """Ordered AO path entries; a scalar becomes a one-item list. Native path is the source note address, so the authored path cannot use that reserved GraphQL field name. Blank slots are retained only in frontmatter JSON."""
  sourcePaths: [String!] @field(source: "path")
  """AO KB authored locator_scheme; absent and unknown values are preserved without inferred defaults."""
  locatorScheme: String @field(source: "locator_scheme")
  """AO KB authored speaker_role; absent and unknown values are preserved without inferred defaults."""
  speakerRole: String @field(source: "speaker_role")
  """AO KB authored extracted_by; absent and unknown values are preserved without inferred defaults."""
  extractedBy: String @field(source: "extracted_by")
  """Assertions whose notes link this source, anywhere in the note. Candidates for citations; the Sources section decides. Declared, so an omitted `first` returns every row."""
  linkingAssertions: [Assertion!] @neighbors(direction: INBOUND, type: "Assertion")
}

"""AO KB concept membership comes from authored links, never an inferred primary-concept assignment."""
type Concept @node(paths: ["concepts/**/*.md"], propertyCase: AS_DEFINED) @display(group: "Knowledge") {
  """AO KB authored id; absent and unknown values are preserved without inferred defaults."""
  aoId: String @field(source: "id")
  """AO KB authored name; absent and unknown values are preserved without inferred defaults."""
  name: String @field(source: "name")
  """AO KB authored headline; absent and unknown values are preserved without inferred defaults."""
  headline: String @field(source: "headline")
  """AO KB authored abstract; absent and unknown values are preserved without inferred defaults."""
  abstract: String @field(source: "abstract")
  """AO KB authored createdAt; absent and unknown values are preserved without inferred defaults."""
  createdAt: String @field(source: "createdAt")
  """AO KB authored updatedAt; absent and unknown values are preserved without inferred defaults."""
  updatedAt: String @field(source: "updatedAt")
  """AO KB authored aliases; absent and unknown values are preserved without inferred defaults."""
  aliases: [String!] @field(source: "aliases")
  """AO KB authored layers; absent and unknown values are preserved without inferred defaults."""
  layers: [String!] @field(sources: ["layers", "phases"])
  """AO KB authored tags; absent and unknown values are preserved without inferred defaults."""
  tags: [String!] @field(source: "tags")
  """AO KB authored products; absent and unknown values are preserved without inferred defaults."""
  products: [String!] @field(source: "products")
  """Only ## Related Concepts; the section's relatedConcepts field excludes incidental links in other sections."""
  relatedConceptsSection: RelatedConcepts @contains(level: H2, heading: "Related Concepts")
  """Assertions this concept's note links. Membership is the union with linkingAssertions (SPEC-0135 D1)."""
  linkedAssertions: [Assertion!] @neighbors(direction: OUTBOUND, type: "Assertion")
  """Assertions whose notes link this concept."""
  linkingAssertions: [Assertion!] @neighbors(direction: INBOUND, type: "Assertion")
}

"""A concept's explicit ## Related Concepts section; these links are relatedness, not support."""
type RelatedConcepts implements Section @node(locator: EMBEDDED) @display(group: "Knowledge") {
  """Resolved concept links in this section only. Graph membership deduplicates repeated targets."""
  relatedConcepts: [Concept!] @neighbors(direction: OUTBOUND, type: "Concept", scope: SUBTREE)
}
