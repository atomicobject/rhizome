apiVersion: rhizome.query-recipe.v1
id: ao-kb-claim-to-source
name: Claim to source
problem: Read ordered authored citations, recorded origin and locator, with corroboration separate.
inputSpec:
  mode: required_anchor
  primaryInput: path
  inputs:
    - name: path
      required: true
      kind: string
      description: Vault-relative AO record path in the selected product.
query:
  graphQL: |
    query AOKBClaimToSource($path: String!) {
      assertion(first: 1, path: $path) { aoId path provenanceSource provenanceLocator
        sourcesSection { citations { recordedLink sources(first: 20) { aoId path sourcePaths locatorScheme } } }
        connectionsSection { corroboratedBy { aoId path } } }
    }
outputContract:
  expectedPaths:
    - assertion.path
  empty: No matching records; confirm the selected product, record path and index readiness.
  partial: Lists are bounded; preserve unresolved references and disclose missing or ambiguous bindings. Narrow full pages before widening.
  highVolume: Narrow the selected product and path; never silently treat a full page as complete.
adaptationGuidance:
  summary: Native @link lists follow authored record size and cannot be paged with first or count arguments. Preserve authored relationships, origin precedence, ordered citations and explicit query bounds.
  rules:
    - Use provenanceSource as origin when recorded, otherwise the first citation. Resolve logical IDs by exact aoId filters, never node(ref:).
    - Preserve citation order and repeats. Empty sources may mean repeated unanchored occurrence ambiguity; resolve recordedLink target before calling it missing.
    - Keep corroboration separate from origin and extraction. A missing locator means document-only evidence.
tags:
  - ao-kb
  - evidence
