apiVersion: rhizome.query-recipe.v1
id: ao-kb-concept-evidence
name: Concept evidence
problem: Read claims linking a concept and their ordered origin citations.
inputSpec:
  mode: required_anchor
  primaryInput: path
  inputs:
    - name: path
      required: true
      kind: string
      description: Vault-relative AO record path in the selected product.
query:
  graphQL: |
    query AOKBConceptEvidence($path: String!) {
      concept(first: 1, path: $path) {
        aoId path
        neighborhood(direction: INBOUND, type: "Assertion", first: 100) {
          truncated
          nodes { ... on Assertion {
            aoId path provenanceSource provenanceLocator
            sourcesSection { citations { recordedLink sources(first: 20) { aoId path sourcePaths locatorScheme } } }
            connectionsSection { corroboratedBy { aoId path } }
          } }
        }
      }
    }
outputContract:
  expectedPaths:
    - concept.path
  empty: No matching records; confirm the selected product, record path and index readiness.
  partial: Lists are bounded; preserve unresolved references and disclose missing or ambiguous bindings. Narrow full pages before widening.
  highVolume: Narrow the selected product and path; never silently treat a full page as complete.
adaptationGuidance:
  summary: Native @link lists follow authored record size and cannot be paged with first or count arguments. Preserve authored relationships, origin precedence, ordered citations and explicit query bounds.
  rules:
    - Read the bounded incoming Assertion neighborhood; disclose truncated before claiming complete concept coverage.
    - Concept membership includes every outgoing concept link; it is navigation, not evidential support.
    - Use recorded provenanceSource before first-citation origin fallback and resolve IDs by exact aoId filters.
    - Preserve repeated citations and resolve recordedLink when occurrence targets are empty.
tags:
  - ao-kb
  - evidence
