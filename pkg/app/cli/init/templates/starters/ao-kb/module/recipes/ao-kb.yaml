apiVersion: rhizome.query-recipe.v1
id: ao-kb-claim-to-source
name: Claim to source
problem: Read ordered authored citations, recorded origin and locator, with corroboration separate.
inputSpec:
  mode: required_anchor
  primaryInput: path
  inputs:
    - name: path
      required: true
      kind: string
      description: Vault-relative AO record path in the selected product.
query:
  graphQL: |
    query AOKBClaimToSource($path: String!) {
      assertion(first: 1, path: $path) { aoId path provenanceSource provenanceLocator
        sourcesSection { citations { recordedLink sources(first: 20) { aoId path sourcePaths locatorScheme } } }
        connectionsSection { corroboratedBy { aoId path } } }
    }
outputContract:
  expectedPaths:
    - assertion.path
  empty: No matching records; confirm the selected product, record path and index readiness.
  partial: Lists are bounded; preserve unresolved references and disclose missing or ambiguous bindings. Narrow full pages before widening.
  highVolume: Narrow the selected product and path; never silently treat a full page as complete.
adaptationGuidance:
  summary: Native @link lists follow authored record size and cannot be paged with first or count arguments. Preserve authored relationships, origin precedence, ordered citations and explicit query bounds.
  rules:
    - Use provenanceSource as origin when recorded, otherwise the first citation. Resolve logical IDs by exact aoId filters, never node(ref:).
    - Preserve citation order and repeats. Empty sources may mean repeated unanchored occurrence ambiguity; resolve recordedLink target before calling it missing.
    - Keep corroboration separate from origin and extraction. A missing locator means document-only evidence.
tags:
  - ao-kb
  - evidence
---
apiVersion: rhizome.query-recipe.v1
id: ao-kb-reverse-impact
name: Reverse impact
problem: Navigate incoming authored claims and a bounded artifact neighborhood; these links are navigation, not new evidence.
inputSpec:
  mode: required_anchor
  primaryInput: path
  inputs:
    - name: path
      required: true
      kind: string
      description: Vault-relative AO record path in the selected product.
query:
  graphQL: |
    query AOKBReverseImpact($path: String!) {
      assertion(first: 1, path: $path) {
        aoId path
        supportedBy(first: 50) { notePath } supportedByCount
        dependedOnBy(first: 50) { notePath } dependedOnByCount
        refinedBy(first: 50) { notePath } refinedByCount
        supersededBy(first: 50) { notePath } supersededByCount
        resolvedBy(first: 50) { notePath } resolvedByCount
      }
      node(ref: $path) {
        neighborhood(direction: INBOUND, type: "Artifact", first: 100) {
          truncated
          edges { source { notePath } target { notePath } relation direction }
          nodes { ... on Artifact { path supportedBy { path } } }
        }
        modelEvidence: neighborhood(direction: INBOUND, relation: "evidenced-by", first: 100) {
          truncated
          edges { relation target { notePath kind fragment nodeId typeName } }
        }
      }
    }
outputContract:
  expectedPaths:
    - node.neighborhood.truncated
  empty: No matching records; confirm the selected product, record path and index readiness.
  partial: Lists are bounded; preserve unresolved references and disclose missing or ambiguous bindings. Narrow full pages before widening.
  highVolume: Narrow the selected product and path; never silently treat a full page as complete.
adaptationGuidance:
  summary: Native @link lists follow authored record size and cannot be paged with first or count arguments. Preserve authored relationships, origin precedence, ordered citations and explicit query bounds.
  rules:
    - Read incoming artifact edges using relation and direction; native INBOUND edges put the focus in source and the citing artifact in target. supportedBy distinguishes listed support from body references.
    - modelEvidence lists product-model records whose declared evidence names the claim. Each target is one record, not its file; read it with ao-kb-model-to-evidence. It is empty until model bindings are ready.
    - Assertion reverse fields return declaring Connections sections; notePath identifies the claim. Label each relation separately.
    - Inverse aliases and frontmatter declarations are not included by native reverse fields. This is partial navigation; use the shared relation adapter for complete normalized impact.
    - Disclose neighborhood.truncated or any relation count above its first limit; narrow the query before claiming coverage.
tags:
  - ao-kb
  - evidence
