apiVersion: rhizome.query-recipe.v1
id: context-shards
name: Context shards
problem: List every approved ContextShard with the fields lookup and maintenance need, one page at a time, so the compounding scripts can filter by path themselves.
inputSpec:
  mode: none
  inputs:
    - name: offset
      required: false
      kind: integer
      description: Rows to skip; the scripts pass the running count until a page comes back short.
query:
  graphQL: |
    query ContextShards($offset: Int = 0) {
      contextShard(first: 100, offset: $offset, sort: [{ field: "path", direction: asc }]) {
        path
        kind
        summary
        appliesTo
        commands
        target
        approvedHash
        verifiedOn
        verifiedFingerprint
      }
    }
outputContract:
  expectedPaths:
    - contextShard.path
    - contextShard.kind
    - contextShard.summary
    - contextShard.approvedHash
  empty: No approved context shards exist yet; review proposals with the compounding skill first.
  partial: When extensions.typedRoots.contextShard.hasMore is true, run again with offset set to its nextOffset.
  highVolume: Keep paging; lookup filters by path in the script.
adaptationGuidance:
  summary: The compounding lookup and maintain scripts depend on these field names and on stable paging order.
  rules:
    - Keep the direct contextShard root and the path sort.
    - Do not filter here; the scripts apply path matching, hash checks, and staleness.
tags:
  - compounding
