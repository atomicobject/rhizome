id: compounding
name: Compounding
description: "Review agent sessions for recurring friction and missing context, and turn each into a fix, a document edit, a guard rule, or a context shard you approve"
fit: "A repository where people do much of their work through Claude Code or Codex, with many local agent sessions and a team willing to review proposals that turn recurring agent friction into fixes, document edits, guard rules, and context shards. Pair it with action-items so the findings' action items are queryable."
cautions: "Sends session transcript text to the harness's model provider and to TypeSafe's Jev for screening, which needs a TypeSafe credential, and needs Node 20 or later, a spend budget the person sets, and a Person note for approvals. Its weekly mining task spends up to $10 a run and waits in the Tasks inbox unless set to auto, and its hooks stay off until the person turns them on."
requires:
  - core
optionalAddon: true
installedAssetTypes:
  - ontology
  - query-recipes
  - views
  - scripts
  - tasks
  - actions
  - skills
  - managed-docs
hooks:
  - id: deliver-shards
    delivers: approved context shards when an agent starts or reads, edits, or runs commands they apply to
    events: [session-start, subagent-start, post-tool-use]
    tools: [read, edit, patch, shell]
    command: [node, "{module}/scripts/hook.mjs"]
    timeout: 3s
    commandPrefixes: .rhizome/compounding/hook/command-prefixes.json
  - id: guard-rules
    delivers: refuses a tool call that an approved guard finding's rule forbids, before it runs
    events: [pre-tool-use]
    tools: [read, edit, patch, shell]
    guardRules: docs/memory/agent-findings
