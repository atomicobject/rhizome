apiVersion: rhizome.view.v1
id: context-shards
name: Context shards
description: Approved project knowledge mined from agent sessions.
source:
  kind: ontology_type
  type: ContextShard
mount:
  kind: standalone
  group: Knowledge
  order: 30
defaults:
  variant: table
  first: 100
  group:
    field: kind
  sort:
    - field: kind
      direction: asc
    - field: verifiedOn
      direction: desc
variants:
  table:
    columns:
      - field: kind
        label: Kind
      - field: summary
        label: Statement
      - field: appliesTo
        label: Applies to
      - field: verifiedOn
        label: Verified
      - field: reviewedBy
        label: Reviewed by
