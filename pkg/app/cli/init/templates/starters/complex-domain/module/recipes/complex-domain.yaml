apiVersion: rhizome.query-recipe.v1
id: domain-inventory-pack
name: Domain inventory pack
problem: Return a deterministic, bounded inventory of one live complex-domain type, optionally narrowed by text.
inputSpec:
  mode: none
  inputs:
    - name: type
      required: true
      kind: string
      description: Live ontology type to inventory; discover valid names with ontology-query-schema or ontology-authoring-guide.
    - name: find
      required: false
      kind: string
      description: Optional text selector used to narrow the chosen type.
    - name: first
      required: false
      kind: int
      default: "50"
      description: Maximum notes to return; default 50.
query:
  graphQL: |
    query DomainInventoryPack($type: String!, $find: String, $first: Int = 50) {
      notes(type: $type, find: $find, first: $first) {
        nodes { path title }
        pageInfo { requestedFirst returnedCount truncated maxFirst }
        warnings { code message }
      }
    }
outputContract:
  expectedPaths:
    - notes.nodes.path
    - notes.nodes.title
    - notes.pageInfo.truncated
    - notes.warnings.code
  empty: No notes of the selected live type matched. Confirm the type and selector before treating the domain family as absent.
  partial: A truncated page is a bounded sample; narrow by supported type, text, property, or an anchored relation before making a completeness claim.
  highVolume: Keep the inventory bounded and narrow the selector instead of repeatedly increasing `first`.
adaptationGuidance:
  summary: Use this deterministic typed inventory before semantic candidate discovery when no known anchor exists.
  rules:
    - Discover current type names from the live schema rather than guessing them.
    - Treat pageInfo and warnings as part of the result contract.
tags:
  - complex-domain
  - inventory
  - deterministic
---
apiVersion: rhizome.query-recipe.v1
id: domain-topic-survey
name: Domain topic survey
problem: Rank semantic candidates inside one typed complex-domain family after deterministic structural context has been loaded.
inputSpec:
  mode: none
  inputs:
    - name: topics
      required: true
      kind: list
      description: Topic phrases to search across the complex-domain inventory.
    - name: type
      required: true
      kind: string
      description: Type to survey, such as FeatureArea, Requirement, DomainContext, DomainType, DomainProcess, UserWorkflow, or RequirementSource.
    - name: first
      required: false
      kind: int
      description: Maximum typed notes to return; default 50.
query:
  graphQL: |
    query DomainTopicSurvey($topics: [String!]!, $type: String!, $first: Int = 50) {
      notes(type: $type, semantic: $topics, first: $first) {
        nodes {
          path
          title
          score
          frontmatter
        }
        pageInfo { requestedFirst returnedCount truncated maxFirst }
        warnings { code message }
      }
    }
outputContract:
  expectedPaths:
    - notes.nodes.path
    - notes.nodes.title
    - notes.nodes.score
    - notes.pageInfo.truncated
    - notes.warnings.code
  empty: No typed complex-domain notes matched the supplied topics. Use deterministic inventories next; do not infer absence from semantic search alone.
  partial: Treat scores as candidate-ranking evidence, not traceability proof.
  highVolume: Narrow by type and topic before increasing `first`; a capped semantic page remains candidate ranking, not complete inventory.
adaptationGuidance:
  summary: Keep this as typed candidate discovery after deterministic context is exhausted.
  rules:
    - "Preserve `notes(type: $type, semantic: $topics)` so the search stays inside a chosen complex-domain family."
    - Keep path, title, score, and family-specific identifiers visible for follow-up recipe calls.
tags:
  - complex-domain
  - discovery
  - semantic
