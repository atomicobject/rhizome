  mode: none
  inputs:
    - name: find
      required: false
      kind: string
      description: Optional text selector used to narrow Requirement rows.
    - name: first
      required: false
      kind: int
      default: "200"
      description: Maximum Requirement rows to return; default 200.
query:
  graphQL: |
    query CoverageGapPack($find: String, $first: Int = 200) {
      notes(type: "Requirement", find: $find, first: $first) {
        nodes {
          path
          title
          ... on Requirement {
            id
            summary
            status
            kind
            priority
            confidence
            reviewStatus
            featureAreas { path title id }
            sources { path title id reviewStatus }
            specs { id specStatus lastUpdated }
            storyRefs
            acceptanceCriterionRefs
          }
        }
        pageInfo { requestedFirst returnedCount truncated maxFirst }
        warnings { code message }
      }
    }
outputContract:
  rowPath: notes.nodes
  expectedPaths:
    - notes.nodes.path
    - notes.nodes.id
    - notes.nodes.status
    - notes.nodes.storyRefs
    - notes.nodes.acceptanceCriterionRefs
    - notes.pageInfo.truncated
    - notes.warnings.code
  empty: No Requirement rows matched the current selector. Confirm with an unfiltered or otherwise adequate inventory before concluding there are no coverage gaps.
  partial: A row with no specs, storyRefs, or acceptanceCriterionRefs is an authored structural gap that still requires evidence review before classifying satisfaction.
  highVolume: Narrow with `find` or a supported typed/property query before widening; a truncated page cannot establish complete coverage.
adaptationGuidance:
  summary: Preserve structural delivery trace fields; do not substitute semantic similarity as coverage.
  rules:
