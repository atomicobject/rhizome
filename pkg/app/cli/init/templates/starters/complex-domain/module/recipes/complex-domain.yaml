apiVersion: rhizome.query-recipe.v1
id: feature-area-backlog-pack
name: Feature area backlog pack
problem: Return bounded requirement inventory rows with feature-area, source, and delivery-trace fields for evidence review and triage.
inputSpec:
  mode: none
  inputs:
    - name: find
      required: false
      kind: string
      description: Optional text selector used to narrow Requirement rows.
    - name: first
      required: false
      kind: int
      default: "200"
      description: Maximum Requirement rows to return; default 200.
query:
  graphQL: |
    query FeatureAreaBacklogPack($find: String, $first: Int = 200) {
      notes(type: "Requirement", find: $find, first: $first) {
        nodes {
          path
          title
          ... on Requirement {
            id
            summary
            status
            kind
            priority
            confidence
            reviewStatus
            owner
            reviewer
            lastReviewed
            featureAreas { path title id }
            sources { path title id sourceKind sourceVersion reviewStatus }
            processes { path title id }
            workflows { path title id }
            specs { id specStatus }
            storyRefs
            acceptanceCriterionRefs
          }
        }
        pageInfo { requestedFirst returnedCount truncated maxFirst }
        warnings { code message }
      }
    }
outputContract:
  rowPath: notes.nodes
  expectedPaths:
    - notes.nodes.path
    - notes.nodes.id
    - notes.nodes.featureAreas.path
    - notes.nodes.sources.path
    - notes.pageInfo.truncated
    - notes.warnings.code
  empty: No Requirement rows matched the current selector. Confirm with an unfiltered or otherwise adequate inventory before concluding no requirements exist.
  partial: Requirements without feature areas, sources, or specs should be treated as triage gaps.
  highVolume: Narrow with `find` or an anchored feature-area query before widening; a truncated page is not a complete backlog.
adaptationGuidance:
  summary: Preserve row-shaped Requirement inventory for views and skill triage.
  rules:
    - "Keep `rowPath: notes.nodes`."
    - Keep row identity through path/title/id.
    - Keep source, feature area, and spec trace fields visible for coverage review.
tags:
  - complex-domain
  - requirements
  - view
