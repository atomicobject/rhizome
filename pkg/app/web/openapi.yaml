components:
  responses:
    ViewPreferencesSnapshot:
      description: Current personal preferences. Responses are not cached. Successful mutations publish view_preferences.changed with scope, revision, and vaultKey on the vault SSE stream (family reset also sets includeSlots to true); clients refresh on focus and reconnect for cross-process changes.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ViewPreferencesSnapshot"
    ViewPreferencesInvalid:
      description: Invalid scope, revision, or preference values
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    ViewPreferencesConflict:
      description: Stale revision; details.current contains the current committed snapshot
      content:
        application/json:
          schema:
            type: object
            required: [error, code, details]
            properties:
              error: { type: string }
              code: { type: string, enum: [CONFLICT] }
              details:
                type: object
                required: [current]
                properties:
                  current:
                    $ref: "#/components/schemas/ViewPreferencesSnapshot"
    IndexInitializing:
      description: Index-dependent read deferred until first-launch indexing is ready
      headers:
        Retry-After:
          description: Seconds before the client should retry the request.
          schema:
            type: integer
            minimum: 0
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
  schemas:
    ViewPreferenceContext:
      type: object
      additionalProperties: false
      required: [kind]
      description: Exactly one concrete subject. Standalone and workspace have no subject; type, interface and group require only their matching named field; node requires type and ref. No live ontology resolution is required.
      properties:
        kind: { type: string, enum: [group, type, interface, node, standalone, workspace] }
        type: { type: string, minLength: 1, maxLength: 256 }
        interface: { type: string, minLength: 1, maxLength: 256 }
        group: { type: string, minLength: 1, maxLength: 256 }
        ref:
          $ref: "#/components/schemas/NodeRef"
    ViewPreferenceScope:
      type: object
      additionalProperties: false
      required: [viewId, context]
      description: >-
        A view instance in the server vault, including optional local slot. The view need not be registered.
        The reserved viewId $selection stores target-level view selection.
        Node identity normalizes notePath, retains semantic kind/type and prefers embedded nodeId,
        then structuralFingerprint, then fragment. Byte offsets and parentId are excluded.
      properties:
        viewId: { type: string, minLength: 1, maxLength: 256 }
        context:
          $ref: "#/components/schemas/ViewPreferenceContext"
        slot: { type: string, maxLength: 256, description: Optional host instance slot inherited by widgets. }
        widgetSlot: { type: string, maxLength: 256, description: Optional widget child slot within the host instance. }
    ViewPreferenceValues:
      type: object
      maxProperties: 256
      additionalProperties: {}
      description: JSON values including null. Keys are at most 128 bytes, each value at most 64 KiB, and the sum of encoded keys and values at most 128 KiB.
    ViewPreferencesSnapshot:
      type: object
      required: [scope, revision, values, migrationClosed]
      properties:
        scope:
          $ref: "#/components/schemas/ViewPreferenceScope"
        revision: { type: integer, minimum: 0 }
        values:
          $ref: "#/components/schemas/ViewPreferenceValues"
        migrationClosed: { type: boolean }
    ViewPreferencesPatchRequest:
      type: object
      additionalProperties: false
      required: [scope, expectedRevision]
      properties:
        scope:
          $ref: "#/components/schemas/ViewPreferenceScope"
        expectedRevision: { type: integer, minimum: 0 }
        set:
          $ref: "#/components/schemas/ViewPreferenceValues"
        unset:
          type: array
          maxItems: 256
          uniqueItems: true
          items: { type: string, minLength: 1, maxLength: 128 }
    ViewPreferencesResetRequest:
      type: object
      additionalProperties: false
      required: [scope, expectedRevision]
      properties:
        scope:
          $ref: "#/components/schemas/ViewPreferenceScope"
        expectedRevision: { type: integer, minimum: 0 }
        includeSlots: { type: boolean, default: false, description: Reset all widget children of this host scope. Requires widgetSlot to be absent. }
    ViewPreferencesImportRequest:
      type: object
      additionalProperties: false
      required: [scope, migrationId, values]
      properties:
        scope:
          $ref: "#/components/schemas/ViewPreferenceScope"
        migrationId: { type: string, minLength: 1, maxLength: 1024 }
        values:
          $ref: "#/components/schemas/ViewPreferenceValues"
    StatusResponse:
      type: object
      required: [vaultName, vaultPath, embeddings, codeIndex, validation, updatedAt, ready, indexState]
      properties:
        vaultName: { type: string }
        vaultPath: { type: string }
        indexPath: { type: string }
        embeddings: { type: boolean }
        codeIndex: { type: boolean }
        validation:
          $ref: "#/components/schemas/ValidationStatusInfo"
        updatedAt: { type: string, format: date-time }
        ready: { type: boolean }
        readyReason: { type: string }
        indexState:
          type: string
          enum: [initializing, ready]
          description: >-
            Whether index-dependent reads are safe. `initializing` while the
            first-launch gate is closed; `ready` after it opens exactly once.
            Gated reads return 503 with `Retry-After` and error code
            `INDEX_INITIALIZING` while initializing.
        live:
          $ref: "#/components/schemas/LiveHealth"
    LiveHealth:
      type: object
      required: [role, watcherMode, pendingDirtyCount, scheduler]
      properties:
        role: { type: string, enum: [leader, follower, unknown] }
        watcherMode: { type: string }
        pendingDirtyCount: { type: integer }
        scheduler:
          $ref: "#/components/schemas/LiveSchedulerHealth"
        currentEpoch:
          $ref: "#/components/schemas/LiveEpoch"
        lastCompletedEpoch:
          $ref: "#/components/schemas/LiveEpoch"
        failedPhase: { type: string }
        error: { type: string }
        degradedReasons:
          type: array
          items: { type: string }
    LiveSchedulerHealth:
      type: object
      required: [embeddingPendingNotes, embeddingPendingCode, embeddingRunning, graphPending, graphRunning, graphLockContention]
      properties:
        embeddingPendingNotes: { type: integer }
        embeddingPendingCode: { type: boolean }
        embeddingRunning: { type: boolean }
        embeddingBackoff: { type: string }
        graphPending: { type: boolean }
        graphRunning: { type: boolean }
        graphLockContention: { type: boolean }
    LiveEpoch:
      type: object
      required: [id, status, startedAt, phase]
      properties:
        id: { type: integer, format: int64 }
        status: { type: string, enum: [started, completed, failed, degraded] }
        startedAt: { type: string, format: date-time }
        completedAt: { type: string, format: date-time }
        phase: { type: string }
        dirtyPaths:
          type: array
          items:
            $ref: "#/components/schemas/LiveDirtyPath"
        deletedPaths:
          type: array
          items: { type: string }
        error: { type: string }
        degradedReasons:
          type: array
          items: { type: string }
    LiveDirtyPath:
      type: object
      required: [path, kind]
      properties:
        path: { type: string }
        kind: { type: string, enum: [unknown, created, modified, removed, renamed, recreated, resync] }
    PublicCapabilitiesResponse:
      type: object
      required: [rhizomeVersion, apiVersion, vault, status, graphql, rest, events, queryRecipes, views, validation, index, providers, editSessions, errors, generatedAt]
      properties:
        rhizomeVersion: { type: string }
        apiVersion: { type: string }
        vault:
          type: object
          required: [name, path]
          properties:
            name: { type: string }
            path: { type: string }
        status:
          $ref: "#/components/schemas/StatusResponse"
        graphql:
          type: object
          required: [available, endpoint, schemaEndpoint, introspection]
          properties:
            available: { type: boolean }
            endpoint: { type: string }
            schemaEndpoint: { type: string }
            explorerUrl: { type: string }
            schemaHash: { type: string }
            ontologyHash: { type: string }
            introspection: { type: boolean }
            operations:
              type: array
              items: { type: string }
        rest:
          type: object
          required: [basePath, openapi, resources]
          properties:
            basePath: { type: string }
            openapi: { type: string }
            resources:
              type: array
              items: { type: string }
        events:
          type: object
          required: [endpoint, format, replay, heartbeat, reconnect, invalidations, streamedKinds, supportedKinds]
          properties:
            endpoint: { type: string }
            nodeEndpoint: { type: string }
            format: { type: string }
            replay: { type: string }
            heartbeat: { type: string }
            reconnect: { type: string }
            invalidations:
              type: array
              items: { type: string }
            streamedKinds:
              type: array
              items: { type: string }
            nodeStreamedKinds:
              type: array
              items: { type: string }
            supportedKinds:
              type: array
              items: { type: string }
        queryRecipes:
          type: object
          required: [available, count, issues, endpoints]
          properties:
            available: { type: boolean }
            generation: { type: string }
            count: { type: integer }
            issues: { type: integer }
            endpoints:
              type: array
              items: { type: string }
        views:
          type: object
          required: [available, count, issues, endpoints]
          properties:
            available: { type: boolean }
            generation: { type: string }
            count: { type: integer }
            issues: { type: integer }
            endpoints:
              type: array
              items: { type: string }
        validation:
          type: object
          required: [available, endpoint, repairAvailable]
          properties:
            available: { type: boolean }
            endpoint: { type: string }
            endpoints:
              type: array
              items: { type: string }
            repairAvailable: { type: boolean }
            repairEndpoints:
              type: array
              items: { type: string }
            generation: { type: string }
            status: { type: string, enum: [never_ran, running, ok, error] }
        index:
          type: object
          required: [available]
          properties:
            available: { type: boolean }
            generation: { type: string }
        providers:
          type: object
          required: [embeddings, codeIndex]
          properties:
            embeddings:
              $ref: "#/components/schemas/PublicProviderState"
            codeIndex:
              $ref: "#/components/schemas/PublicProviderState"
        editSessions:
          type: object
          required: [available, endpoints]
          properties:
            available: { type: boolean }
            endpoints:
              type: array
              items: { type: string }
        errors:
          type: object
          required: [format, codes]
          properties:
            format: { type: string }
            codes:
              type: array
              items: { type: string }
        degradedReasons:
          type: array
          items: { type: string }
        generatedAt: { type: string, format: date-time }
        compatibilityUrl: { type: string }
    PublicProviderState:
      type: object
      required: [available, state]
      properties:
        available: { type: boolean }
        state: { type: string }
    ValidationStatusInfo:
      type: object
      required: [status, health, generation, publishedGeneration]
      properties:
        status: { type: string, enum: [never_ran, running, ok, error] }
        health:
          $ref: "#/components/schemas/ValidationHealth"
        generation: { type: integer, format: int64 }
        publishedGeneration: { type: integer, format: int64 }
        computedAt: { type: string, format: date-time }
        durationMs: { type: integer, format: int64 }
        error: { type: string }
    ValidationHealth:
      type: string
      enum: [never_checked, running, current_clean, current_issues, incomplete, failed, stale]
    ValidateEnvelope:
      type: object
      required: [status, health, generation, publishedGeneration]
      properties:
        refreshPending:
          type: boolean
          description: A server-owned refresh is queued, waiting for startup, or executing, including any coalesced replacement.
        status: { type: string, enum: [never_ran, running, ok, error] }
        health:
          $ref: "#/components/schemas/ValidationHealth"
        generation: { type: integer, format: int64 }
        publishedGeneration: { type: integer, format: int64 }
        startedAt: { type: string, format: date-time }
        computedAt: { type: string, format: date-time }
        durationMs: { type: integer, format: int64 }
        error: { type: string }
        snapshot:
          $ref: "#/components/schemas/ValidationSnapshot"
    ValidationSnapshot:
      type: object
      required: [vaultIdentity, generation, scope, selectedChecks, startedAt, finishedAt, durationMs, completion, issueCount, errorCount, affectedFileCount, affectedNoteCount, repairActionCount, checks]
      properties:
        issueCodes:
          description: Complete sorted issue-code vocabulary for this generation, independent of loaded pages or filters.
          type: array
          items: { type: string }
        vaultIdentity: { type: string }
        generation: { type: integer, format: int64 }
        scope: { type: string }
        selectedChecks:
          type: array
          items: { type: string }
        schemaIdentity: { type: string }
        configIdentity: { type: string }
        inputRevision: { type: string }
        startedAt: { type: integer, format: int64 }
        finishedAt: { type: integer, format: int64 }
        durationMs: { type: integer, format: int64 }
