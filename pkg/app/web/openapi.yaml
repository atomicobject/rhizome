      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StagedReadRequest"
      responses:
        "200":
          description: Candidate values for a view field
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ViewFieldCandidatesResponse"
        "400":
