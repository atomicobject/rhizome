          $ref: "#/components/schemas/OntologyShapeMembers"
        links:
          $ref: "#/components/schemas/OntologyShapeLinks"
        folders:
          $ref: "#/components/schemas/OntologyShapeFolders"
    OntologyShapeMembers:
      type: object
      required: [types, interfaces, untyped]
      properties:
        types:
          type: array
          items:
            $ref: "#/components/schemas/OntologyShapeMember"
        interfaces:
          type: array
          items:
            $ref: "#/components/schemas/OntologyShapeInterface"
        untyped:
          $ref: "#/components/schemas/OntologyShapeUntyped"
    OntologyShapeMember:
      type: object
      required: [name, kind, count, issueCount, lastChanged, lifecycle, gaps, targetSets]
      properties:
        name: { type: string }
        kind: { type: string, enum: [type] }
        count: { type: integer }
        issueCount: { type: integer }
        lastChanged: { type: integer, format: int64 }
        lifecycle:
          nullable: true
          allOf:
            - $ref: "#/components/schemas/OntologyShapeLifecycle"
        gaps:
          type: array
          items:
            $ref: "#/components/schemas/OntologyShapeGap"
        targetSets:
          type: array
          items:
            $ref: "#/components/schemas/OntologyShapeTargetSet"
    OntologyShapeInterface:
      type: object
      required: [name, count, issueCount, lastChanged, lifecycle, gaps, implementors]
      properties:
        name: { type: string }
        count: { type: integer }
        issueCount: { type: integer }
        lastChanged: { type: integer, format: int64 }
        lifecycle:
          nullable: true
          allOf:
            - $ref: "#/components/schemas/OntologyShapeLifecycle"
        gaps:
          type: array
          items:
            $ref: "#/components/schemas/OntologyShapeGap"
        implementors: { type: array, items: { type: string } }
    OntologyShapeUntyped:
      type: object
      required: [count, links]
      properties:
        count: { type: integer }
        links: { type: integer }
    OntologyShapeLifecycle:
      type: object
      required: [field, values]
      properties:
        field: { type: string }
        values:
          type: array
          items:
            $ref: "#/components/schemas/OntologyShapeValue"
    OntologyShapeValue:
      type: object
      required: [name, count]
      properties:
        name: { type: string }
        count: { type: integer }
    OntologyShapeGap:
      type: object
      required: [field, empty]
      properties:
        field: { type: string }
        empty: { type: integer }
    OntologyShapeTargetSet:
      type: object
      required: [types, records]
      properties:
        types: { type: array, items: { type: string }, description: Sorted set of other concrete types and __untyped__ reached by each record; excludes its own type. }
        records: { type: integer }
    OntologyShapeLinks:
      type: object
      required: [pairs]
      properties:
        pairs:
          type: array
          items:
            $ref: "#/components/schemas/OntologyShapePair"
    OntologyShapePair:
      type: object
      required: [a, b, links, relationLinks, plainLinks, fields]
      properties:
        a: { type: string, description: Concrete type or __untyped__; lexically at most b. }
        b: { type: string, description: Concrete type or __untyped__; equals a for links among one type. }
        links: { type: integer }
        relationLinks: { type: integer }
        plainLinks: { type: integer }
        fields:
          type: array
          items:
            $ref: "#/components/schemas/OntologyShapePairField"
    OntologyShapePairField:
      type: object
      required: [type, field, count]
      properties:
        type: { type: string }
        field: { type: string }
        count: { type: integer, description: Distinct note pairs using this field; counts may sum above relationLinks. }
    OntologyShapeFolders:
      type: object
      required: [rows]
      properties:
        rows:
          type: array
          items:
            $ref: "#/components/schemas/OntologyShapeFolder"
    OntologyShapeFolder:
      type: object
      required: [folder, total, untyped, typed, untypedLinksTo]
      properties:
        folder: { type: string, description: Top-level folder; empty for vault-root notes. }
        total: { type: integer }
        untyped: { type: integer }
        typed: { type: object, additionalProperties: { type: integer } }
        untypedLinksTo: { type: object, additionalProperties: { type: integer } }
    ViewTarget:
      type: object
      required: [kind, name, choices, defaultChoiceId]
      properties:
        kind:
          type: string
          enum: [type, interface, group, node, standalone, workspace]
        name: { type: string, description: Concrete target name; empty for the workspace target. }
        defaultChoiceId: { type: string }
        choices:
          type: array
          items:
            $ref: "#/components/schemas/ViewChoice"
    ViewChoice:
      type: object
      required: [id, name, renderer]
      properties:
        id: { type: string }
        name: { type: string }
        renderer:
          type: string
          enum: [overview, table, card, kanban, read, source, custom]
        viewId: { type: string }
        variant:
          type: string
          enum: [table, card, kanban]
        custom: { type: boolean }
    ViewCatalogEntry:
      type: object
      required: [id, name, source, mount, defaults, variants, definition]
      properties:
        id: { type: string }
        name: { type: string }
        configuration:
          type: object
          additionalProperties: true
        description: { type: string }
        generated: { type: boolean }
        origin:
          type: string
          enum: [bundled, repository, generated]
          description: Where the definition comes from; the server always sends it. A repository view replaces the bundled view with the same id; generated views are runtime defaults for types and interfaces.
        source:
          $ref: "#/components/schemas/ViewSourceSpec"
        mount:
          $ref: "#/components/schemas/ViewMountSpec"
        defaults:
          $ref: "#/components/schemas/ViewDefaultsSpec"
        variants:
          $ref: "#/components/schemas/ViewVariantSet"
        availableVariants:
          type: array
          items: { type: string }
        definition:
          $ref: "#/components/schemas/ViewDefinition"
        issues:
          type: array
          items:
            $ref: "#/components/schemas/ViewIssue"
    ViewDefinition:
      type: object
      additionalProperties: true
      required: [apiVersion, id, name, source, mount, variants]
      properties:
        apiVersion: { type: string }
        id: { type: string }
        name: { type: string }
        configuration:
          type: object
          additionalProperties: true
        description: { type: string }
        generated: { type: boolean }
        source:
          $ref: "#/components/schemas/ViewSourceSpec"
        mount:
          $ref: "#/components/schemas/ViewMountSpec"
        defaults:
          $ref: "#/components/schemas/ViewDefaultsSpec"
        variants:
          $ref: "#/components/schemas/ViewVariantSet"
    ViewSourceSpec:
      type: object
      additionalProperties: true
      required: [kind]
      properties:
        kind: { type: string }
        type: { type: string }
        interface: { type: string }
        queryRecipe: { type: string }
        resultPath: { type: string }
        entry:
          type: string
          description: Entry file of a custom view, relative to the definition's folder. The view renders at /views/{id}.
        inputs:
          type: object
          additionalProperties:
            type: string
    ViewMountSpec:
      type: object
      additionalProperties: true
      required: [kind]
      properties:
        kind: { type: string }
        type: { type: string }
        interface: { type: string }
        group: { type: string }
        order: { type: integer }
        default: { type: boolean }
        hidden: { type: boolean }
        replaceGenerated: { type: boolean }
    ViewDefaultsSpec:
      type: object
      additionalProperties: true
      properties:
        variant: { type: string }
        first: { type: integer }
        sourceCap: { type: integer }
        search: { type: string }
        filters:
          type: array
          items:
            $ref: "#/components/schemas/ViewFilterSpec"
        sort:
          type: array
          items:
            $ref: "#/components/schemas/ViewSortSpec"
        group:
          $ref: "#/components/schemas/ViewGroupSpec"
        page:
          $ref: "#/components/schemas/ViewPageRequest"
    ViewVariantSet:
      type: object
      additionalProperties: true
      properties:
        table:
          $ref: "#/components/schemas/ViewTableVariant"
        card:
          $ref: "#/components/schemas/ViewCardSpec"
        kanban:
          $ref: "#/components/schemas/ViewKanbanVariant"
    ViewCardSpec:
      type: object
      additionalProperties: true
      properties:
        eyebrow: { type: string }
        title: { type: string }
        preview: { type: string }
        fields:
          type: array
          items:
            $ref: "#/components/schemas/ViewTableColumn"
    ViewKanbanVariant:
      type: object
      additionalProperties: true
      required: [columnField]
      properties:
        columnField: { type: string }
        hideEmptyColumns: { type: boolean }
        laneField: { type: string, description: Field that splits the board into lanes; empty uses the profile default and "none" disables lanes. }
        card:
          $ref: "#/components/schemas/ViewCardSpec"
    ViewCardLayout:
      type: object
      required: [title, fields]
      properties:
        eyebrow:
          $ref: "#/components/schemas/ViewTableColumn"
        title:
          $ref: "#/components/schemas/ViewTableColumn"
        preview:
          $ref: "#/components/schemas/ViewTableColumn"
        fields:
          type: array
          items:
            $ref: "#/components/schemas/ViewTableColumn"
    ViewBoardLayout:
      type: object
      required: [columnField, editable, columns]
      properties:
        columnField: { type: string }
        editable: { type: boolean }
        columns:
          type: array
          items:
            $ref: "#/components/schemas/ViewBoardColumn"
        laneField: { type: string }
        lanes:
          type: array
          items:
            $ref: "#/components/schemas/ViewBoardLane"
    ViewBoardLane:
      type: object
      required: [key, value, label, count, cells]
      properties:
        key: { type: string }
        value: { type: string }
        label: { type: string }
        tone: { type: string }
        count: { type: integer }
        cells:
          type: array
          items:
            $ref: "#/components/schemas/ViewBoardLaneCell"
    ViewBoardLaneCell:
      type: object
      required: [value, rows]
      properties:
        value: { type: string }
        rows:
          type: array
          description: Indexes into ViewExecuteResponse.rows.
          items: { type: integer }
    ViewBoardColumn:
      type: object
      required: [key, value, label, count, rowStart, rowEnd]
      properties:
        key: { type: string }
        value: { type: string }
        label: { type: string }
        tone: { type: string }
        count: { type: integer }
        rowStart: { type: integer }
        rowEnd: { type: integer }
        collapsedByDefault: { type: boolean }
    ViewTableVariant:
      type: object
      additionalProperties: true
      properties:
        columns:
          type: array
          items:
            $ref: "#/components/schemas/ViewTableColumn"
        density: { type: string, enum: [two-line, one-line] }
    ViewTableColumn:
      type: object
      additionalProperties: true
      required: [field]
      properties:
        field: { type: string }
        label: { type: string }
    ViewExecuteRequest:
      type: object
      properties:
        variant: { type: string }
        filterPreset: { type: string }
        search: { type: string }
        filters:
          type: array
          items:
            $ref: "#/components/schemas/ViewFilterSpec"
        sort:
          type: array
          items:
            $ref: "#/components/schemas/ViewSortSpec"
        group:
          $ref: "#/components/schemas/ViewGroupSpec"
        page:
          $ref: "#/components/schemas/ViewPageRequest"
        source:
          $ref: "#/components/schemas/ViewSourceRequest"
        inputs:
          type: object
          additionalProperties:
            type: string
        editSession:
          $ref: "#/components/schemas/EditSessionReadRequest"
        columnField: { type: string, description: "Board column field: the view's configured column field or a lifecycle or ordered field (SPEC-0112). Empty keeps the configured field." }
        laneField: { type: string, description: "Board lane field, or \"none\" for no lanes. Empty uses the view's laneField, else the profile default." }
    ViewExecuteResponse:
      type: object
      required: [view, variant, state, columns, rows, pageInfo, definitionFingerprint, sourceFingerprint, executionFingerprint]
      properties:
        view:
          $ref: "#/components/schemas/ViewCatalogEntry"
        variant: { type: string }
        state:
          $ref: "#/components/schemas/ViewExecutionState"
        capabilities:
          type: array
          items:
            $ref: "#/components/schemas/ViewFieldCapability"
        columns:
          type: array
          items:
            $ref: "#/components/schemas/ViewTableColumn"
        rows:
          type: array
          items:
            $ref: "#/components/schemas/ViewTableRow"
        groups:
          type: array
          items:
            $ref: "#/components/schemas/ViewTableGroup"
        card:
          $ref: "#/components/schemas/ViewCardLayout"
        board:
          $ref: "#/components/schemas/ViewBoardLayout"
        pageInfo:
          $ref: "#/components/schemas/ViewPageInfo"
        profile:
          $ref: "#/components/schemas/TypeProfile"
        stats:
          $ref: "#/components/schemas/ViewExecutionStats"
        warnings:
          type: array
          items:
            $ref: "#/components/schemas/ViewWarning"
        constraintPlan: { type: boolean }
        pushedConstraints:
          $ref: "#/components/schemas/ViewSourceConstraints"
        residualConstraints:
          $ref: "#/components/schemas/ViewSourceConstraints"
        plan:
          $ref: "#/components/schemas/ViewConstraintPlanSummary"
        definitionFingerprint: { type: string }
        sourceFingerprint: { type: string }
        executionFingerprint: { type: string }
    ViewSourceConstraints:
      type: object
      properties:
        search: { type: string }
        filters:
          type: array
          items:
            $ref: "#/components/schemas/ViewFilterSpec"
        sort:
          type: array
          items:
            $ref: "#/components/schemas/ViewSortSpec"
        page:
          $ref: "#/components/schemas/ViewPageRequest"
    ViewConstraintPlanSummary:
      type: object
      properties:
        pushed:
          $ref: "#/components/schemas/ViewSourceConstraints"
        residual:
          $ref: "#/components/schemas/ViewSourceConstraints"
        candidateLimit: { type: integer }
        candidateCount: { type: integer }
        sourceCompleteness:
          type: string
          enum: [complete, bounded, unknown]
        reliability:
          type: string
          enum: [exact, cap_bound, not_planned]
        capPolicy:
          $ref: "#/components/schemas/ViewSourceCapPolicy"
        warnings:
          type: array
          items:
            $ref: "#/components/schemas/ViewWarning"
    ViewSourceCapPolicy:
      type: object
      properties:
        limit: { type: integer }
        source: { type: string }
    ViewExecutionState:
      allOf:
        - $ref: "#/components/schemas/ViewExecuteRequest"
        - type: object
          required: [page]
    ViewTableRow:
      type: object
      required: [ref]
      properties:
        ref:
          $ref: "#/components/schemas/NodeRef"
        path: { type: string }
        title: { type: string }
        resolvedType: { type: string }
        updatedAt: { type: integer, format: int64 }
        hasIssues: { type: boolean }
        tags:
          type: array
          items: { type: string }
        fields:
          type: object
          additionalProperties: true
        relationValues:
          type: object
          additionalProperties:
            type: array
            items:
              $ref: "#/components/schemas/ViewTableRelationValue"
    ViewTableRelationValue:
      type: object
      required: [value]
      properties:
        value: { type: string }
        ref:
          $ref: "#/components/schemas/NodeRef"
        title: { type: string }
        status:
          $ref: "#/components/schemas/ViewTableRelationStatus"
    ViewTableRelationStatus:
      type: object
      description: >-
        The linked record's lifecycle value from its type's profile. Board and card executions set it for
        up to eight values per field and row; table executions leave it unset.
      required: [value]
      properties:
        value: { type: string }
        label: { type: string }
        tone: { type: string }
        stage: { type: string, enum: [open, active, done, dropped] }
    ViewFieldCapability:
      type: object
      required: [key, sortable, groupable]
      properties:
        key: { type: string }
        policyReason: { type: string }
        label: { type: string }
        valueKind: { type: string }
        canonicalField: { type: string }
        sourceKeys:
          type: array
          items: { type: string }
        sourceKind: { type: string }
        semanticRole: { type: string }
        required: { type: boolean }
        importance:
          type: string
          enum: [KEY, NORMAL, DETAIL]
          description: Defaults to NORMAL when the schema omits importance.
        sortable: { type: boolean }
        indexedSortable: { type: boolean }
        residualSortable: { type: boolean }
        groupable: { type: boolean }
        filterOps:
          type: array
          items: { type: string }
        indexedFilterOps:
          type: array
          items: { type: string }
        residualFilterOps:
          type: array
          items: { type: string }
        completeness:
          type: string
          enum: [complete, bounded, unknown]
        source: { type: string }
        values:
          type: array
          items: {}
        facets:
          $ref: "#/components/schemas/ViewFacetCapability"
        filter:
          $ref: "#/components/schemas/ViewFilterCapability"
        group:
          $ref: "#/components/schemas/ViewGroupCapability"
        enumName: { type: string }
        enumValues:
          type: array
          items:
            $ref: "#/components/schemas/ViewFieldEnumValue"
        edit:
          $ref: "#/components/schemas/ViewEditCapability"
    ViewFacetCapability:
      type: object
      properties:
        values:
          type: array
          items: {}
        labels:
          type: object
          description: Target note titles for link values, keyed by value.
          additionalProperties: { type: string }
    ViewFilterCapability:
      type: object
      properties:
        ops:
          type: array
          items: { type: string }
        options:
          type: array
          items: {}
    ViewGroupCapability:
      type: object
      properties:
        values:
          type: array
          items:
            $ref: "#/components/schemas/ViewFieldEnumValue"
    ViewFieldEnumValue:
      type: object
      required: [value]
      properties:
        value: { type: string }
        label: { type: string }
        description: { type: string }
        rank: { type: integer }
        tone: { type: string }
        collapsedByDefault: { type: boolean }
        stage: { type: string, enum: [open, active, done, dropped] }
        stageDeclared: { type: boolean }
    ViewSaveRequest:
      type: object
      required: [state]
      properties:
        definitionFingerprint: { type: string, description: The definition fingerprint the client loaded; a mismatch returns 409. }
        state:
          $ref: "#/components/schemas/ViewSaveState"
    ViewSaveState:
      type: object
      description: >-
        View state to save. variant, search, filters, and sort are written as given; empty ones remove
        their keys. group, columns, density, columnField, and laneField leave the view's setting unchanged
        when absent, so a client that omits them never deletes authored keys.
      properties:
        variant: { type: string }
        search: { type: string }
        filters:
          type: array
          items:
            $ref: "#/components/schemas/ViewFilterSpec"
        sort:
          type: array
          items:
            $ref: "#/components/schemas/ViewSortSpec"
        group:
          $ref: "#/components/schemas/ViewGroupSpec"
          description: >-
            Absent leaves the grouping unchanged. A group whose field is empty or "none" saves an explicit
            "no grouping" (group field none) that no default grouping overrides.
        columns:
          type: array
          description: Visible table columns in display order; absent or empty leaves them unchanged.
          items:
            $ref: "#/components/schemas/ViewTableColumn"
        density:
          type: string
          enum: [two-line, one-line, ""]
          description: Absent leaves the density unchanged; empty removes it so the default applies.
        columnField: { type: string, description: Board column field; absent leaves it unchanged. }
        laneField:
          type: string
          description: Board lane field, or "none" to turn lanes off. Absent leaves it unchanged; empty removes it so the default lanes apply.
    ViewSaveResponse:
      type: object
      required: [id, path, created]
      properties:
        id: { type: string, description: The saved view's id, which now replaces the generated layouts when it was created from one. }
        path: { type: string, description: Vault-relative path of the written YAML file. }
        created: { type: boolean }
    TypeProfile:
      type: object
      description: Schema-derived profile of a type or interface (SPEC-0112).
      required: [shape]
      properties:
        shape: { type: string, enum: [workflow, contract, dated, catalog, reference] }
        lifecycleField: { type: string }
        orderedFields: { type: array, items: { type: string } }
        categoryFields: { type: array, items: { type: string } }
        summaryField: { type: string }
        primaryDateField: { type: string }
        peopleFields: { type: array, items: { type: string } }
        keyTextFields: { type: array, items: { type: string } }
        relationFields: { type: array, items: { type: string } }
        reverseFields: { type: array, items: { type: string } }
        gapFields: { type: array, items: { type: string }, description: KEY fields other than required, lifecycle, and @requiresWhen-conditional fields. }
    ViewExecutionStats:
      type: object
      description: Summary of every matching row, computed before paging.
      required: [total, issueCount, staleCount]
      properties:
        total: { type: integer }
        issueCount: { type: integer }
        staleCount: { type: integer }
        lifecycle:
          type: array
          items:
            $ref: "#/components/schemas/ViewStatsValueCount"
        kinds:
          type: array
          items:
            $ref: "#/components/schemas/ViewStatsValueCount"
        fields:
          type: array
          items:
            $ref: "#/components/schemas/ViewStatsFieldFill"
        dates:
          $ref: "#/components/schemas/ViewStatsDateRange"
        truncated:
          type: boolean
          description: True when the source cap may have cut rows, so these statistics cover only the rows the source returned.
    ViewStatsValueCount:
      type: object
      required: [value, count]
      properties:
        value: { type: string }
        count: { type: integer }
    ViewStatsFieldFill:
      type: object
      required: [field, filled]
      properties:
        field: { type: string }
        filled: { type: integer }
    ViewStatsDateRange:
      type: object
      required: [field]
      properties:
        field: { type: string }
        first: { type: string }
        last: { type: string }
        months:
          type: array
          items:
            $ref: "#/components/schemas/ViewStatsValueCount"
    ViewEditCapability:
      type: object
      required: [kind, operation, field]
      properties:
        kind: { type: string }
        operation: { type: string }
        field: { type: string }
        list: { type: boolean }
        inputMode: { type: string }
        valueKind: { type: string }
        options:
          type: array
          items: { type: string }
        targetType: { type: string }
        candidates:
          type: array
          items:
            $ref: "#/components/schemas/ViewEditCandidate"
    ViewEditCandidate:
      type: object
      required: [ref, value, label]
      properties:
        ref:
          $ref: "#/components/schemas/NodeRef"
        value: { type: string }
        label: { type: string }
        path: { type: string }
    ViewFieldCandidatesResponse:
      type: object
      required: [field]
      properties:
        field: { type: string }
        targetType: { type: string }
        candidates:
          type: array
          items:
            $ref: "#/components/schemas/ViewEditCandidate"
        hasMore: { type: boolean }
    ViewFilterSpec:
      type: object
      additionalProperties: true
      required: [field, op]
      description: >-
        A filter on a row field. The reserved field "stale" (unless the source has a field by that name)
        takes op eq and value "true" or "false" and matches rows in an active-stage lifecycle value
        unchanged for 30 days by the server clock, the rule stats.staleCount uses; it always runs residually.
      properties:
        field: { type: string }
        op: { type: string, description: "eq, neq, in, contains, gt, gte, lt, lte, exists, or missing (no value; SPEC-0112)." }
        value: {}
        values:
          type: array
          items: {}
    ViewSortSpec:
      type: object
      additionalProperties: true
      required: [field]
      properties:
        field: { type: string }
        direction: { type: string }
    ViewGroupSpec:
      type: object
      additionalProperties: true
      properties:
        field: { type: string, description: 'The field to group by. "none" as the only field means explicitly ungrouped.' }
        fields:
          type: array
          items: { type: string }
        values:
          type: array
          items:
            $ref: "#/components/schemas/ViewGroupValueSpec"
        bucket: { type: string, enum: [month], description: Groups a Date or DateTime field by calendar month, newest first. }
    ViewGroupValueSpec:
      type: object
      required: [value]
      properties:
        field: { type: string }
        value: { type: string }
        label: { type: string }
        order: { type: integer }
        collapsedByDefault: { type: boolean }
    ViewPageRequest:
      type: object
      properties:
        offset: { type: integer }
        first: { type: integer }
    ViewSourceRequest:
      type: object
