openapi: 3.0.3
info:
  title: Rhizome Public REST API
  description: Public `/api/v1` REST transport contract. GraphQL object fields are owned by SDL/introspection, not OpenAPI.
  version: 0.0.1
paths:
  /api/v1/files/tree:
    get:
      operationId: getPublicTree
      parameters:
        - in: query
          name: path
          schema:
            type: string
        - in: query
          name: limit
          schema:
            type: integer
        - in: query
          name: editSessionId
          schema:
            type: string
      responses:
        "200":
          description: Tree payload
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TreeResponse"
  /api/v1/files/view:
    get:
      operationId: getPublicFileView
      parameters:
        - in: query
          name: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: File view payload
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FileView"
  /api/v1/files/rendered:
    get:
      operationId: getPublicRenderedFile
      parameters:
        - in: query
          name: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Rendered note payload
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RenderedFile"
  /api/v1/html-viewers:
    post:
      operationId: createHTMLViewer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/HTMLViewerCreateRequest"
      responses:
        "201":
          description: Ephemeral isolated HTML viewer capability
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HTMLViewerSession"
        "400":
          description: Invalid note or origin request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Note is not currently admitted for active viewing
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/v1/html-viewers/{id}:
    delete:
      operationId: revokeHTMLViewer
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Viewer capability revoked
  /api/v1/suggest:
    get:
      operationId: getPublicSuggestions
      parameters:
        - in: query
          name: q
          required: true
          schema:
            type: string
        - in: query
          name: limit
          schema:
            type: integer
      responses:
        "200":
          description: Suggestion payload
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuggestResponse"
  /api/v1/search:
    get:
      operationId: searchPublicPaths
      parameters:
        - in: query
          name: q
          required: true
          schema:
            type: string
        - in: query
          name: seed
          schema:
            type: string
        - in: query
          name: intent
          schema:
            type: string
        - in: query
          name: scope
          description: Result scope, all, notes, or code.
          schema:
            type: string
            enum: [all, notes, code]
        - in: query
          name: pathPrefix
          description: Exact vault-relative path or descendant folder to search.
          schema:
            type: string
        - in: query
          name: folder
          description: Alias for pathPrefix.
          schema:
            type: string
        - in: query
          name: noteType
          description: Resolved owning note ontology type.
          schema:
            type: string
        - in: query
          name: limit
          schema:
            type: integer
        - in: query
          name: budget
          schema:
            type: integer
        - in: query
          name: continuationToken
          description: Opaque token returned by a prior search response.
          schema:
            type: string
      responses:
        "200":
          description: Search payload
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SearchResponse"
  /api/v1/search/notes:
    get:
      operationId: searchPublicNotes
      parameters:
        - in: query
          name: q
          required: true
          schema:
            type: string
        - in: query
          name: type
          schema:
            type: string
        - in: query
          name: pathPrefix
          schema:
            type: string
        - in: query
          name: tag
          schema:
            type: string
        - in: query
          name: limit
          schema:
            type: integer
        - in: query
          name: offset
          schema:
            type: integer
      responses:
        "200":
          description: Note search payload
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NoteSearchResponse"
  /api/v1/graphs/global:
    get:
      operationId: getPublicGlobalGraph
      parameters:
        - in: query
          name: limit
          schema:
            type: integer
        - in: query
          name: depth
          schema:
            type: integer
        - in: query
          name: notesOnly
          schema:
            type: boolean
        - in: query
          name: diagnostics
          schema:
            type: boolean
      responses:
        "200":
          description: Graph payload
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GraphResponse"
        "503":
          $ref: "#/components/responses/IndexInitializing"
  /api/v1/graphs/local:
    get:
      operationId: getPublicLocalGraph
      parameters:
        - in: query
          name: path
          schema:
            type: string
        - in: query
          name: ref
          schema:
            type: string
        - in: query
          name: nodeId
          schema:
            type: string
        - in: query
          name: kind
          schema:
            type: string
        - in: query
          name: structural
          schema:
            type: string
        - in: query
          name: limit
          schema:
            type: integer
        - in: query
          name: depth
          schema:
            type: integer
        - in: query
          name: notesOnly
          schema:
            type: boolean
        - in: query
          name: diagnostics
          schema:
            type: boolean
      responses:
        "200":
          description: Graph payload
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GraphResponse"
        "503":
          $ref: "#/components/responses/IndexInitializing"
  /api/v1/graphs/expand:
    get:
      operationId: getPublicExpandedModuleGraph
      parameters:
        - in: query
          name: module
          required: true
          schema:
            type: string
        - in: query
          name: limit
          schema:
            type: integer
        - in: query
          name: diagnostics
          schema:
            type: boolean
      responses:
        "200":
          description: Graph payload
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GraphResponse"
        "503":
          $ref: "#/components/responses/IndexInitializing"
  /api/v1/ontology/summary:
    get:
      operationId: getPublicOntologySummary
      responses:
        "200":
          description: Ontology summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OntologySummaryResponse"
        "503":
          $ref: "#/components/responses/IndexInitializing"
  /api/v1/display-groups:
    get:
      operationId: getPublicDisplayGroups
      description: Every effective display group with the members the Notes rail shows under it, sorted by name. Ungrouped roots form the rail's "Other" group, which absorbs an authored group of that name and sorts last. Groups without roots are omitted.
      responses:
        "200":
          description: Display groups
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DisplayGroupsResponse"
        "503":
          $ref: "#/components/responses/IndexInitializing"
  /api/v1/ontology/types:
    get:
      operationId: getPublicOntologyTypes
      responses:
        "200":
          description: Ontology type summaries
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/OntologyTypeSummary"
        "503":
          $ref: "#/components/responses/IndexInitializing"
  /api/v1/ontology/types/{name}:
    get:
      operationId: getPublicOntologyType
      parameters:
        - in: path
          name: name
          required: true
          schema:
            type: string
        - in: query
          name: limit
          description: For __all__ only, returns the N most recently changed notes, including untyped notes, newest first. Enrichment is capped before reading records.
          schema: { type: integer, minimum: 1, maximum: 500 }
        - in: query
          name: notes
          required: false
          description: "`none` returns schema documentation and counts without the notes list."
          schema:
            type: string
            enum: [none]
      responses:
        "200":
          description: Ontology type detail. Example items may be file-root notes or embedded-node instances; `ref` is canonical and `path` is the compatibility string form.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OntologyTypeResponse"
        "400":
          description: Invalid limit
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          $ref: "#/components/responses/IndexInitializing"
    post:
      operationId: readPublicOntologyType
      description: Same as GET, with an optional edit session whose staged edits the listing reflects.
      parameters:
        - in: path
          name: name
          required: true
          schema:
            type: string
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StagedReadRequest"
      responses:
        "200":
          description: Ontology type detail with staged edits applied.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OntologyTypeResponse"
        "400":
          description: Invalid edit session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "413":
          description: Request body too large
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          $ref: "#/components/responses/IndexInitializing"
  /api/v1/ontology/shape:
    get:
      operationId: getPublicOntologyShape
      description: Scope aggregates from a committed index snapshot. Embedded types are excluded. Note pairs count once; broad Note fields count as plain links. Interfaces use their own profiles over note-type implementors. Selected parts are omitted when unrequested; totals and rebuilding are always returned.
      parameters:
        - in: query
          name: parts
          description: Comma-separated subset of members,links,folders; defaults to all three.
          schema: { type: string, default: "members,links,folders" }
      responses:
        "200":
          description: Scope shape; rebuilding signals index republication.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OntologyShapeResponse"
        "400":
          description: Invalid part selector
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          $ref: "#/components/responses/IndexInitializing"
  /api/v1/ontology/atlas:
    get:
      operationId: getPublicOntologyAtlas
      responses:
        "200":
          description: Ontology atlas (all types + interfaces with vault counts)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OntologyAtlasResponse"
        "503":
          $ref: "#/components/responses/IndexInitializing"
  /api/v1/ontology/inspect:
    get:
      operationId: getPublicOntologyInspect
      parameters:
        - in: query
          name: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Ontology inspect payload
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OntologyInspectResponse"
        "503":
          $ref: "#/components/responses/IndexInitializing"
  /api/v1/ontology/query-schema:
    get:
      operationId: getPublicOntologyQuerySchema
      responses:
        "200":
          description: Ontology GraphQL schema
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OntologyQuerySchemaResponse"
  /api/v1/status:
    get:
      operationId: getPublicStatus
      responses:
        "200":
          description: Public status payload
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StatusResponse"
  /api/v1/capabilities:
    get:
      operationId: getPublicCapabilities
      responses:
        "200":
          description: Public API capability discovery payload
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublicCapabilitiesResponse"
  /api/v1/validate:
    get:
      deprecated: true
      operationId: getRetiredValidation
      responses:
        "410":
          description: Retired result contract. Use /api/v2/validate and generation-bound diagnostic pages.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/v2/validate:
    get:
      operationId: getPublicValidate
      responses:
        "200":
          description: Cached validation lifecycle and generation-bound snapshot metadata
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidateEnvelope"
  /api/v2/validate/refresh:
    post:
      operationId: refreshPublicValidation
      responses:
        "202":
          description: Validation refresh queued for the runtime lifetime
          content:
            application/json:
              schema:
                type: object
                required: [accepted]
                properties:
                  accepted: { type: boolean }
        "503":
          description: Validation runtime is initializing
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/v1/validation/diagnostics:
    get:
      operationId: getPublicValidationDiagnostics
      parameters:
        - name: generation
          in: query
          required: true
          schema: { type: integer, format: int64, minimum: 1 }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 200, default: 100 }
        - name: cursor
          in: query
          schema: { type: string }
        - name: check
          in: query
          schema: { type: string }
        - name: code
          in: query
          schema: { type: string }
        - name: variant
          in: query
          description: Variant key within the selected code; requires code.
          schema: { type: string }
        - name: path
          in: query
          schema: { type: string }
        - name: text
          in: query
          schema: { type: string }
        - name: scopeKind
          in: query
          description: A type scope includes issues inside notes currently resolved to that type as well as schema issues about it.
          schema: { type: string, enum: [file, note, node, type, interface] }
        - name: scopeKey
          in: query
          schema: { type: string }
        - name: repairAvailability
          in: query
          description: present/absent test for any repair action; applicable/inapplicable test for a safe or needs_confirmation action (agent_required guidance is not applicable).
          schema: { type: string, enum: [any, present, absent, applicable, inapplicable], default: any }
        - name: sort
          in: query
          description: file orders by primary path (else first affected path, else vault-wide) and adds fileTotals.
          schema: { type: string, enum: [diagnostic_order, file], default: diagnostic_order }
      responses:
        "200":
          description: One generation-bound page of cached validation diagnostics
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationDiagnosticPage"
        "400":
          description: Invalid page limit, cursor, filter, or sort
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "410":
          description: Requested validation generation has expired
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/v1/validation/summaries:
    post:
      operationId: getPublicValidationScopeSummaries
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ValidationScopeSummaryRequest"
      responses:
        "200":
          description: Batched generation-bound validation summaries for visible scopes
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationScopeSummaryResponse"
        "400":
          description: Invalid scope request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "410":
          description: Requested validation generation has expired
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/v1/validation/groups:
    post:
      operationId: getPublicValidationIssueGroups
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ValidationIssueGroupRequest"
      responses:
        "200":
          description: Generation-bound issue counts grouped by check, code, and variant for one scope and filter
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationIssueGroupResponse"
        "400":
          description: Invalid scope or filter
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "410":
          description: Requested validation generation has expired
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/v1/validation/repair-reviews:
    post:
      operationId: createPublicValidationRepairReview
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ValidationRepairReviewCreateRequest"
      responses:
        "201":
          description: Server-owned repair review with exact diffs and confirmation requirements
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RepairReview"
        "409":
          description: Selection, transaction, generation, or manual-draft conflict
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          description: Live repair authority is unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/v1/validation/repair-reviews/{id}:
    get:
      operationId: getPublicValidationRepairReview
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Current repair review state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RepairReview"
        "404":
          description: Review is absent, was lost on restart, or belongs to another vault
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "410":
          description: Review expired
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/v1/validation/repair-reviews/{id}/apply:
    post:
      operationId: applyPublicValidationRepairReview
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ValidationRepairReviewApplyRequest"
      responses:
        "200":
          description: Recorded canonical repair result; duplicate submissions return the same terminal outcome
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationRepairApplyResponse"
        "404":
          description: Review is absent, was lost on restart, or belongs to another vault
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Confirmation, generation, source, lifecycle, overlap, or apply conflict
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "410":
          description: Review expired
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/v1/events:
    get:
      operationId: streamPublicEvents
      responses:
        "200":
          description: Server-sent event stream of public invalidation envelopes
          content:
            text/event-stream:
              schema:
                type: string
  /api/v1/nodes/preview:
    get:
      operationId: getNodePreview
      parameters:
        - name: ref
          in: query
          required: true
          schema: { type: string }
          description: Note path, canonical node ref, or either with a fragment.
        - name: from
          in: query
          required: false
          schema: { type: string }
          description: Vault-relative path containing the link, used to resolve relative targets.
      responses:
        "200":
          description: Index-backed node hover preview
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NodePreview"
        "400":
          description: Missing or invalid ref
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Ref did not resolve
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "405":
          description: Method not allowed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          description: Ontology or index unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    post:
      operationId: readNodePreview
      description: Same as GET, with an optional edit session whose staged edits the preview reflects.
      parameters:
        - name: ref
          in: query
          required: true
          schema: { type: string }
          description: Note path, canonical node ref, or either with a fragment.
        - name: from
          in: query
          required: false
          schema: { type: string }
          description: Vault-relative path containing the link, used to resolve relative targets.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StagedReadRequest"
      responses:
        "200":
          description: Index-backed node hover preview
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NodePreview"
        "400":
          description: Missing or invalid ref
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Ref did not resolve
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "405":
          description: Method not allowed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          description: Ontology or index unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/v1/nodes/events:
    get:
      operationId: streamPublicNodeEvents
      parameters:
        - name: ref
          in: query
          required: true
          schema:
            type: array
            items: { type: string }
          style: form
          explode: true
        - name: nodeId
          in: query
          required: false
          schema:
            type: array
            items: { type: string }
          style: form
          explode: true
        - name: structural
          in: query
          required: false
          schema:
            type: array
            items: { type: string }
          style: form
          explode: true
        - name: kind
          in: query
          required: false
          schema:
            type: array
            items: { type: string }
          style: form
          explode: true
      responses:
        "200":
          description: Server-sent event stream scoped to one or more public node refs
          content:
            text/event-stream:
              schema:
                type: string
  /api/v1/graphql:
    post:
      operationId: queryPublicGraphQL
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OntologyQueryRequest"
      responses:
        "200":
          description: Public GraphQL result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OntologyQueryResult"
        "400":
          description: Public REST wrapper error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          $ref: "#/components/responses/IndexInitializing"
  /api/v1/graphql/schema:
    get:
      operationId: getPublicGraphQLSchema
      responses:
        "200":
          description: Public GraphQL SDL
          content:
            text/plain:
              schema:
                type: string
        "503":
          description: GraphQL schema unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/v1/query-recipes:
    get:
      operationId: listPublicQueryRecipes
      responses:
        "200":
          description: Saved query recipes
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublicQueryRecipeListResponse"
  /api/v1/query-recipes/{id}:
    get:
      operationId: getPublicQueryRecipe
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Saved query recipe
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QueryRecipe"
        "404":
          description: Recipe not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/v1/query-recipes/{id}/execute:
    post:
      operationId: executePublicQueryRecipe
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PublicQueryRecipeExecuteRequest"
      responses:
        "200":
          description: Query recipe run result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QueryRecipeRunResult"
        "400":
          description: Recipe input or compile error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          $ref: "#/components/responses/IndexInitializing"
  /api/v1/view-preferences:
    get:
      operationId: getViewPreferences
      description: Reads durable personal preferences without requiring a registered view or a ready index.
      parameters:
        - in: query
          name: scope
          required: true
          description: JSON-encoded ViewPreferenceScope, at most 4096 bytes.
          schema: { type: string, maxLength: 4096 }
      responses:
        "200":
          $ref: "#/components/responses/ViewPreferencesSnapshot"
        "400":
          $ref: "#/components/responses/ViewPreferencesInvalid"
    patch:
      operationId: patchViewPreferences
      description: Atomically sets and explicitly unsets named keys. Null is a stored value. Requires the current revision. Request bodies are limited to 256 KiB.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ViewPreferencesPatchRequest"
      responses:
        "200":
          $ref: "#/components/responses/ViewPreferencesSnapshot"
        "400":
          $ref: "#/components/responses/ViewPreferencesInvalid"
        "409":
          $ref: "#/components/responses/ViewPreferencesConflict"
  /api/v1/view-preferences/reset:
    post:
      operationId: resetViewPreferences
      description: Removes personal overrides while retaining the scope revision and migration tombstone. includeSlots resets the host and all its widget scopes atomically, including unmounted widgets, and closes migration for future widgets. Does not change shared view YAML.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ViewPreferencesResetRequest"
      responses:
        "200":
          $ref: "#/components/responses/ViewPreferencesSnapshot"
        "400":
          $ref: "#/components/responses/ViewPreferencesInvalid"
        "409":
          $ref: "#/components/responses/ViewPreferencesConflict"
  /api/v1/view-preferences/import:
    post:
      operationId: importViewPreferences
      description: >-
        Claims a legacy browser source migrationId once across all scopes in this vault.
        Imports fill missing keys without overwriting prior imports. Changes and reset permanently close scope migration.
        A suppressed import still claims its source. Repeated claims do not modify their target scope.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ViewPreferencesImportRequest"
      responses:
        "200":
          description: Current preferences and whether this request imported them
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ViewPreferencesSnapshot"
                  - type: object
                    required: [imported]
                    properties:
                      imported: { type: boolean }
        "400":
          $ref: "#/components/responses/ViewPreferencesInvalid"
  /api/v1/views:
    get:
      operationId: listPublicViews
      responses:
        "200":
          description: Configured view catalog
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ViewCatalog"
  /api/v1/views/{id}:
    get:
      operationId: getPublicView
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Configured view
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ViewCatalogEntry"
        "404":
          description: View not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/v1/views/{id}/execute:
    post:
      operationId: executePublicView
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ViewExecuteRequest"
      responses:
        "200":
          description: Configured view table result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ViewExecuteResponse"
        "400":
          description: Invalid view request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: View not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          $ref: "#/components/responses/IndexInitializing"
  /api/v1/views/{id}/save:
    post:
      operationId: savePublicView
      description: >-
        Writes the given view state to view YAML under .rhizome/views (SPEC-0112).
        From a generated view it creates a native view mounted on the type or
        interface with mount.replaceGenerated; from an authored view it updates that
        file's defaults and variants in place, preserving comments and other keys.
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ViewSaveRequest"
      responses:
        "200":
          description: View saved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ViewSaveResponse"
        "400":
          description: Invalid state, or the resulting definition fails view validation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: View not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: The target file changed since the view was loaded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/v1/views/{id}/field-candidates:
