name: Temporary Windows shortcut diagnostic

on:
  workflow_dispatch:
    inputs:
      team_api_origin:
        description: Optional team API origin override; defaults to the checked-in release origin
        type: string
        default: ''

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native:
    name: Native desktop (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: windows-x86_64
            artifact: windows-x64
    defaults:
      run:
        shell: bash
    env:
      CARGO_TERM_COLOR: always
      CGO_ENABLED: '1'
      RZM_DESKTOP_TEAM_API_ORIGIN: ${{ inputs.team_api_origin }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            desktop/package-lock.json
            web/package-lock.json

      - name: Set up Rust
        run: rustup toolchain install stable --profile minimal --component rustfmt --component clippy

      - name: Restore Rust dependencies
        id: rust-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            desktop/src-tauri/target
          key: desktop-portability-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('desktop/src-tauri/Cargo.lock') }}
          restore-keys: desktop-portability-${{ runner.os }}-${{ runner.arch }}-

      - name: Install Linux native dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            build-essential curl file libayatana-appindicator3-dev libssl-dev \
            librsvg2-dev libwebkit2gtk-4.1-dev libxdo-dev libglib2.0-bin patchelf \
            libfuse2t64 libsecret-tools xvfb dbus-x11 gnome-keyring xdotool imagemagick

      - name: Install JavaScript dependencies
        run: |
          npm ci --prefix web
          npm ci --prefix desktop

      - name: Test native file publication and session stores
        run: |
          go test -mod=vendor -tags fts5 -count=1 -v \
            ./pkg/fileio ./pkg/app/appbundle ./pkg/app/desktop ./pkg/app/repoexec ./pkg/app/update ./pkg/teamapi/session ./pkg/paths ./pkg/repositorytrust

      - name: Exercise Windows Credential Manager
        if: runner.os == 'Windows'
        env:
          TEAMAPI_NATIVE_STORE_TEST: '1'
        run: go test -mod=vendor -tags fts5 -count=1 -timeout 60s -v ./pkg/teamapi/session -run '^TestNativeStore'

      - name: Exercise Linux Secret Service
        if: runner.os == 'Linux'
        run: bash desktop/scripts/portability-keyring.sh .tmp/desktop-portability/keyring

      - name: Build the workspace and native CLI
        run: |
          team_origin="$(node --input-type=module -e 'import {desktopTeamAPIOrigin,releaseTeamAPIOrigin} from "./desktop/scripts/team-api-origin.mjs"; console.log(desktopTeamAPIOrigin(process.env,releaseTeamAPIOrigin))')"
          mkdir -p .tmp/desktop-portability
          printf '%s\n' "$team_origin" > .tmp/desktop-portability/team-api-origin.txt
          npm run build --prefix web
          go build -mod=vendor -tags fts5 \
            -ldflags "-X github.com/atomicobject/rhizome/pkg/vault/version.Version=0.0.0 -X github.com/atomicobject/rhizome/pkg/teamapi/session.DefaultOrigin=$team_origin" \
            -o ".tmp/desktop-portability/rzm$(go env GOEXE)" .
          node --input-type=module -e 'import { resolve } from "node:path"; console.log("RZM_DESKTOP_PREBUILT_RZM=" + resolve(".tmp/desktop-portability/rzm" + (process.platform === "win32" ? ".exe" : "")))' >> "$GITHUB_ENV"

      - name: Check desktop frontend
        run: npm run check --prefix desktop

      - name: Stage the release companion and frontend
        run: |
          npm run rzm --prefix desktop
          npm run build --prefix desktop

      - name: Check native Rust code
        env:
          TAURI_CONFIG: '{"bundle":{"externalBin":["binaries/rzm"],"createUpdaterArtifacts":false}}'
        run: |
          cargo fmt --manifest-path desktop/src-tauri/Cargo.toml --check
          if [[ "$RUNNER_OS" == Linux ]]; then
            xvfb-run -a dbus-run-session -- cargo test --manifest-path desktop/src-tauri/Cargo.toml --locked
          else
            cargo test --manifest-path desktop/src-tauri/Cargo.toml --locked
          fi
          cargo clippy --manifest-path desktop/src-tauri/Cargo.toml --locked --all-targets -- -D warnings

      - name: Build and inspect the unsigned native candidate
        env:
          TARGET: ${{ matrix.target }}
        run: |
          commit="$(git rev-parse HEAD)"
          digest="$(python3 -c 'import hashlib,sys; print(hashlib.file_digest(open(sys.argv[1],"rb"),"sha256").hexdigest())' "$RZM_DESKTOP_PREBUILT_RZM")"
          python3 scripts/release/build_native_desktop.py --target "$TARGET" \
            --rzm "$RZM_DESKTOP_PREBUILT_RZM" --canonical-sha256 "$digest" \
            --version 0.0.0 --commit "$commit" --output .tmp/desktop-portability/candidate \
            --evidence-dir .tmp/desktop-portability/build-evidence

      - name: Save compiled Rust dependencies
        if: success() && steps.rust-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            desktop/src-tauri/target
          key: ${{ steps.rust-cache.outputs.cache-primary-key }}

      - name: Compare Windows shortcuts with observer off then on
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $false
          $output = [IO.Path]::GetFullPath('.tmp/desktop-portability/smoke-pair')
          $null = New-Item -ItemType Directory -Force -Path $output
          $app = [IO.Path]::GetFullPath('desktop/src-tauri/target/release/rhizome-desktop.exe')
          $onScript = [IO.Path]::GetFullPath('desktop/scripts/portability-smoke.ps1')
          $offScript = [IO.Path]::GetFullPath('desktop/scripts/portability-smoke-observer-off.ps1')
          $pair = [ordered]@{
            startedUtc = [DateTime]::UtcNow.ToString('O')
            endedUtc = $null
            appPath = $app
            appSha256 = $null
            offScriptSha256 = $null
            setupFailure = $null
            arms = @()
          }
          try {
            $pair.appSha256 = (Get-FileHash -LiteralPath $app -Algorithm SHA256).Hash
            # Git's prior smoke bytes use LF even when checkout uses CRLF.
            $source = [IO.File]::ReadAllText($onScript).Replace("`r`n", "`n")
            $offSource = [regex]::Replace($source, '(?ms)^#region TemporaryKeyboardObserver\n.*?^#endregion TemporaryKeyboardObserver\n', '')
            [IO.File]::WriteAllText($offScript, $offSource, [Text.UTF8Encoding]::new($false))
            $pair.offScriptSha256 = (Get-FileHash -LiteralPath $offScript -Algorithm SHA256).Hash
            # e1defe9ff901835aaa9d8e31d391c39c722e8887 desktop/scripts/portability-smoke.ps1.
            if ($pair.offScriptSha256 -ne '64ce2f08555bf9d59caaf0b1dcf3096955003af259968ea201b9bbd68218a41a') {
              throw 'Observer-off smoke differs from the prior trace-only diagnostic.'
            }
          } catch {
            $pair.setupFailure = $_ | Out-String
          }
          foreach ($arm in @(
            @{ observer = 'off'; script = $offScript }
            @{ observer = 'on'; script = $onScript }
          )) {
            $armOutput = Join-Path $output $arm.observer
            $result = [ordered]@{
              observer = $arm.observer
              startedUtc = [DateTime]::UtcNow.ToString('O')
              endedUtc = $null
              exitCode = $null
              setupFailure = $null
              probeGap = $null
            }
            try {
              $null = New-Item -ItemType Directory -Force -Path $armOutput
              if ($arm.observer -eq 'off' -and $null -ne $pair.setupFailure) {
                throw $pair.setupFailure
              }
              & (Join-Path $PSHOME 'pwsh.exe') -NoProfile -NonInteractive -File $arm.script `
                -AppPath $app -OutputDir $armOutput *> (Join-Path $armOutput 'launch.log')
              $result.exitCode = $LASTEXITCODE
              if ($arm.observer -eq 'on') {
                $keyboardPath = Join-Path $armOutput 'smoke-keyboard.json'
                if (Test-Path -LiteralPath $keyboardPath) {
                  $keyboard = Get-Content -Raw -LiteralPath $keyboardPath | ConvertFrom-Json
                  if ($keyboard.setupFailure -or -not $keyboard.observer.ready -or -not $keyboard.observer.healthy) {
                    $result.probeGap = 'Observer setup or capture failed. See smoke-keyboard.json and smoke-keyboard.log.'
                  }
                } else {
                  $result.probeGap = 'Observer evidence is missing. See launch.log.'
                }
              }
            } catch {
              if ($null -eq $result.exitCode) { $result.setupFailure = $_ | Out-String }
              else { $result.probeGap = $_ | Out-String }
            }
            $result.endedUtc = [DateTime]::UtcNow.ToString('O')
            $pair.arms += $result
            $pair | ConvertTo-Json -Depth 6 | Set-Content -LiteralPath (Join-Path $output 'pair.json')
          }
          $pair.endedUtc = [DateTime]::UtcNow.ToString('O')
          $pair | ConvertTo-Json -Depth 6 | Set-Content -LiteralPath (Join-Path $output 'pair.json')
          if ($pair.setupFailure -or @($pair.arms | Where-Object {
            $null -eq $_.exitCode -or $_.exitCode -ne 0 -or $_.setupFailure -or $_.probeGap
          }).Count -gt 0) { exit 1 }

      - name: Exercise Linux X11 startup and New Window
        if: runner.os == 'Linux'
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
        run: |
          xvfb-run -a dbus-run-session -- bash desktop/scripts/portability-smoke.sh \
            desktop/src-tauri/target/release/rhizome-desktop .tmp/desktop-portability/smoke

      - name: Record candidate evidence scope
        if: always()
        run: |
          mkdir -p .tmp/desktop-portability
          cat > .tmp/desktop-portability/EVIDENCE.txt <<'EOF'
          Temporary Windows Ctrl+N diagnostic only. Do not merge this branch into PR 150.
          One observer-off launch followed by one observer-on launch shares the same built binary and worker.
          Each launch uses fresh fixture state. Either arm failing keeps the comparison failed.
          A passing sample does not resolve the original intermittent failure.
          Unsigned native portability candidate. Not a public release.
          The default team API origin comes from matching checked-in release builds.
          Manual builds may override it with a working nonsecret team_api_origin URL.
          Browser sign-in remains an interactive installed-app acceptance check.
          The app and companion use fixture version 0.0.0; automatic updates are disabled.
          The external smoke check exercises the unpackaged release executable.
          Native credential-store checks use isolated synthetic records only.
          Linux GUI evidence covers software-rendered X11 under Xvfb only.
          Installed GUI behavior, Wayland/GPU behavior, trusted OS signing and
          signed N-to-N+1 upgrades require their separate acceptance checks.
          EOF
          if [[ -f .tmp/desktop-portability/team-api-origin.txt ]]; then
            printf 'Team API origin: %s\n' "$(cat .tmp/desktop-portability/team-api-origin.txt)" >> .tmp/desktop-portability/EVIDENCE.txt
          else
            printf 'Team API origin: unavailable; build did not reach origin selection.\n' >> .tmp/desktop-portability/EVIDENCE.txt
          fi

      - name: Upload unsigned candidates and native evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: desktop-portability-unsigned-${{ matrix.artifact }}
          if-no-files-found: warn
          retention-days: 14
          path: |
            .tmp/desktop-portability/candidate/*
            .tmp/desktop-portability/build-evidence/**/*.log
            .tmp/desktop-portability/EVIDENCE.txt
            .tmp/desktop-portability/smoke/*.log
            .tmp/desktop-portability/smoke/*.json
            .tmp/desktop-portability/smoke/*.png
            .tmp/desktop-portability/smoke-pair/pair.json
            .tmp/desktop-portability/smoke-pair/**/*.log
            .tmp/desktop-portability/smoke-pair/**/*.json
            .tmp/desktop-portability/smoke-pair/**/*.png
            .tmp/desktop-portability/keyring/*.log
            .tmp/desktop-portability/keyring/*.json
