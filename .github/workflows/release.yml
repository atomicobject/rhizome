name: Release

on:
  # A release-PR merge pushes its plan to main. The protected release
  # environment admits only main, so publication cannot run from the PR ref.
  push:
    branches: [main]
    paths: [.github/release-plan.json]
  workflow_dispatch:
    inputs:
      candidate_only:
        description: Verify this workflow source without release refs, deployment or publication
        required: false
        default: true
        type: boolean
      release_pr:
        description: Publish this merged release PR when its merge started no release (set candidate_only to false)
        required: false
        default: ''
        type: string

permissions:
  contents: read

concurrency:
  group: public-release
  cancel-in-progress: false

jobs:
  select:
    name: Validate approved release source
    if: >-
      github.repository == 'atomicobject/rhizome' &&
      ((github.event_name == 'push' && github.ref == 'refs/heads/main') ||
       (github.event_name == 'workflow_dispatch' && (inputs.candidate_only || github.ref == 'refs/heads/main')))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      source: ${{ steps.selection.outputs.source }}
      version: ${{ steps.selection.outputs.version }}
      candidate_only: ${{ steps.selection.outputs.candidate_only }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Validate release approval or explicit candidate
        id: selection
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          SOURCE: ${{ github.sha }}
          CANDIDATE_ONLY: ${{ inputs.candidate_only && 'true' || 'false' }}
          RELEASE_PR: ${{ inputs.release_pr }}
        run: >-
          python3 scripts/release/ci_release_selection.py
          --event-file "$GITHUB_EVENT_PATH" --event-name "$EVENT_NAME"
          --source "$SOURCE" --candidate-only "$CANDIDATE_ONLY" --release-pr "$RELEASE_PR"

  common:
    name: Prepare frontend and native tools on Linux
    needs: select
    if: needs.select.outputs.source != ''
    runs-on: ubuntu-latest
    env:
      SOURCE: ${{ needs.select.outputs.source }}
      RELEASE_VERSION: ${{ needs.select.outputs.version }}
      CANDIDATE_ONLY: ${{ needs.select.outputs.candidate_only }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.select.outputs.source }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            web/package-lock.json
            desktop/package-lock.json
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Install signing test dependencies
        run: |
          npm --prefix desktop ci
          cargo fetch --locked --manifest-path scripts/release/updater-signature/Cargo.toml
      - name: Verify release helpers
        run: python3 -m unittest discover -s scripts/release -p '*_test.py'
      - name: Build shared frontend output
        run: |
          npm --prefix web ci
          python3 scripts/licenses/generate.py --check
          npm --prefix web run generate:api
          npm --prefix web run build
          npm --prefix desktop run build
          python3 scripts/release/ci_release_frontend.py create --source "$SOURCE" --version "$RELEASE_VERSION" --archive .tmp/ci-release/frontend.tar.gz
      - name: Cross-compile Mac credential scanner on Linux
        working-directory: ${{ runner.temp }}
        env:
          GOOS: darwin
          GOARCH: arm64
          CGO_ENABLED: '0'
        run: go install github.com/zricethezav/gitleaks/v8@v8.30.1
      - name: Stage native scanner
        run: |
          mkdir -p .tmp/ci-tools
          cp "$(go env GOPATH)/bin/darwin_arm64/gitleaks" .tmp/ci-tools/gitleaks
      - uses: actions/upload-artifact@v4
        with:
          name: release-frontend
          path: .tmp/ci-release/frontend.tar.gz
          retention-days: 1
          if-no-files-found: error
          include-hidden-files: true
      - uses: actions/upload-artifact@v4
        with:
          name: release-mac-scanner
          path: .tmp/ci-tools/gitleaks
          retention-days: 1
          if-no-files-found: error
          include-hidden-files: true

  linux:
    name: Build Linux CLI and AppImage
    needs: [select, common]
    runs-on: ubuntu-24.04
    env:
      SOURCE: ${{ needs.select.outputs.source }}
      RELEASE_VERSION: ${{ needs.select.outputs.version }}
      CANDIDATE_ONLY: ${{ needs.select.outputs.candidate_only }}
      RZM_DESKTOP_PREBUILT_FRONTEND: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.select.outputs.source }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: dtolnay/rust-toolchain@stable
      - uses: goto-bus-stop/setup-zig@v2
        with:
          version: 0.13.0
      - name: Install native Linux packaging dependencies
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev patchelf libfuse2t64
      - uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: '~> v2'
          install-only: true
      - name: Install credential scanner
        working-directory: ${{ runner.temp }}
        env:
          GOTOOLCHAIN: local
        run: go install github.com/zricethezav/gitleaks/v8@v8.30.1
      - uses: actions/download-artifact@v4
        with:
          name: release-frontend
          path: .tmp/ci-release
      - name: Restore verified common assets and build canonical Linux CLI
        run: |
          python3 scripts/release/ci_release_frontend.py extract --source "$SOURCE" --version "$RELEASE_VERSION" --archive .tmp/ci-release/frontend.tar.gz
          ./scripts/vendor/ensure_tree_sitter_sources.sh
          npm --prefix desktop ci
          export RZM_CI_RELEASE_VERSION="${RELEASE_VERSION#v}"
          python3 scripts/release/run_clean.py build -- goreleaser build --snapshot --clean --skip=before,post-hooks --id rzm-linux
          python3 - <<'PYCLI'
          import os
          from pathlib import Path
          files = list(Path('dist').glob('rzm-linux_linux_amd64*/rzm'))
          if len(files) != 1:
              raise SystemExit('Expected one canonical Linux x64 CLI')
          with open(os.environ['GITHUB_ENV'], 'a') as output:
              output.write(f'RZM_DESKTOP_PREBUILT_RZM={files[0].resolve()}\n')
          PYCLI
      - name: Package and inspect the native Linux desktop
        run: |
          production=(); candidate=()
          if [[ "$CANDIDATE_ONLY" == true ]]; then candidate=(--candidate-only); else production=(--production); fi
          digest="$(python3 -c 'import hashlib,os; print(hashlib.file_digest(open(os.environ["RZM_DESKTOP_PREBUILT_RZM"],"rb"),"sha256").hexdigest())')"
          python3 scripts/release/build_native_desktop.py --target linux-x86_64 \
            --rzm "$RZM_DESKTOP_PREBUILT_RZM" --canonical-sha256 "$digest" \
            --version "$RELEASE_VERSION" --commit "$SOURCE" "${production[@]}" --output .tmp/ci-native/linux
          python3 scripts/release/ci_release_artifacts.py collect --platform linux --source "$SOURCE" --version "$RELEASE_VERSION" --dist dist --candidate .tmp/ci-native/linux --output .tmp/ci-release/linux "${candidate[@]}"
      - uses: actions/upload-artifact@v4
        with:
          name: release-linux
          path: .tmp/ci-release/linux
          retention-days: 1
          if-no-files-found: error
          include-hidden-files: true

  windows:
    name: Build signed Windows CLI and NSIS
    needs: [select, common]
    runs-on: windows-2025
    environment: release
    defaults:
      run:
        shell: bash
    env:
      SOURCE: ${{ needs.select.outputs.source }}
      RELEASE_VERSION: ${{ needs.select.outputs.version }}
      CANDIDATE_ONLY: ${{ needs.select.outputs.candidate_only }}
      RZM_DESKTOP_PREBUILT_FRONTEND: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.select.outputs.source }}
          fetch-depth: 0
          persist-credentials: false
      - name: Require configured production Windows signing
        if: needs.select.outputs.candidate_only != 'true'
        env:
          WINDOWS_SIGNING_CONFIG: ${{ vars.WINDOWS_SIGNING_CONFIG }}
        run: |
          python3 - <<'PYCONFIG'
          import os, sys
          from pathlib import Path
          sys.path.insert(0, 'scripts/release')
          from windows_sign import configuration
          value = os.environ.get('WINDOWS_SIGNING_CONFIG', '').strip()
          if not value:
              raise SystemExit('Windows production signing is not configured; unsigned GUI candidates use Desktop portability CI')
          path = Path(os.environ['RUNNER_TEMP']) / 'windows-signing.json'
          path.write_text(value)
          configuration(path)
          PYCONFIG
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: dtolnay/rust-toolchain@stable
      - uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: '~> v2'
          install-only: true
      - name: Install credential scanner
        working-directory: ${{ runner.temp }}
        env:
          GOTOOLCHAIN: local
        run: go install github.com/zricethezav/gitleaks/v8@v8.30.1
      - uses: actions/download-artifact@v4
        with:
          name: release-frontend
          path: .tmp/ci-release
      - name: Restore verified common assets and build canonical Windows CLI
        env:
          GOOS: windows
          GOARCH: amd64
        run: |
          python3 scripts/release/ci_release_frontend.py extract --source "$SOURCE" --version "$RELEASE_VERSION" --archive .tmp/ci-release/frontend.tar.gz
          ./scripts/vendor/ensure_tree_sitter_sources.sh
          npm --prefix desktop ci
          export RZM_CI_RELEASE_VERSION="${RELEASE_VERSION#v}"
          python3 scripts/release/run_clean.py build -- goreleaser build --snapshot --clean --single-target --skip=before,post-hooks --id rzm-windows-amd64
          python3 - <<'PYCLI'
          import os
          from pathlib import Path
          files = list(Path('dist').glob('rzm-windows-amd64_windows_amd64*/rzm.exe'))
          if len(files) != 1:
              raise SystemExit('Expected one canonical Windows x64 CLI')
          with open(os.environ['GITHUB_ENV'], 'a') as output:
              output.write(f'RZM_DESKTOP_PREBUILT_RZM={files[0].resolve()}\n')
          PYCLI
      - name: Sign the canonical Windows CLI once
        if: needs.select.outputs.candidate_only != 'true'
        env:
          WINDOWS_SIGNING_SECRET: ${{ needs.select.outputs.candidate_only != 'true' && secrets.WINDOWS_SIGNING_SECRET || '' }}
        run: python3 scripts/release/windows_sign.py --config "$RUNNER_TEMP/windows-signing.json" --initial-cli "$RZM_DESKTOP_PREBUILT_RZM"
      - name: Compile Windows GUI without signing credentials
        run: |
          signing=()
          if [[ "$CANDIDATE_ONLY" != true ]]; then signing=(--production --windows-sign-config "$RUNNER_TEMP/windows-signing.json"); fi
          digest="$(python3 -c 'import hashlib,os; print(hashlib.file_digest(open(os.environ["RZM_DESKTOP_PREBUILT_RZM"],"rb"),"sha256").hexdigest())')"
          python3 scripts/release/build_native_desktop.py --target windows-x86_64 \
            --rzm "$RZM_DESKTOP_PREBUILT_RZM" --canonical-sha256 "$digest" \
            --version "$RELEASE_VERSION" --commit "$SOURCE" "${signing[@]}" --phase compile \
            --output .tmp/ci-native/windows
      - name: Sign installer and verify final Windows candidate
        env:
          WINDOWS_SIGNING_SECRET: ${{ needs.select.outputs.candidate_only != 'true' && secrets.WINDOWS_SIGNING_SECRET || '' }}
        run: |
          signing=()
          if [[ "$CANDIDATE_ONLY" != true ]]; then signing=(--production --windows-sign-config "$RUNNER_TEMP/windows-signing.json"); fi
          digest="$(python3 -c 'import hashlib,os; print(hashlib.file_digest(open(os.environ["RZM_DESKTOP_PREBUILT_RZM"],"rb"),"sha256").hexdigest())')"
          python3 scripts/release/build_native_desktop.py --target windows-x86_64 \
            --rzm "$RZM_DESKTOP_PREBUILT_RZM" --canonical-sha256 "$digest" \
            --version "$RELEASE_VERSION" --commit "$SOURCE" "${signing[@]}" --phase package \
            --output .tmp/ci-native/windows
      - name: Collect verified Windows assets without credentials
        run: |
          candidate=(); if [[ "$CANDIDATE_ONLY" == true ]]; then candidate=(--candidate-only); fi
          python3 scripts/release/ci_release_artifacts.py collect --platform windows --source "$SOURCE" --version "$RELEASE_VERSION" --dist dist --candidate .tmp/ci-native/windows --output .tmp/ci-release/windows "${candidate[@]}"
      - uses: actions/upload-artifact@v4
        with:
          name: release-windows
          path: .tmp/ci-release/windows
          retention-days: 1
          if-no-files-found: error
          include-hidden-files: true

  mac:
    name: Build and notarize native Mac assets
    needs: [select, common, linux, windows]
    runs-on: macos-15
    environment: release
    env:
      SOURCE: ${{ needs.select.outputs.source }}
      RELEASE_VERSION: ${{ needs.select.outputs.version }}
      CANDIDATE_ONLY: ${{ needs.select.outputs.candidate_only }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.select.outputs.source }}
          fetch-depth: 0
          persist-credentials: false
      - name: Require Apple Silicon
        run: test "$(uname -m)" = arm64
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: '~> v2'
          install-only: true
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            desktop/src-tauri/target
          key: desktop-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('desktop/src-tauri/Cargo.lock') }}
      - uses: actions/download-artifact@v4
        with:
          name: release-frontend
          path: .tmp/ci-release
      - uses: actions/download-artifact@v4
        with:
          name: release-mac-scanner
          path: .tmp/ci-tools
      - name: Prepare native dependencies and verified frontend
        run: |
          chmod +x .tmp/ci-tools/gitleaks
          echo "$GITHUB_WORKSPACE/.tmp/ci-tools" >> "$GITHUB_PATH"
          python3 scripts/release/ci_release_frontend.py extract --source "$SOURCE" --version "$RELEASE_VERSION" --archive .tmp/ci-release/frontend.tar.gz
          ./scripts/vendor/ensure_tree_sitter_sources.sh
          make desktop-deps
      - uses: actions/download-artifact@v4
        with:
          name: release-linux
          path: .tmp/ci-release/linux
      - uses: actions/download-artifact@v4
        with:
          name: release-windows
          path: .tmp/ci-release/windows
      - name: Verify this run's native inputs before signing
        run: |
          candidate=(); if [[ "$CANDIDATE_ONLY" == true ]]; then candidate=(--candidate-only); fi
          python3 scripts/release/ci_release_artifacts.py prepare-native --source "$SOURCE" --version "$RELEASE_VERSION" \
            --input .tmp/ci-release/linux --input .tmp/ci-release/windows --output .tmp/ci-release/native "${candidate[@]}"
      - name: Prepare desktop signing
        run: python3 scripts/release/ci_desktop_signing.py prepare
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_API_PRIVATE_KEY: ${{ secrets.APPLE_API_PRIVATE_KEY }}
      - name: Build, notarize and verify native outputs
        env:
          RZM_RELEASE_DESKTOP: '1'
          RZM_NOTARIZE_DESKTOP: '1'
          RZM_DESKTOP_PREBUILT_FRONTEND: '1'
          RZM_CI_RELEASE_CANDIDATE_ONLY: ${{ needs.select.outputs.candidate_only }}
          RZM_DESKTOP_CANDIDATES_DIR: ${{ github.workspace }}/.tmp/ci-release/native
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          export RZM_CI_RELEASE_VERSION="${RELEASE_VERSION#v}"
          python3 scripts/release/run_clean.py build -- goreleaser build --snapshot --clean --skip=before --id rzm-darwin
      - name: Clean up signing credentials
        if: ${{ always() }}
        run: python3 scripts/release/ci_desktop_signing.py cleanup
      - name: Collect verified assets without signing credentials
        run: |
          candidate=(); if [[ "$CANDIDATE_ONLY" == true ]]; then candidate=(--candidate-only); fi
          python3 scripts/release/ci_release_artifacts.py collect --platform macos --source "$SOURCE" --version "$RELEASE_VERSION" --dist dist --extras .tmp/goreleaser-extra --output .tmp/ci-release/macos "${candidate[@]}"
      - uses: actions/upload-artifact@v4
        with:
          name: release-macos
          path: .tmp/ci-release/macos
          retention-days: 1
          if-no-files-found: error
          include-hidden-files: true

  assemble:
    name: Assemble and verify complete release on Linux
    needs: [select, linux, windows, mac]
    runs-on: ubuntu-latest
    env:
      SOURCE: ${{ needs.select.outputs.source }}
      RELEASE_VERSION: ${{ needs.select.outputs.version }}
      CANDIDATE_ONLY: ${{ needs.select.outputs.candidate_only }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.select.outputs.source }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Install credential scanner
        working-directory: ${{ runner.temp }}
        run: go install github.com/zricethezav/gitleaks/v8@v8.30.1
      - uses: actions/download-artifact@v4
        with:
          name: release-linux
          path: .tmp/ci-release/linux
      - uses: actions/download-artifact@v4
        with:
          name: release-macos
          path: .tmp/ci-release/macos
      - uses: actions/download-artifact@v4
        with:
          name: release-windows
          path: .tmp/ci-release/windows
      - name: Prepare pinned signature verifier dependencies
        run: cargo fetch --locked --manifest-path scripts/release/updater-signature/Cargo.toml
      - name: Assemble and verify the exact built artifacts
        run: |
          candidate=(); if [[ "$CANDIDATE_ONLY" == true ]]; then candidate=(--candidate-only); fi
          python3 scripts/release/ci_release_artifacts.py assemble --source "$SOURCE" --version "$RELEASE_VERSION" --input .tmp/ci-release/linux --input .tmp/ci-release/windows --input .tmp/ci-release/macos --output .tmp/ci-release/publish "${candidate[@]}"
          python3 scripts/release/ci_release_artifacts.py verify --source "$SOURCE" --version "$RELEASE_VERSION" --input .tmp/ci-release/publish "${candidate[@]}"
      - uses: actions/upload-artifact@v4
        with:
          name: release-verified
          path: .tmp/ci-release/publish
          retention-days: 30
          if-no-files-found: error
          include-hidden-files: true

  publish:
    name: Publish approved release and Homebrew update
    needs: [select, assemble]
    if: needs.select.outputs.candidate_only != 'true'
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write
      actions: write
    env:
      SOURCE: ${{ needs.select.outputs.source }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.select.outputs.source }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: release-verified
          path: .tmp/ci-release/publish
      - name: Prepare pinned signature verifier dependencies
        run: cargo fetch --locked --manifest-path scripts/release/updater-signature/Cargo.toml
      - name: Publish approved release and update Homebrew
        env:
          GH_TOKEN: ${{ github.token }}
          BREW_GITHUB_TOKEN: ${{ secrets.BREW_GITHUB_TOKEN }}
        run: >-
          python3 scripts/release/ci_release_publish.py --source "$SOURCE"
          --assets .tmp/ci-release/publish --receipt "$RUNNER_TEMP/release-state/release-gateway.json"
      - name: Retain gateway correlation for interrupted publication
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: release-gateway-receipt
          path: ${{ runner.temp }}/release-state/
          overwrite: true
          retention-days: 30
          if-no-files-found: ignore
