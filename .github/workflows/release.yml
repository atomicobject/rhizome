name: GoReleaser fallback

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to publish
        required: true
        type: string
      candidate_only:
        description: Build and notarize this workflow ref without publishing (tag input is ignored)
        required: false
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  probe:
    name: Validate tag and probe release
    if: ${{ !inputs.candidate_only && github.ref == 'refs/heads/main' && github.repository == 'atomicobject/rhizome' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      release_exists: ${{ steps.release.outputs.exists }}
      release_commit: ${{ steps.topology.outputs.commit }}
    steps:
      - name: Validate release tag
        shell: bash
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          if [[ ! "$RELEASE_TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z]+([.-][0-9A-Za-z]+)*)?$ ]]; then
            echo "error: tag must be a v-prefixed semantic version" >&2
            exit 1
          fi
          git check-ref-format "refs/tags/$RELEASE_TAG" >/dev/null

      - name: Checkout canonical history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate canonical topology
        id: topology
        shell: bash
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          git fetch --no-tags origin \
            "+refs/heads/main:refs/remotes/origin/main" \
            "+refs/heads/release:refs/remotes/origin/release" \
            "+refs/tags/$RELEASE_TAG:refs/tags/$RELEASE_TAG"
          release_commit="$(git rev-parse "refs/tags/$RELEASE_TAG^{commit}")"
          release_tip="$(git rev-parse refs/remotes/origin/release)"
          if [[ "$release_commit" != "$release_tip" ]]; then
            echo "error: tag does not match origin/release" >&2
            exit 1
          fi
          if ! git merge-base --is-ancestor "$release_commit" refs/remotes/origin/main; then
            echo "error: release commit is not contained in origin/main" >&2
            exit 1
          fi
          if git rev-list --first-parent refs/remotes/origin/main | \
            awk -v release="$release_commit" '$0 == release { found=1 } END { exit !found }'; then
            : # Direct main-line release.
          elif git rev-list --first-parent --parents refs/remotes/origin/main | \
            awk -v release="$release_commit" 'NF >= 3 && $3 == release { found=1 } END { exit !found }'; then
            : # Hotfix merge with release as second parent.
          else
            echo "error: origin/main does not contain a canonical release integration" >&2
            exit 1
          fi
          echo "commit=$release_commit" >> "$GITHUB_OUTPUT"

      - name: Probe existing GitHub release
        id: release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          status="$(
            curl --silent --show-error --output /dev/null --write-out '%{http_code}' \
              --header "Accept: application/vnd.github+json" \
              --header "Authorization: Bearer $GH_TOKEN" \
              --header "X-GitHub-Api-Version: 2022-11-28" \
              "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/releases/tags/$RELEASE_TAG"
          )"
          case "$status" in
            200) echo "exists=true" >> "$GITHUB_OUTPUT" ;;
            404) echo "exists=false" >> "$GITHUB_OUTPUT" ;;
            *)
              echo "error: GitHub release probe returned HTTP $status" >&2
              exit 1
              ;;
          esac

  test:
    needs: probe
    if: needs.probe.outputs.release_exists == 'false'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ needs.probe.outputs.release_commit }}
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.24.2"
      # The compounding starter's Node script tests run inside go test.
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Test
        run: make test

  native_desktop:
    name: Prepare exact native desktop candidates
    needs: [probe, test]
    if: needs.probe.outputs.release_exists == 'false'
    runs-on: ubuntu-24.04
    timeout-minutes: 270
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: trusted
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.probe.outputs.release_commit }}
          path: source
          fetch-depth: 0
          persist-credentials: false
      - name: Build and verify correlated native candidates
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_COMMIT: ${{ needs.probe.outputs.release_commit }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          python3 trusted/scripts/release/prepare_native_desktop.py \
            --repo-root source --commit "$RELEASE_COMMIT" --version "$RELEASE_TAG" \
            --receipt "$RUNNER_TEMP/prepared/native-desktop-receipt.json" \
            --output "$RUNNER_TEMP/prepared/native-desktop"
      - uses: actions/upload-artifact@v4
        with:
          name: prepared-native-desktop
          path: ${{ runner.temp }}/prepared/
          if-no-files-found: error
          retention-days: 30

  gateway:
    name: Deploy and verify release gateway
    needs: [probe, test, native_desktop]
    if: needs.probe.outputs.release_exists == 'false'
    runs-on: ubuntu-latest
    timeout-minutes: 270
    permissions:
      contents: read
      actions: write
    steps:
      - name: Checkout trusted release gate
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: trusted
          fetch-depth: 0
          persist-credentials: false
      - name: Checkout validated release source
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.probe.outputs.release_commit }}
          path: source
          fetch-depth: 0
          persist-credentials: false
      - name: Wait for protected gateway deployment
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_COMMIT: ${{ needs.probe.outputs.release_commit }}
        run: |
          set -euo pipefail
          python3 trusted/scripts/release/release_gateway.py \
            --repo-root "$GITHUB_WORKSPACE/source" \
            --release-commit "$RELEASE_COMMIT" \
            --receipt "$RUNNER_TEMP/release-gateway.json"

      - name: Retain this run's terminal gateway proof
        uses: actions/upload-artifact@v4
        with:
          name: release-gateway-receipt
          path: ${{ runner.temp }}/release-gateway.json
          if-no-files-found: error
          retention-days: 30

  goreleaser:
    needs: [probe, test, native_desktop, gateway]
    if: needs.probe.outputs.release_exists == 'false'
    # macos-15 is Apple Silicon; the desktop bundle is arm64-only.
    runs-on: macos-15
    environment: release
    permissions:
      contents: write
      actions: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ needs.probe.outputs.release_commit }}
      - name: Download this run's verified native candidates
        uses: actions/download-artifact@v4
        with:
          name: prepared-native-desktop
          path: ${{ runner.temp }}/prepared
      - name: Download this run's terminal gateway proof
        uses: actions/download-artifact@v4
        with:
          name: release-gateway-receipt
          path: ${{ runner.temp }}/gateway
      - name: Revalidate native producer and retained bytes
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_COMMIT: ${{ needs.probe.outputs.release_commit }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          python3 scripts/release/prepare_native_desktop.py --verify-only \
            --repo-root . --commit "$RELEASE_COMMIT" --version "$RELEASE_TAG" \
            --receipt "$RUNNER_TEMP/prepared/native-desktop-receipt.json" \
            --output "$RUNNER_TEMP/prepared/native-desktop"
      - name: Revalidate release tag
        shell: bash
        env:
          RELEASE_TAG: ${{ inputs.tag }}
          RELEASE_COMMIT: ${{ needs.probe.outputs.release_commit }}
        run: |
          set -euo pipefail
          git fetch --no-tags origin \
            "+refs/heads/main:refs/remotes/origin/main" \
            "+refs/heads/release:refs/remotes/origin/release" \
            "+refs/tags/$RELEASE_TAG:refs/tags/$RELEASE_TAG"
          test "$(git rev-parse "refs/tags/$RELEASE_TAG^{commit}")" = "$RELEASE_COMMIT"
          test "$(git rev-parse refs/remotes/origin/release)" = "$RELEASE_COMMIT"
          git merge-base --is-ancestor "$RELEASE_COMMIT" refs/remotes/origin/main
          if git rev-list --first-parent refs/remotes/origin/main | \
            awk -v release="$RELEASE_COMMIT" '$0 == release { found=1 } END { exit !found }'; then
            :
          else
            if git rev-list --first-parent --parents refs/remotes/origin/main | \
              awk -v release="$RELEASE_COMMIT" 'NF >= 3 && $3 == release { found=1 } END { exit !found }'; then
              :
            else
              echo "error: release commit is not on the canonical main topology" >&2
              exit 1
            fi
          fi
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.24.2"
      - name: Install zig
        uses: goto-bus-stop/setup-zig@v2
        with:
          version: 0.13.0
      - name: Install mingw-w64
        run: brew install mingw-w64
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install GoReleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: "~> v2"
          install-only: true
      - name: Install credential scanner
        run: go install github.com/zricethezav/gitleaks/v8@v8.30.1
        working-directory: ${{ runner.temp }}
        # gitleaks needs Go 1.24.11 or newer. Without a pin, Go switches to the
        # newest release, which can 404 while that release is still propagating.
        env:
          GOTOOLCHAIN: go1.24.11
      - name: Check desktop architecture
        run: test "$(uname -m)" = arm64
      - name: Cache Rust dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            desktop/src-tauri/target
          key: desktop-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('desktop/src-tauri/Cargo.lock') }}
      - name: Install desktop dependencies
        run: make desktop-deps
      - name: Set up Python for archive verification
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Prepare desktop signing
        run: python3 scripts/release/ci_desktop_signing.py prepare
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_API_PRIVATE_KEY: ${{ secrets.APPLE_API_PRIVATE_KEY }}
      - name: Run GoReleaser
        run: python3 scripts/release/run_clean.py publish -- goreleaser release --clean --draft
        env:
          GORELEASER_CURRENT_TAG: ${{ inputs.tag }}
          GITHUB_TOKEN: ${{ github.token }}
          RZM_RELEASE_DESKTOP: "1"
          RZM_DESKTOP_CANDIDATES_DIR: ${{ runner.temp }}/prepared/native-desktop
          RZM_DESKTOP_CANDIDATES_RECEIPT: ${{ runner.temp }}/prepared/native-desktop-receipt.json
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
      - name: Verify assets and advertise the complete desktop release
        env:
          GITHUB_TOKEN: ${{ github.token }}
          RELEASE_COMMIT: ${{ needs.probe.outputs.release_commit }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          python3 scripts/release/release_advertise.py --repo-root . \
            --receipt "$RUNNER_TEMP/advertisement-receipt.json" \
            --commit "$RELEASE_COMMIT" --version "$RELEASE_TAG" \
            --dist-dir dist --desktop-dir .tmp/goreleaser-extra \
            --terminal-gateway-receipt "$RUNNER_TEMP/gateway/release-gateway.json"
      - name: Retain advertisement recovery proof
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: release-advertisement-receipt
          path: ${{ runner.temp }}/advertisement-receipt*
          if-no-files-found: ignore
          retention-days: 30
      - name: Clean up desktop signing
        if: ${{ always() }}
        run: python3 scripts/release/ci_desktop_signing.py cleanup

  homebrew:
    name: Publish verified Homebrew formula
    needs: [probe, goreleaser]
    if: needs.probe.outputs.release_exists == 'false'
    runs-on: ubuntu-24.04
    environment: release
    timeout-minutes: 270
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: trusted
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.probe.outputs.release_commit }}
          path: source
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: release-advertisement-receipt
          path: ${{ runner.temp }}/advertisement
      - name: Gate and publish the exact retained formula
        env:
          GITHUB_TOKEN: ${{ github.token }}
          BREW_GITHUB_TOKEN: ${{ secrets.BREW_GITHUB_TOKEN }}
          RELEASE_COMMIT: ${{ needs.probe.outputs.release_commit }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          python3 trusted/scripts/release/release_homebrew.py --repo-root source \
            --advertisement-receipt "$RUNNER_TEMP/advertisement/advertisement-receipt.json" \
            --commit "$RELEASE_COMMIT" --version "$RELEASE_TAG"
      - name: Retain tap recovery proof
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: release-homebrew-receipt
          path: ${{ runner.temp }}/advertisement/advertisement-receipt*
          if-no-files-found: ignore
          retention-days: 30

  notarization_candidate:
    name: Verify notarized desktop candidate without publishing
    if: inputs.candidate_only && github.repository == 'atomicobject/rhizome'
    runs-on: macos-15
    environment: release
    permissions:
      contents: read
    steps:
      - name: Checkout candidate source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Check desktop architecture
        run: test "$(uname -m)" = arm64
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.24.2"
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install GoReleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: "~> v2"
          install-only: true
      - name: Install credential scanner
        run: go install github.com/zricethezav/gitleaks/v8@v8.30.1
        working-directory: ${{ runner.temp }}
        env:
          GOTOOLCHAIN: go1.24.11
      - name: Cache Rust dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            desktop/src-tauri/target
          key: desktop-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('desktop/src-tauri/Cargo.lock') }}
      - name: Install desktop dependencies
        run: make desktop-deps
      - name: Set up Python for archive verification
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Prepare desktop signing
        run: python3 scripts/release/ci_desktop_signing.py prepare
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_API_PRIVATE_KEY: ${{ secrets.APPLE_API_PRIVATE_KEY }}
      - name: Build and verify notarized candidate
        run: python3 scripts/release/run_clean.py build -- goreleaser build --snapshot --clean --single-target
        env:
          RZM_NOTARIZE_DESKTOP: "1"
          RZM_RELEASE_DESKTOP: "1"
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
      - name: Clean up desktop signing
        if: ${{ always() }}
        run: python3 scripts/release/ci_desktop_signing.py cleanup
