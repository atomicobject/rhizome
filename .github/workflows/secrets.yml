name: Credential protection
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24.2'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - name: Install signing test dependencies
        run: |
          npm --prefix desktop ci
          cargo fetch --locked --manifest-path scripts/release/updater-signature/Cargo.toml
      - name: Install scanner
        run: go install github.com/zricethezav/gitleaks/v8@v8.30.1
        working-directory: ${{ runner.temp }}
        # gitleaks needs Go 1.24.11 or newer. Without a pin, Go switches to the
        # newest release, which can 404 while that release is still propagating.
        env:
          GOTOOLCHAIN: go1.24.11
      - name: Scan tracked files and new commits
        run: python3 scripts/secrets/check.py --history
      - name: Check credential and release tooling
        run: |
          python3 -m unittest discover -s scripts/secrets -p '*_test.py'
          python3 -m unittest discover -s scripts/teamkeys -p '*_test.py'
          python3 -m unittest discover -s scripts/release -p '*_test.py'
