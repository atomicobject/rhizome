name: Credential protection
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24.2'
      - name: Install scanner
        run: go install github.com/zricethezav/gitleaks/v8@v8.30.1
        working-directory: ${{ runner.temp }}
      - name: Scan tracked files and new commits
        run: python3 scripts/secrets/check.py --history
      - name: Check credential tooling
        run: |
          python3 -m unittest discover -s scripts/secrets -p '*_test.py'
          python3 -m unittest discover -s scripts/teamkeys -p '*_test.py'
          python3 -m unittest discover -s scripts/release -p 'run_clean_test.py'
