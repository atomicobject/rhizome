name: TypeSafe live smoke test
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  live:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: live-tests
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24.2'
      - name: Test synthetic input against TypeSafe
        env:
          TYPESAFE_API_KEY: ${{ secrets.TYPESAFE_API_KEY }}
          TYPESAFE_LIVE_TEST: '1'
        run: go test -tags live ./pkg/typesafe -run '^TestLiveSystemOne$' -count=1 -timeout=2m
