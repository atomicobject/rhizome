name: Deploy team API
run-name: ${{ inputs.image_tag != '' && format('Redeploy team API {0}', inputs.image_tag) || format('Deploy team API {0} {1}', inputs.request_id, inputs.source_commit) }}
on:
  workflow_dispatch:
    inputs:
      source_commit:
        description: 'Exact public release source SHA. Requires request_id; mutually exclusive with image_tag.'
        required: false
        type: string
      request_id:
        description: 'Unique 32-character lowercase hex correlation ID for a source deployment.'
        required: false
        type: string
      image_tag:
        description: 'Rollback/redeploy: previous full commit SHA already in ECR. Do not set source inputs.'
        required: false
        type: string
permissions:
  contents: read
concurrency:
  group: team-api-production
  cancel-in-progress: false
jobs:
  deploy:
    if: github.ref == 'refs/heads/main' && github.repository == 'atomicobject/rhizome'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 150
    environment: production
    permissions:
      contents: read
      id-token: write
    env:
      AWS_REGION: ${{ vars.TEAM_API_AWS_REGION }}
      AWS_DEFAULT_REGION: ${{ vars.TEAM_API_AWS_REGION }}
      AWS_PAGER: ''
      STACK: ${{ vars.TEAM_API_STACK }}
      SOURCE_COMMIT: ${{ inputs.source_commit }}
      REQUEST_ID: ${{ inputs.request_id }}
      ROLLBACK_TAG: ${{ inputs.image_tag }}
    steps:
      - name: Checkout trusted dispatcher
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: trusted
          fetch-depth: 0
          persist-credentials: false
      - name: Validate deployment inputs and trusted source
        id: selection
        shell: bash
        run: |
          set -euo pipefail
          test -n "$AWS_REGION"
          test -n "$STACK"
          python3 trusted/services/team-api/deploy/deployment_inputs.py \
            --repository "$GITHUB_REPOSITORY" --ref "$GITHUB_REF" \
            --repo-root "$GITHUB_WORKSPACE/trusted" \
            --source-commit "$SOURCE_COMMIT" --request-id "$REQUEST_ID" \
            --image-tag "$ROLLBACK_TAG" >> "$GITHUB_OUTPUT"
      - name: Checkout selected source
        if: steps.selection.outputs.mode == 'source'
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.selection.outputs.source_commit }}
          path: source
          persist-credentials: false
      - uses: actions/setup-go@v5
        if: steps.selection.outputs.mode == 'source'
        with:
          go-version-file: source/services/team-api/go.mod
          cache-dependency-path: source/services/team-api/go.sum
      - name: Check selected gateway source and trusted deployment helpers
        if: steps.selection.outputs.mode == 'source'
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C source rev-parse HEAD)" = "$SOURCE_COMMIT"
          cd source/services/team-api
          GOFLAGS=-mod=mod GOTOOLCHAIN=local go vet ./...
          GOFLAGS=-mod=mod GOTOOLCHAIN=local go test -race ./...
          cd "$GITHUB_WORKSPACE"
          python3 -m unittest discover -s trusted/services/team-api/deploy -p '*_test.py'
          python3 -m unittest discover -s source/scripts/team-api -p '*_test.py'
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.TEAM_API_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.TEAM_API_AWS_REGION }}
          role-session-name: team-api-${{ github.run_id }}
          role-duration-seconds: 10800
      - name: Build and push immutable source image
        if: steps.selection.outputs.mode == 'source'
        shell: bash
        env:
          IMAGE_TAG: ${{ steps.selection.outputs.image_tag }}
        run: |
          set -euo pipefail
          repository="$(aws cloudformation describe-stacks --stack-name "$STACK" --query 'Stacks[0].Outputs[?OutputKey==`RepositoryUri`].OutputValue | [0]' --output text)"
          registry="${repository%%/*}"
          aws ecr get-login-password | docker login --username AWS --password-stdin "$registry"
          trap 'docker logout "$registry" >/dev/null' EXIT
          # Re-running a source commit reuses its immutable image.
          if ! aws ecr describe-images --repository-name "${repository#*/}" --image-ids "imageTag=$IMAGE_TAG" >/dev/null 2>&1; then
            docker build --platform linux/arm64 -f source/services/team-api/Dockerfile --build-arg "VERSION=$IMAGE_TAG" -t "$repository:$IMAGE_TAG" source
            docker push "$repository:$IMAGE_TAG"
          fi
      - name: Deploy, verify ALB settings, and smoke test HTTPS
        shell: bash
        env:
          IMAGE_TAG: ${{ steps.selection.outputs.image_tag }}
        run: |
          set -euo pipefail
          python3 trusted/services/team-api/deploy/deploy.py --stack "$STACK" \
            --image-tag "$IMAGE_TAG" \
            --deployment-id "$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
