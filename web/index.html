<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <title>Rhizome</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link
      rel="preload"
      href="/fonts/inter-var-latin.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <!-- Apply the stored appearance and theme before first paint (src/lib/appearance.ts).
         Rhizome Desktop owns both, so its pages skip storage. -->
    <script>
      (function () {
        try {
          if (window.__RHIZOME_DESKTOP__) return;
          var root = document.documentElement;
          var theme = localStorage.getItem("rhizome:theme");
          var appearance = localStorage.getItem("rhizome:appearance");
          if (/^(graphite|slate|spruce|oxblood|indigo)$/.test(theme)) root.dataset.theme = theme;
          if (appearance === "light" || appearance === "dark") root.dataset.appearance = appearance;
        } catch (error) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
