<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <title>Rhizome</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link
      rel="preload"
      href="/fonts/inter-var-latin.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <!-- Apply the stored appearance and theme before first paint (src/lib/appearance.ts).
         Rhizome Desktop owns both: it sets the appearance natively and bakes the
         window's theme into the page, so its pages skip that storage. A reload
         prefers a newer theme the page took from the app (desktopHost.ts). -->
    <script>
      (function () {
        try {
          var root = document.documentElement;
          var themes = /^(graphite|slate|spruce|oxblood|indigo)$/;
          if (window.__RHIZOME_DESKTOP__) {
            var desktopTheme = window.__RHIZOME_DESKTOP_THEME__;
            var later = JSON.parse(localStorage.getItem("rhizome:desktop-theme") || "null");
            if (later && later.at > (window.__RHIZOME_DESKTOP_THEME_AT__ || 0)) {
              desktopTheme = later.theme;
            }
            if (themes.test(desktopTheme)) root.dataset.theme = desktopTheme;
            return;
          }
          var theme = localStorage.getItem("rhizome:theme");
          var appearance = localStorage.getItem("rhizome:appearance");
          if (themes.test(theme)) root.dataset.theme = theme;
          if (appearance === "light" || appearance === "dark") root.dataset.appearance = appearance;
        } catch (error) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
