<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AO KB Knowledge Workspace</title>
<style>
/* ---------- Outer canvas: T3 theme variables, transparent surface ---------- */
html, body { margin: 0; background: transparent; }
body {
  font: 400 14px/1.45 "Inter", -apple-system, system-ui, "Segoe UI", sans-serif;
  color: var(--foreground, CanvasText);
}
*, *::before, *::after { box-sizing: border-box; }
.proto {
  display: flex; flex-wrap: wrap; align-items: center; gap: 8px 16px;
  margin: 0 0 10px; color: var(--muted-foreground, GrayText); font-size: 13px;
}
.proto strong { color: var(--foreground, CanvasText); font-weight: 600; }
.proto label { display: inline-flex; align-items: center; gap: 6px; }
.proto select {
  font: 500 13px/1 inherit; font-family: inherit; height: 26px; padding: 0 6px;
  color: var(--foreground, CanvasText); background: var(--card, Canvas);
  border: 1px solid var(--border, GrayText); border-radius: 6px;
}
.proto__note { flex-basis: 100%; }

/* ---------- Rhizome tokens (web/src/tokens.css, Graphite theme) ---------- */
.app {
  color-scheme: light dark;
  --bg: light-dark(#f5f5f3, #151413);
  --surface: light-dark(#ffffff, #1c1b1a);
  --surface-sunk: light-dark(#f5f5f3, #242321);
  --surface-strong: light-dark(#ebeae7, #2d2c2a);
  --border: light-dark(#e3e2de, #33312f);
  --border-strong: light-dark(#cfcdc8, #45433f);
  --border-faint: light-dark(#edece9, #292826);
  --text: light-dark(#1f1e1d, #ecebe9);
  --text-muted: light-dark(#5b5955, #b8b5b0);
  --text-faint: light-dark(#6b6965, #9c9994);
  --accent: light-dark(#fd4f57, #ff5a62);
  --accent-soft: light-dark(#ffeaec, #3b2022);
  --accent-line: light-dark(#fccfd2, #6a2e32);
  --accent-ink: light-dark(#9c1d24, #ff9096);
  --info: light-dark(#3295bd, #5fb3d6);
  --success: light-dark(#2f8a50, #4cb873);
  --success-ink: light-dark(#1e6b3b, #7fd69c);
  --warning: #dcad66;
  --warning-soft: light-dark(#fbefd4, #362b19);
  --warning-ink: light-dark(#8a5a0f, #e8c27e);
  --link: light-dark(#0b6a66, #75b9b5);
  --link-line: light-dark(rgb(22 203 196 / 45%), rgb(117 185 181 / 45%));
  --provenance-soft: light-dark(#e4f8f6, #18302e);
  --focus-ring: light-dark(#c8313a, #ff6b72);
  --accent-fill: #c8313a;
  --shadow: 0 1px 3px light-dark(rgba(42,39,36,.08), rgba(0,0,0,.45)), 0 2px 6px light-dark(rgba(42,39,36,.04), rgba(0,0,0,.3));
  --shadow-lg: 0 10px 28px light-dark(rgba(42,39,36,.1), rgba(0,0,0,.5));
  --chrome-bg: light-dark(#45433f, #2b2a28);
  --chrome-top: light-dark(#3b3936, #232220);
  --chrome-text: #f4f3f1;
  --chrome-muted: light-dark(#cbc7c1, #b9b5ae);
  --chrome-pill: light-dark(#f1efec, #45433f);
  --chrome-pill-text: light-dark(#2b2a28, #f4f3f1);
  --chrome-raised: color-mix(in srgb, var(--chrome-text) 9%, var(--chrome-bg));
  --chrome-active: color-mix(in srgb, var(--chrome-text) 16%, var(--chrome-bg));
  --selection: light-dark(color-mix(in srgb, #45433f 9%, #ffffff), color-mix(in srgb, #45433f 45%, #1c1b1a));
  --selection-edge: light-dark(#45433f, #b9b5ae);
  --type-1: light-dark(#1264df, #63a6ff);
  --type-2: light-dark(#c32ca4, #f16cce);
  --type-3: light-dark(#aa7400, #f5bd27);
  --type-4: light-dark(#3238ae, #a1a0ff);
  --type-5: light-dark(#278b19, #70d54b);
  --type-6: light-dark(#d05200, #ff9848);
  --type-7: light-dark(#853de0, #bd88ff);
  --type-8: light-dark(#8a8682, #a29d97);
  --type-10: light-dark(#9c168e, #ef9de4);
  --type-11: light-dark(#697900, #c4da36);
  --type-12: light-dark(#00652e, #38bc78);
  --cov-passage: light-dark(#0b6a66, #75b9b5);
  --cov-locator: light-dark(#3fb0aa, #2f6a67);
  --cov-document: light-dark(#a9a5a0, #6b6763);
  --font-sans: "Inter", -apple-system, system-ui, "Segoe UI", sans-serif;
  --font-mono: "JetBrains Mono", ui-monospace, Menlo, Consolas, monospace;
  --font-display: "Merriweather", Georgia, "Times New Roman", serif;
  --gutter: 22px;
}
:root.dark .app[data-appearance="system"], .app[data-appearance="dark"] { color-scheme: dark; }
:root.light .app[data-appearance="system"], .app[data-appearance="light"] { color-scheme: light; }

/* ---------- Shell ---------- */
.app {
  position: relative;
  font: 400 14px/1.45 var(--font-sans);
  color: var(--text);
  background: var(--chrome-bg);
  border-radius: 10px;
  overflow: hidden;
  border: 1px solid light-dark(#cfcdc8, #45433f);
}
.app ::selection { background: var(--accent-line); }
.app code, .app kbd, .app samp, .app pre, .mono { font-family: var(--font-mono); font-size: 12px; font-weight: 500; }
.num { font-variant-numeric: tabular-nums; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
svg.i { width: 16px; height: 16px; flex: none; fill: none; stroke: currentColor; stroke-width: 2.25; stroke-linecap: round; stroke-linejoin: round; }
.app :focus-visible { outline: 2px solid var(--focus-ring); outline-offset: 2px; }
.app [tabindex="-1"]:focus { outline: none; }
:where(.app) button { font: inherit; color: inherit; }
:where(.app) a { color: inherit; }

.topbar {
  display: flex; align-items: center; gap: 6px; height: 44px; padding: 0 10px;
  background: var(--chrome-top); color: var(--chrome-muted);
}
.topbar :focus-visible { outline-color: var(--chrome-text); }
.brand { display: inline-flex; align-items: center; gap: 8px; color: var(--chrome-text); font: 600 15px/1 var(--font-mono); margin-right: 4px; }
.brand::before { content: ""; width: 7px; height: 7px; background: var(--accent); transform: rotate(45deg); }
.icon-btn {
  display: inline-grid; place-items: center; width: 30px; height: 30px; border: 0; border-radius: 6px;
  background: transparent; color: inherit; cursor: pointer;
}
.icon-btn:hover { background: var(--chrome-raised); color: var(--chrome-text); }
.sections { display: flex; gap: 2px; }
.sections span { padding: 0 10px; height: 30px; display: inline-flex; align-items: center; border-radius: 6px; font-weight: 500; }
.sections .is-current { background: var(--chrome-active); color: var(--chrome-text); }
.finder { position: relative; flex: 1 1 auto; max-width: 560px; margin: 0 auto; min-width: 120px; }
.finder input {
  width: 100%; height: 28px; border: 0; border-radius: 6px; padding: 0 10px 0 30px;
  background: var(--chrome-raised); color: var(--chrome-text); font: 400 14px var(--font-sans);
}
.finder input::placeholder { color: color-mix(in srgb, var(--chrome-text) 20%, var(--chrome-muted)); }
.finder > svg { position: absolute; left: 9px; top: 6px; color: var(--chrome-muted); pointer-events: none; }
.finder__list {
  position: absolute; z-index: 30; top: 34px; left: 0; right: 0; margin: 0; padding: 6px; list-style: none;
  background: var(--surface); color: var(--text); border: 1px solid var(--border-strong); border-radius: 10px; box-shadow: var(--shadow-lg);
}
.finder__list li { display: grid; grid-template-columns: 10px minmax(0, 1fr) auto; gap: 2px 8px; align-items: center; padding: 6px 8px; border-radius: 6px; cursor: pointer; }
.finder__list li[aria-selected="true"] { background: var(--selection); }
.finder__list .t { font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.finder__list .p { grid-column: 2; color: var(--text-faint); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.finder__list .k { grid-row: 1 / span 2; grid-column: 3; color: var(--text-muted); font-size: 13px; font-weight: 500; text-align: right; }
.finder__empty { padding: 8px; color: var(--text-muted); }
.vault-count { white-space: nowrap; font-size: 13px; }
.vault-count b { font-weight: 600; color: var(--chrome-text); }

.workbench { display: grid; grid-template-columns: 264px minmax(0, 1fr); align-items: stretch; }
.app.no-side .workbench { grid-template-columns: minmax(0, 1fr); }
.app.no-side .sidebar { display: none; }
.app.no-side .panel { margin-left: 6px; }
.sidebar { background: var(--chrome-bg); color: var(--chrome-muted); padding: 10px 8px 16px; }
.sidebar :focus-visible { outline: 2px solid var(--chrome-text); outline-offset: -2px; }
.sidebar__vault { color: var(--chrome-text); font-weight: 600; font-size: 16px; padding: 4px 10px 10px; }
.side-head { display: flex; align-items: center; gap: 6px; padding: 14px 10px 4px; font: 500 13px/1.35 var(--font-sans); color: var(--chrome-muted); }
.side-row {
  display: flex; align-items: center; gap: 8px; width: 100%; height: 30px; padding: 0 10px 0 8px; border: 0; border-radius: 6px;
  background: transparent; color: var(--chrome-muted); text-align: left; cursor: pointer; font-size: 14px;
}
.side-row:hover { background: var(--chrome-raised); color: var(--chrome-text); }
.side-row[aria-current="page"] { background: var(--chrome-pill); color: var(--chrome-pill-text); font-weight: 600; }
.side-row .dot { width: 8px; height: 8px; border-radius: 50%; margin: 0 4px; }
.side-row .count { margin-left: auto; font-size: 13px; font-variant-numeric: tabular-nums; }
.side-note { padding: 2px 10px 0 30px; font-size: 13px; line-height: 1.35; }

.panel {
  background: var(--surface); margin: 0 6px 6px 0; border-radius: 10px; min-width: 0;
  container-type: inline-size; box-shadow: inset 0 0 0 1px light-dark(transparent, rgba(255,255,255,.08));
}
.doctabs { display: flex; align-items: stretch; height: 36px; border-bottom: 1px solid var(--border); padding: 0 6px; gap: 2px; overflow-x: auto; scrollbar-width: none; }
.doctabs .icon-btn { width: 28px; height: 28px; align-self: center; color: var(--text-muted); }
.doctabs .icon-btn:hover:not(:disabled) { background: var(--surface-sunk); color: var(--text); }
.doctabs .icon-btn:disabled { opacity: .4; cursor: default; }
.dtab {
  display: inline-flex; align-items: center; gap: 6px; max-width: 220px; padding: 0 8px; border: 0; background: transparent;
  color: var(--text-muted); font: 500 13px var(--font-sans); cursor: pointer; border-bottom: 2px solid transparent; white-space: nowrap;
}
.dtab span { overflow: hidden; text-overflow: ellipsis; }
.dtab[aria-current="page"] { color: var(--text); border-bottom-color: var(--text); }
.dtab-wrap { display: inline-flex; align-items: stretch; }
.dtab-close { border: 0; background: transparent; color: var(--text-faint); width: 20px; cursor: pointer; display: grid; place-items: center; border-radius: 3px; }
.dtab-close:hover { color: var(--text); background: var(--surface-sunk); }
.dtab-close svg { width: 14px; height: 14px; }
.sep { width: 1px; background: var(--border); margin: 8px 4px; }

/* ---------- View header, tabs, banners ---------- */
.page { max-width: 1320px; margin: 0 auto; }
.vh { padding: 0 var(--gutter); }
.vh__row { display: flex; align-items: center; gap: 8px 12px; min-height: 56px; flex-wrap: wrap; padding: 8px 0; }
.vh__row h2 { margin: 0; font: 700 18px/1.2 var(--font-sans); letter-spacing: -0.01em; }
.vh__count { color: var(--text-muted); font-variant-numeric: tabular-nums; }
.vh__about { color: var(--text-muted); font-size: 13px; min-width: 0; flex: 1 1 200px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.vh__tools { display: flex; align-items: center; gap: 6px; margin-left: auto; }
.find { position: relative; }
.find input { width: 220px; height: 30px; padding: 0 10px 0 30px; border: 1px solid var(--border-strong); border-radius: 7px; background: var(--surface); color: var(--text); font: 400 14px var(--font-sans); }
.find svg { position: absolute; left: 9px; top: 7px; color: var(--text-faint); pointer-events: none; }
.btn {
  display: inline-flex; align-items: center; gap: 6px; height: 28px; padding: 0 10px; border: 1px solid var(--border-strong); border-radius: 6px;
  background: var(--surface); color: var(--text); font: 500 13px var(--font-sans); cursor: pointer; white-space: nowrap; text-decoration: none;
}
.btn:hover { background: var(--surface-sunk); }
.btn--ghost { border-color: transparent; background: transparent; color: var(--text-muted); }
.btn--ghost:hover, .btn--ghost[aria-expanded="true"] { background: var(--surface-sunk); color: var(--text); }
.btn[disabled] { background: var(--surface-sunk); color: var(--text-faint); border-color: var(--border); cursor: default; }
.btn .badge { min-width: 18px; height: 18px; padding: 0 5px; border-radius: 9px; background: var(--surface-strong); color: var(--text); font-size: 12px; display: inline-grid; place-items: center; }
.tabs { display: flex; gap: 18px; height: 40px; border-bottom: 1px solid var(--border); padding: 0 var(--gutter); overflow-x: auto; scrollbar-width: none; }
.tab { border: 0; background: none; padding: 0; height: 40px; color: var(--text-muted); font: 400 14px var(--font-sans); cursor: pointer; border-bottom: 2px solid transparent; white-space: nowrap; }
.tab[aria-current="page"] { color: var(--text); font-weight: 500; border-bottom-color: var(--text); }
.tab:focus-visible { outline-offset: -2px; }
.chips { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; padding: 8px var(--gutter); background: var(--surface-sunk); border-bottom: 1px solid var(--border); font-size: 13px; }
.chip { display: inline-flex; align-items: center; gap: 4px; height: 24px; padding: 0 4px 0 8px; border: 1px solid var(--border-strong); border-radius: 3px; background: var(--surface); font: 500 13px var(--font-sans); cursor: pointer; }
.chip svg { width: 14px; height: 14px; color: var(--text-faint); }
.linkbtn { border: 0; background: none; padding: 0; color: var(--link); font: 500 13px var(--font-sans); cursor: pointer; text-decoration: none; }
.linkbtn:hover { text-decoration: underline; text-decoration-color: var(--link-line); text-underline-offset: 2px; }
.banner {
  display: flex; align-items: flex-start; gap: 8px; margin: 12px var(--gutter) 0; padding: 8px 10px; min-height: 36px; border-radius: 6px;
  background: var(--surface-sunk); border: 1px solid var(--border); font-size: 13px;
}
.banner--warning { background: var(--warning-soft); border-color: color-mix(in srgb, var(--warning) 70%, transparent); }
.banner__text { flex: 1; min-width: 0; padding-top: 1px; }
.banner details { margin-top: 4px; }
.banner summary { cursor: pointer; color: var(--text-muted); display: inline-flex; align-items: center; gap: 4px; list-style: none; }
.banner summary::-webkit-details-marker { display: none; }
.banner ul { margin: 6px 0 2px; padding-left: 18px; }
.banner li { margin: 3px 0; }
.banner .btn { margin-left: auto; }

/* status marks (web/src/components/StatusMark.tsx) */
.mark { display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; }
.mark svg { width: 9px; height: 9px; flex: none; overflow: visible; }
.mark--risk { color: var(--accent); }
.mark--risk .lbl { color: var(--accent-ink); }
.mark--neutral, .mark--muted { color: var(--text-faint); }
.mark--neutral .lbl, .mark--muted .lbl { color: var(--text); }
.mark--warning { color: var(--warning-ink); }
.mark--success { color: var(--success); }
.mark--success .lbl { color: var(--text); }
.mark--progress { color: var(--info); }
.mark .lbl { font-weight: 500; }

.body { padding: 14px var(--gutter) 28px; }
.section-heading { font: 600 15px/1.35 var(--font-sans); margin: 0; }
.muted { color: var(--text-muted); }
.faint { color: var(--text-faint); }
.dash { color: var(--text-faint); font-weight: 400; }
.link-title { color: var(--text); font-weight: 500; text-decoration: none; cursor: pointer; }
.link-title:hover, .link-title:focus-visible { text-decoration: underline; text-decoration-color: var(--link-line); text-underline-offset: 2px; color: var(--link); }
.link-secondary { color: var(--text-muted); text-decoration: none; cursor: pointer; }
.link-secondary:hover, .link-secondary:focus-visible { text-decoration: underline; text-underline-offset: 2px; }
.prose a.note-link { color: var(--link); text-decoration: underline; text-decoration-color: var(--link-line); text-underline-offset: 2px; }
.prose a.note-link:hover { text-decoration-color: var(--link); }
.type-chip { display: inline-flex; align-items: center; gap: 6px; height: 22px; padding: 0 6px; border: 1px solid var(--border); border-radius: 3px; background: var(--surface-sunk); color: var(--text-muted); font: 500 13px var(--font-sans); white-space: nowrap; }
.tdot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; flex: none; }
.basis { display: inline-flex; align-items: center; gap: 6px; color: var(--text-muted); font-size: 13px; white-space: nowrap; }
.basis svg { color: var(--text-faint); }
.info { display: inline-grid; place-items: center; width: 24px; height: 24px; border: 0; background: none; color: var(--text-faint); border-radius: 4px; cursor: help; vertical-align: middle; }
.info:hover { color: var(--text); background: var(--surface-sunk); }
.empty-state { padding: 18px 0 8px; max-width: 620px; }
.empty-state h3 { margin: 0 0 4px; font: 600 15px/1.35 var(--font-sans); }
.empty-state p { margin: 4px 0; color: var(--text-muted); }
.copyline { display: inline-flex; align-items: center; gap: 6px; margin-top: 6px; }
.copyline code { padding: 3px 6px; background: var(--surface-sunk); border: 1px solid var(--border); border-radius: 4px; }
.live { min-width: 52px; color: var(--success-ink); font-size: 13px; }

/* ---------- Attention ---------- */
.agroup { border-top: 1px solid var(--border); padding: 14px 0 6px; }
.agroup:first-child { border-top: 0; padding-top: 6px; }
.agroup__head { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.disc { display: inline-flex; align-items: center; gap: 6px; border: 0; background: none; padding: 2px 0; cursor: pointer; text-align: left; }
.disc svg { color: var(--text-faint); transition: transform 160ms ease; }
.disc[aria-expanded="true"] > svg { transform: rotate(90deg); }
.agroup__head .basis { margin-left: auto; }
button.basis { border: 0; background: none; padding: 2px 6px; border-radius: 4px; cursor: pointer; font: inherit; font-size: 13px; }
button.basis:hover, button.basis[aria-expanded="true"] { background: var(--surface-sunk); color: var(--text); }
.agroup__why { margin: 2px 0 6px 22px; color: var(--text-muted); font-size: 13px; max-width: 780px; }
.subrows { grid-column: 1 / -1; list-style: none; margin: 4px 0 0; padding: 0 0 0 12px; border-left: 2px solid var(--border-faint); display: grid; gap: 3px; font-size: 13px; color: var(--text-muted); }
.subrows .link-title { font-size: 14px; }
.rows { list-style: none; margin: 0 0 0 22px; padding: 0; }
.row { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 2px 16px; padding: 9px 0; border-bottom: 1px solid var(--border-faint); }
.row:last-child { border-bottom: 0; }
.row__title { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 8px; }
.row__meta { grid-column: 1; color: var(--text-muted); font-size: 13px; display: flex; flex-wrap: wrap; gap: 2px 6px; align-items: center; }
.row__meta > *:not(:last-child)::after { content: "·"; margin-left: 6px; color: var(--text-faint); }
.row__aside { grid-row: 1 / span 2; grid-column: 2; color: var(--text-muted); font-size: 13px; text-align: right; white-space: nowrap; font-variant-numeric: tabular-nums; }
.rel { display: inline-flex; align-items: center; gap: 4px; color: var(--text-muted); font-size: 13px; }
.rel svg { color: var(--text-faint); }
.saved-divider { display: flex; align-items: center; gap: 10px; margin: 18px 0 2px; color: var(--text-muted); font: 500 13px var(--font-sans); }
.saved-divider::after { content: ""; flex: 1; height: 1px; background: var(--border); }
.unavailable { display: flex; gap: 8px; align-items: flex-start; margin: 4px 0 6px 22px; padding: 8px 10px; border: 1px dashed var(--border-strong); border-radius: 6px; color: var(--text-muted); font-size: 13px; max-width: 780px; }

/* ---------- Tables ---------- */
.table-wrap { overflow-x: auto; }
table.t { width: 100%; border-collapse: collapse; font-size: 14px; }
table.t th { position: sticky; top: 0; z-index: 1; height: 34px; padding: 0 10px; text-align: left; font: 500 13px var(--font-sans); color: var(--text-muted); background: var(--surface); border-bottom: 1px solid var(--border); white-space: nowrap; }
table.t th button { border: 0; background: none; padding: 0; color: inherit; font: inherit; cursor: pointer; display: inline-flex; align-items: center; gap: 4px; }
table.t th[aria-sort] button { color: var(--text); }
table.t td { padding: 8px 10px; border-bottom: 1px solid var(--border-faint); vertical-align: top; }
table.t tr.is-click { cursor: pointer; }
table.t tr.is-click:hover td { background: var(--surface-sunk); }
table.t td:first-child, table.t th:first-child { padding-left: var(--gutter); }
.cell-sub { display: block; color: var(--text-faint); margin-top: 2px; }
.t-foot { padding: 8px var(--gutter); color: var(--text-muted); font-size: 13px; border-top: 1px solid var(--border); }

/* evidence coverage bars */
.legend { display: flex; flex-wrap: wrap; gap: 6px 16px; margin: 4px 0 12px; font-size: 13px; color: var(--text-muted); }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.sw { width: 12px; height: 10px; border-radius: 3px; display: inline-block; }
.sw--missing, .seg--missing { background: repeating-linear-gradient(135deg, var(--accent) 0 2px, transparent 2px 4px); box-shadow: inset 0 0 0 1px var(--accent); }
.covbar { display: flex; gap: 2px; height: 10px; width: 100%; max-width: 240px; min-width: 120px; margin-top: 5px; }
.covbar span { height: 100%; }
.covbar span:first-child { border-radius: 4px 0 0 4px; }

/* ---------- Record pages ---------- */

.blk { margin-top: 24px; }

.blk > .section-heading { margin-bottom: 8px; display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; }

.facts { display: grid; grid-template-columns: 136px minmax(0, 1fr); margin: 0; border-bottom: 1px solid var(--border-faint); padding-bottom: 6px; }
.facts dt { font: 500 13px/1.35 var(--font-sans); color: var(--text-muted); padding: 7px 0; }
.facts dd { margin: 0; padding: 6px 0; min-width: 0; }
.facts .note { display: block; color: var(--text-faint); font-size: 13px; }
.saved { padding: 10px 12px; border: 1px solid var(--border); border-radius: 6px; }

.saved__basis { margin: 4px 0; }
.saved__meta { color: var(--text-muted); font-size: 13px; }
.stale { display: inline-flex; align-items: center; gap: 6px; color: var(--warning-ink); font-weight: 500; }
.stale svg { width: 9px; height: 9px; }
.ev { padding: 12px 0; border-top: 1px solid var(--border-faint); }
.ev:first-of-type { border-top: 0; padding-top: 4px; }
.ev__role { font: 500 13px/1.35 var(--font-sans); color: var(--text-muted); margin: 14px 0 0; }
.ev__meta { color: var(--text-muted); font-size: 13px; margin-top: 2px; }

.ev__state svg.i { color: var(--link); }
.ev__state.is-missing svg.i { color: var(--accent); }
.ev__state.is-plain svg.i { color: var(--text-faint); }
.ev__path { color: var(--text-faint); display: block; margin-top: 2px; overflow-wrap: anywhere; }
.excerpt { margin: 8px 0 0; padding: 6px 0; background: var(--surface-sunk); border-radius: 6px; font-size: 14px; line-height: 1.5; }
.excerpt .ln { display: grid; grid-template-columns: 46px minmax(0, 1fr); gap: 10px; padding: 1px 10px 1px 0; }
.excerpt .ln > span:first-child { text-align: right; color: var(--text-faint); font: 500 12px/21px var(--font-mono); font-variant-numeric: tabular-nums; }
.excerpt .ln.ctx > span:last-child { color: var(--text-muted); }

.excerpt .para.hit { background: var(--provenance-soft); }
.ev__foot { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 14px; margin-top: 8px; font-size: 13px; }
.ev__foot .muted { display: inline-flex; align-items: center; gap: 2px; }
.callout { margin-top: 8px; padding: 8px 10px; background: var(--surface-sunk); border-radius: 6px; font-size: 13px; color: var(--text-muted); }
.relist { list-style: none; margin: 0; padding: 0; }

.relist li:last-child { border-bottom: 0; }
.relist svg.i { color: var(--text-faint); margin-top: 2px; }
.relist .rmeta { grid-column: 2; color: var(--text-muted); font-size: 13px; }

.relgroup { font: 500 13px/1.35 var(--font-sans); color: var(--text-muted); margin: 12px 0 2px; }

.registry dt { color: var(--text-muted); font-weight: 500; padding: 3px 0; }
.registry dd { margin: 0; padding: 3px 0; }

details.cmp { margin-top: 8px; }

/* ---------- Trace ---------- */
.trace-top { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 14px; margin-bottom: 10px; }

.trail button { border: 0; background: none; padding: 2px 4px; border-radius: 4px; color: var(--link); font: 500 13px var(--font-sans); cursor: pointer; max-width: 240px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

.trace-count { font-size: 13px; color: var(--text-muted); margin: 0 0 8px; }
.trace-count b { color: var(--text); font-weight: 600; }
.trace-warn { display: flex; flex-wrap: wrap; align-items: baseline; gap: 2px 8px; font-size: 13px; margin: 0 0 10px; }
.trace-note { font-size: 13px; color: var(--text-muted); margin: 14px 0 0; max-width: 820px; }
.graph { position: relative; overflow-x: auto; padding: 3px; }

.tcols { position: relative; z-index: 1; display: grid; gap: 36px; }
.lane__head { font: 500 13px/1.35 var(--font-sans); color: var(--text-muted); margin-bottom: 8px; display: flex; justify-content: space-between; gap: 6px; flex-wrap: wrap; }
.lane__note { margin: 0; font-size: 13px; color: var(--text-faint); }

.node {

  background: var(--surface); cursor: pointer; position: relative;
}
.node:hover { border-color: var(--border-strong); background: var(--surface-sunk); }

.node .nt { display: flex; align-items: center; gap: 6px; font: 500 13px/1.3 var(--font-sans); color: var(--text-muted); min-width: 0; }

.node .nr { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; margin-top: 3px; font-size: 13px; color: var(--text-muted); line-height: 1.3; }
.node .nr.is-risk { color: var(--accent-ink); }
.lane__more { margin-top: 2px; }
.lane__empty { color: var(--text-faint); font-size: 13px; padding: 8px 0; border: 1px dashed var(--border); border-radius: 6px; text-align: center; }
.edges path { fill: none; stroke: var(--type-8); stroke-width: 1.5; transition: stroke 120ms ease, opacity 120ms ease; }
.edges path.s-structure { stroke-dasharray: 5 4; }
.edges path.s-mention { stroke-dasharray: 1.5 4; stroke-linecap: round; }

.edges path.is-focus { stroke: var(--link); }

.trace-legend { display: flex; flex-wrap: wrap; gap: 6px 16px; margin: 16px 0 0; font-size: 13px; color: var(--text-muted); }

.rels { margin-top: 22px; }

.rels tr.is-hl td { background: var(--selection); }
.rels .verb { white-space: nowrap; display: inline-flex; align-items: center; gap: 4px; }
.rels .verb svg { color: var(--text-faint); }
.rels .cell-sub .mono { white-space: nowrap; }
@container (max-width: 899px) {
  /* Narrow: a structured list by direction and hop replaces drawn edges. */

  .tcols { display: flex; flex-direction: column; gap: 18px; }

}

  fres = pool.filter((r) => `${r.title} ${r.id} ${r.path || ""} ${r.body || ""}`.toLowerCase().includes(q)).slice(0, 8);
  fsel = 0;
  flist.innerHTML = fres.length ? fres.map((r, i) => `<li role="option" id="fo${i}" aria-selected="${i === fsel}" data-fo="${i}">${dot(r.type)}<span class="t">${esc(r.title)}</span><span class="k">${r.otherProduct ? cap(r.otherProduct) + " · not in AO model" : esc(TYPES[r.type].label)}</span><span class="p mono">${esc(locatorOf(r))}</span></li>`).join("") : `<li class="finder__empty" role="option" aria-disabled="true">No matches</li>`;
  flist.hidden = false; finder.setAttribute("aria-expanded", "true");
}
function finderPick(i) { const r = fres[i]; if (!r) return; finder.value = ""; flist.hidden = true; if (r.otherProduct) S.extra.add(r.id); go({ kind: "record", id: r.id }); }
finder.addEventListener("input", finderSearch);
finder.addEventListener("keydown", (ev) => {
  if (flist.hidden) return;
  if (ev.key === "ArrowDown" || ev.key === "ArrowUp") { ev.preventDefault(); fsel = (fsel + (ev.key === "ArrowDown" ? 1 : -1) + fres.length) % Math.max(fres.length, 1); flist.querySelectorAll("li").forEach((li, i) => li.setAttribute("aria-selected", String(i === fsel))); finder.setAttribute("aria-activedescendant", "fo" + fsel); }
  else if (ev.key === "Enter") { ev.preventDefault(); finderPick(fsel); }
  else if (ev.key === "Escape") { flist.hidden = true; }
});
flist.addEventListener("mousedown", (ev) => { const li = ev.target.closest("[data-fo]"); if (li) { ev.preventDefault(); finderPick(+li.dataset.fo); } });
finder.addEventListener("blur", () => setTimeout(() => (flist.hidden = true), 120));

/* ---- Start: restore from the link, then keep the URL in step ---- */
window.addEventListener("popstate", onPop);
{
  const h = location.hash.slice(1), st = history.state;
  restore(h);
  if (st && Array.isArray(st.stack) && st.stack[st.i] === h) { NAV.entries = st.stack.slice(); NAV.idx = st.i; } // reload keeps Back
  else NAV.entries = [h];
}
render();
</script>
