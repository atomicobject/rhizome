version = 1
name = "rhizome"

[setup]
script = '''
cd web
npm install
cd ..
direnv allow
cp "$CODEX_SOURCE_TREE_PATH/.env" "$CODEX_WORKTREE_PATH/.env"
cp -r "$CODEX_SOURCE_TREE_PATH/bin" "$CODEX_WORKTREE_PATH/"
case "$(uname -s)" in
  Darwin) rzm_os=darwin ;;
  Linux) rzm_os=linux ;;
  *) echo "unsupported OS for copied Rhizome binary: $(uname -s)" >&2; exit 1 ;;
esac

RZM_SKIP_REPO_DELEGATE=1 "$CODEX_WORKTREE_PATH/bin/$rzm_os/rzm" new-worktree "$CODEX_SOURCE_TREE_PATH"
'''

[[actions]]
name = "Run"
icon = "run"
command = '''
make build
rzm serve
'''
