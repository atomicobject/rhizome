\* Ontology tickets with a RECORD source set {a, b} across explicit indexing, interruption and restart. Budgets: 1 edit, 1 save, 1 explicit index, 1 restart, 1 interrupted batch, 1 failed pass.
\* The runner (../check) rewrites SPECIFICATION, INVARIANT and PROPERTY per run;
\* as written, this file checks every rule for reading with /statechart.
SPECIFICATION Spec
CONSTANTS
  Paths = {"a", "b", "c"}
  RecordHosts = {"a", "b"}
  Style = "ontology"
  MaxEdits = 1
  MaxSaves = 1
  MaxExplicit = 1
  MaxRestarts = 1
  MaxInterrupts = 1
  MaxFailures = 1
  MaxLostEvents = 0
  CheckTicket = TRUE
  RecordWitness = TRUE
  RecordExpand = TRUE
  AckFilter = TRUE
  PublishOnlyLive = TRUE
  PublishSurvivors = TRUE
  AckOnlyPublished = FALSE
INVARIANT NoStalePublication QuietMeansCurrent NoAckWithoutPublication AckNeverCoversNewerChange GroupPublishesOnlyCurrentMembers QuietMeansIndexed CoverSurvivorsContinue
