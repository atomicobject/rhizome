min_version = "2026.7.0"

[tools]
go = "1.27.4"
golangci-lint = "2.15.0"
gitleaks = "8.30.1"
node = "22.23.1"

[env]
_.path = "bin/{{ 'darwin' if os() == 'macos' else os() }}"

[tasks.build]
description = "Build Rhizome for the current platform"
run = "make"

[tasks.check]
description = "Run the canonical local quality gate"
run = "make check"

[bootstrap.mise_shell_activate]
zsh = true
