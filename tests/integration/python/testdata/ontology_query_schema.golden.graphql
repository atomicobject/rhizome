}

type NodeLoadedDomains {
  rendered: Boolean!
  assessment: Boolean!
  structure: Boolean!
  relations: Boolean!
}

enum ActionStatus {
  open
  blocked
  done
}

input PropertyFilterInput {
  name: String!
  value: String!
  source: PropertySource = ANY
}

enum FieldFilterOperator {
  eq
  in
  exists
  gt
  gte
  lt
  lte
  contains
  neq
}

enum SortDirection {
  asc
  desc
}

"""For @link fields, eq/in test uniquely resolved target membership and exists tests presence. contains is for scalar text fields."""
input FieldFilterInput {
  field: String!
  op: FieldFilterOperator = eq
  value: String
  values: [String!]
}

input SortInput {
  field: String!
  direction: SortDirection = asc
}

interface Node {
  ref: NodeRef!
  nodeId: String!
  nodeKind: String!
  path: String
  title: String!
  resolvedType: String
  locator: NodeLocator!
  workspace: NodeWorkspaceProjection
  neighborhood(direction: TraversalDirection = OUTBOUND, relation: String, type: String, first: Int = 20): NodeNeighborhood!
  localGraph(profile: GraphProfile = ONTOLOGY_NATIVE, nodeLimit: Int = 50, edgeLimit: Int = 100, includeCodeEdges: Boolean = false): LocalGraph!
}

interface Note implements Node {
  ref: NodeRef!
  nodeId: String!
  nodeKind: String!
  path: String
  title: String!
  resolvedType: String
  locator: NodeLocator!
  workspace: NodeWorkspaceProjection
  neighborhood(direction: TraversalDirection = OUTBOUND, relation: String, type: String, first: Int = 20): NodeNeighborhood!
  localGraph(profile: GraphProfile = ONTOLOGY_NATIVE, nodeLimit: Int = 50, edgeLimit: Int = 100, includeCodeEdges: Boolean = false): LocalGraph!
  summary: String
  """Indexed mtime of the source note file (RFC3339), or null without indexed metadata. Not the last commit: a fresh clone gives every file the same time. Interfaces declare it only when every implementor does."""
  updatedAt: DateTime
  """Published validation issues on the record's note, or on its node for an embedded record; 0 before validation publishes. Interfaces declare it only when every implementor does."""
  issueCount: Int!
}

interface NoteNode implements Node & Note {
  ref: NodeRef!
  nodeId: String!
  nodeKind: String!
  path: String
