scalar Date
scalar DateTime
scalar URL
scalar JSON

enum PropertySource { ANY FRONTMATTER INLINE }
enum NeighborDirection { OUTBOUND INBOUND BOTH }

enum SectionLevel { H1 H2 H3 H4 H5 H6 }

enum NodeKind { NOTE SECTION EMBEDDED CODE_FILE CODE_SYMBOL MODULE }

enum FieldDisplayImportance { KEY NORMAL DETAIL }

enum TraversalDirection { OUTBOUND INBOUND BOTH }
enum GraphProfile { ONTOLOGY_NATIVE NOTES_ONLY CODE_AWARE }

enum OntologySemanticsKind { BEHAVIORAL DOCUMENTARY }
directive @semantics(kind: OntologySemanticsKind!) on OBJECT | FIELD_DEFINITION

type NodeRef {
  ref: String!
  notePath: String
  path: String
  fragment: String
  kind: NodeKind!
  nodeId: String
  structural: String
  typeName: String
}

type NodeRefResolution {
  input: String!
  found: Boolean!
  ref: NodeRef
  candidates: [NodeRef!]!
  kind: NodeKind
  title: String
  path: String
  resolvedType: String
  reason: String
}

type NodeLinkTarget {
  ref: NodeRef!
  markdown: String
  wikilink: String
  displayLabel: String
  exists: Boolean!
  requiresFix: Boolean!
  blockId: String
}

type NodeLocatorDiagnostic {
  code: String!
  notePath: String
  ref: NodeRef
  blockId: String
  message: String!
}

type NodeLinkFixAction {
  ref: NodeRef!
  blockId: String!
}

type NodeLocator {
  ref: NodeRef!
  kind: NodeKind!
  sourceLocator: String!
  status: String!
  linkTarget: NodeLinkTarget
  diagnostics: [NodeLocatorDiagnostic!]!
  fixActions: [NodeLinkFixAction!]!
  wikilink: String
  markdown: String
  exists: Boolean!
  requiresFix: Boolean!
}

type NodeNeighborhood {
  edges: [NodeRelationEdge!]!
  nodes: [Node!]!
  truncated: Boolean!
}

type NodeRelationEdge {
  source: NodeRef!
  target: NodeRef!
  direction: TraversalDirection!
  relation: String
  provenance: String
  structural: Boolean!
  targetType: String
  depth: Int!
}

type LocalGraph {
  nodes: [LocalGraphNode!]!
  edges: [LocalGraphEdge!]!
  truncated: Boolean!
  diagnostics: JSON
}

type LocalGraphNode {
  id: ID!
  ref: NodeRef
  nodeKind: String!
  path: String
  notePath: String
  nodeId: String
  typeName: String
  title: String!
  sourceLocator: String
