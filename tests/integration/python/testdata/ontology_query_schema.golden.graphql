}

type NodeFieldAssessment {
  name: String!
  description: String
  kind: String!
  typeName: String!
  required: Boolean!
  list: Boolean!
  source: String
  sourceKind: String
  present: Boolean!
  values: [String!]!
  validValues: [String!]!
  issues: [NodeAssessmentIssue!]!
}

type NodeRelationAssessment {
