}

type LocalGraphEdge {
  source: ID!
  target: ID!
  kind: String!
  relation: String
  relationLabel: String
  provenance: String
  structural: Boolean!
  weight: Int
  confidence: Float
}

type PageInfo {
  queryShapeVersion: String!
  requestedFirst: Int!
  returnedCount: Int!
  truncated: Boolean!
  maxFirst: Int!
}

type NodeBatchResult {
  items: [NodeBatchItem!]!
  pageInfo: PageInfo!
}

type NodeBatchItem {
  requestedRef: String!
  ref: NodeRef
  node: Node
  error: RuntimeWarning
}

type NoteConnection {
  nodes: [NoteNode!]!
  pageInfo: PageInfo!
