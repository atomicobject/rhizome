type Query {
  node(ref: String!): Node
  nodes(refs: [String!]!, first: Int = 50): NodeBatchResult!
  note(path: String, ref: String): NoteNode
  resolve(ref: String!): NodeRefResolution!
  notes(type: String, find: String, property: PropertyFilterInput, semantic: [String!], first: Int = 20): NoteConnection!
  search(query: [String!]!, type: String, first: Int = 20): NodeSearchResult!
  validation(check: String, scopeKind: String = "global", scopeKey: String, firstIssues: Int = 100): ValidationState!
  ontology: OntologyRuntime!
  code: CodeRuntime!
  actionItem(first: Int = 20, offset: Int = 0, filters: [FieldFilterInput!], sort: [SortInput!]): [ActionItem!]!
  conversation(path: String, find: String, property: PropertyFilterInput, semantic: [String!], first: Int = 20, offset: Int = 0, filters: [FieldFilterInput!], sort: [SortInput!]): [Conversation!]!
  decision(path: String, find: String, property: PropertyFilterInput, semantic: [String!], first: Int = 20, offset: Int = 0, filters: [FieldFilterInput!], sort: [SortInput!]): [Decision!]!
  editableActionItem(first: Int = 20, offset: Int = 0, filters: [FieldFilterInput!], sort: [SortInput!]): [EditableActionItem!]!
  meeting(path: String, find: String, property: PropertyFilterInput, semantic: [String!], first: Int = 20, offset: Int = 0, filters: [FieldFilterInput!], sort: [SortInput!]): [Meeting!]!
  person(path: String, find: String, property: PropertyFilterInput, semantic: [String!], first: Int = 20, offset: Int = 0, filters: [FieldFilterInput!], sort: [SortInput!]): [Person!]!
  project(path: String, find: String, property: PropertyFilterInput, semantic: [String!], first: Int = 20, offset: Int = 0, filters: [FieldFilterInput!], sort: [SortInput!]): [Project!]!
  spec(path: String, find: String, property: PropertyFilterInput, semantic: [String!], first: Int = 20, offset: Int = 0, filters: [FieldFilterInput!], sort: [SortInput!]): [Spec!]!
  team(path: String, find: String, property: PropertyFilterInput, semantic: [String!], first: Int = 20, offset: Int = 0, filters: [FieldFilterInput!], sort: [SortInput!]): [Team!]!
  userStory(first: Int = 20, offset: Int = 0, filters: [FieldFilterInput!], sort: [SortInput!]): [UserStory!]!
}

