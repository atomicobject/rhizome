version: 2

before:
  hooks:
    - ./scripts/vendor/ensure_tree_sitter_sources.sh
    - make web-build
    - python3 ./scripts/release/build_installer.py --output-dir .tmp/goreleaser-extra

builds:
  # macOS builds - native (run on macOS runner)
  - id: rzm-darwin
    binary: rzm
    hooks:
      post:
        - python3 scripts/teamkeys/release.py --check-artifact "{{ .Path }}"
        # Builds the desktop app around the arm64 binary; a no-op otherwise.
        - cmd: python3 scripts/release/build_desktop.py "{{ .Path }}" "{{ .Version }}" "{{ .Arch }}" "{{ .IsSnapshot }}"
          output: true
    goos:
      - darwin
    goarch:
      - amd64
      - arm64
    env:
      - CGO_ENABLED=1
    flags:
      - -mod=vendor
      - -tags=fts5
      - -trimpath
    ldflags:
      - -s -w
      - -X github.com/atomicobject/rhizome/pkg/vault/version.Version={{.Version}}
      - -X github.com/atomicobject/rhizome/pkg/vault/version.Channel=release
      - '{{ with index .Env "RZM_INTERNAL_S3_BUCKET" }}-X github.com/atomicobject/rhizome/pkg/app/update.DefaultReleasesURL=https://{{ . }}.s3.amazonaws.com/releases{{ end }}'
      - -X github.com/atomicobject/rhizome/pkg/teamapi/session.DefaultOrigin=https://rh-df6936413ece4c13ad5ce75771f3aeb4.ecs.us-east-2.on.aws

  # Linux builds - cross-compiled with zig
  - id: rzm-linux
    binary: rzm
    hooks:
      post:
        - python3 scripts/release/stage_native_cli.py "{{ .Path }}" "{{ .Version }}" "{{ .Os }}" "{{ .Arch }}" "{{ .IsSnapshot }}"
        - python3 scripts/teamkeys/release.py --check-artifact "{{ .Path }}"
    goos:
      - linux
    goarch:
      - amd64
      - arm64
    env:
      - CGO_ENABLED=1
    flags:
      - -mod=vendor
      - -tags=fts5
      - -trimpath
    ldflags:
      - -s -w
      - -X github.com/atomicobject/rhizome/pkg/vault/version.Version={{.Version}}
      - -X github.com/atomicobject/rhizome/pkg/vault/version.Channel=release
      - '{{ with index .Env "RZM_INTERNAL_S3_BUCKET" }}-X github.com/atomicobject/rhizome/pkg/app/update.DefaultReleasesURL=https://{{ . }}.s3.amazonaws.com/releases{{ end }}'
      - -X github.com/atomicobject/rhizome/pkg/teamapi/session.DefaultOrigin=https://rh-df6936413ece4c13ad5ce75771f3aeb4.ecs.us-east-2.on.aws
    overrides:
      - goos: linux
        goarch: amd64
        env:
          - CGO_ENABLED=1
          - CC=zig cc -target x86_64-linux-gnu
          - CXX=zig c++ -target x86_64-linux-gnu
      - goos: linux
        goarch: arm64
        env:
          - CGO_ENABLED=1
          - CC=zig cc -target aarch64-linux-gnu
          - CXX=zig c++ -target aarch64-linux-gnu

  # Windows amd64 - cross-compiled with mingw-w64
  - id: rzm-windows-amd64
    binary: rzm
    hooks:
      post:
        - python3 scripts/release/stage_native_cli.py "{{ .Path }}" "{{ .Version }}" "{{ .Os }}" "{{ .Arch }}" "{{ .IsSnapshot }}"
        - python3 scripts/teamkeys/release.py --check-artifact "{{ .Path }}"
    goos:
      - windows
    goarch:
      - amd64
    env:
      - CGO_ENABLED=1
      - 'CC={{ if eq .Runtime.Goos "windows" }}gcc{{ else }}x86_64-w64-mingw32-gcc{{ end }}'
      - 'CXX={{ if eq .Runtime.Goos "windows" }}g++{{ else }}x86_64-w64-mingw32-g++{{ end }}'
    flags:
      - -mod=vendor
      - -tags=fts5
      - -trimpath
    ldflags:
      - -s -w
      - -X github.com/atomicobject/rhizome/pkg/vault/version.Version={{.Version}}
      - -X github.com/atomicobject/rhizome/pkg/vault/version.Channel=release
      - '{{ with index .Env "RZM_INTERNAL_S3_BUCKET" }}-X github.com/atomicobject/rhizome/pkg/app/update.DefaultReleasesURL=https://{{ . }}.s3.amazonaws.com/releases{{ end }}'
      - -X github.com/atomicobject/rhizome/pkg/teamapi/session.DefaultOrigin=https://rh-df6936413ece4c13ad5ce75771f3aeb4.ecs.us-east-2.on.aws

release:
  # Public latest is promoted only after joined-feed verification; private releases retain their existing behavior.
  make_latest: '{{ if index .Env "RZM_INTERNAL_S3_BUCKET" }}true{{ else }}false{{ end }}'
  target_commitish: "{{ .Commit }}"
  prerelease: auto
  extra_files:
    - glob: .tmp/goreleaser-extra/install-rzm.sh
    - glob: .tmp/goreleaser-extra/install-rzm.sh.sha256
    # With RZM_RELEASE_DESKTOP=1 (a public cut-release) these are literal paths,
    # so a missing desktop asset fails the release. Otherwise the inserted "*"
    # makes them globs, which GoReleaser skips when nothing matches: internal
    # releases, the Actions fallback, and snapshots without the updater key.
    - glob: '.tmp/goreleaser-extra/Rhizome-macos-arm64{{ if ne (index .Env "RZM_RELEASE_DESKTOP") "1" }}*{{ end }}.dmg'
    - glob: '.tmp/goreleaser-extra/Rhizome-macos-arm64{{ if ne (index .Env "RZM_RELEASE_DESKTOP") "1" }}*{{ end }}.app.tar.gz'
    - glob: '.tmp/goreleaser-extra/Rhizome-macos-arm64{{ if ne (index .Env "RZM_RELEASE_DESKTOP") "1" }}*{{ end }}.app.tar.gz.sig'
    - glob: '.tmp/goreleaser-extra/latest{{ if ne (index .Env "RZM_RELEASE_DESKTOP") "1" }}*{{ end }}.json'
    - glob: '.tmp/goreleaser-extra/Rhizome-windows-x64-setup{{ if ne (index .Env "RZM_RELEASE_DESKTOP") "1" }}*{{ end }}.exe'
    - glob: '.tmp/goreleaser-extra/Rhizome-windows-x64-setup{{ if ne (index .Env "RZM_RELEASE_DESKTOP") "1" }}*{{ end }}.exe.sig'
    - glob: '.tmp/goreleaser-extra/Rhizome-linux-x64{{ if ne (index .Env "RZM_RELEASE_DESKTOP") "1" }}*{{ end }}.AppImage'
    - glob: '.tmp/goreleaser-extra/Rhizome-linux-x64{{ if ne (index .Env "RZM_RELEASE_DESKTOP") "1" }}*{{ end }}.AppImage.sig'
    - glob: '.tmp/goreleaser-extra/desktop-assembly{{ if ne (index .Env "RZM_RELEASE_DESKTOP") "1" }}*{{ end }}.json'

archives:
  - formats: [tar.gz]
    name_template: "rhizome-{{ .Os }}-{{ .Arch }}"
    files:
      - LICENSE
      - THIRD_PARTY_LICENSES.md
      - licenses/**

brews:
  - name: rhizome
    # Complete desktop releases update the tap only after verified advertisement.
    skip_upload: '{{ if eq (index .Env "RZM_RELEASE_DESKTOP") "1" }}true{{ else }}false{{ end }}'
    homepage: https://github.com/atomicobject/rhizome
    repository:
      owner: atomicobject
      name: homebrew-tap
      branch: main
      token: '{{ if ne (index .Env "RZM_RELEASE_DESKTOP") "1" }}{{ .Env.BREW_GITHUB_TOKEN }}{{ end }}'
    # commit_author:
    #   name: your-name
    #   email: your-email@atomicobject.com

checksum:
  name_template: "checksums.txt"
  extra_files:
    - glob: '.tmp/goreleaser-extra/Rhizome-macos-arm64{{ if ne (index .Env "RZM_RELEASE_DESKTOP") "1" }}*{{ end }}.dmg'
    - glob: '.tmp/goreleaser-extra/Rhizome-macos-arm64{{ if ne (index .Env "RZM_RELEASE_DESKTOP") "1" }}*{{ end }}.app.tar.gz'
    - glob: '.tmp/goreleaser-extra/Rhizome-macos-arm64{{ if ne (index .Env "RZM_RELEASE_DESKTOP") "1" }}*{{ end }}.app.tar.gz.sig'
    - glob: '.tmp/goreleaser-extra/latest{{ if ne (index .Env "RZM_RELEASE_DESKTOP") "1" }}*{{ end }}.json'
    - glob: '.tmp/goreleaser-extra/Rhizome-windows-x64-setup{{ if ne (index .Env "RZM_RELEASE_DESKTOP") "1" }}*{{ end }}.exe'
    - glob: '.tmp/goreleaser-extra/Rhizome-windows-x64-setup{{ if ne (index .Env "RZM_RELEASE_DESKTOP") "1" }}*{{ end }}.exe.sig'
    - glob: '.tmp/goreleaser-extra/Rhizome-linux-x64{{ if ne (index .Env "RZM_RELEASE_DESKTOP") "1" }}*{{ end }}.AppImage'
    - glob: '.tmp/goreleaser-extra/Rhizome-linux-x64{{ if ne (index .Env "RZM_RELEASE_DESKTOP") "1" }}*{{ end }}.AppImage.sig'
    - glob: '.tmp/goreleaser-extra/desktop-assembly{{ if ne (index .Env "RZM_RELEASE_DESKTOP") "1" }}*{{ end }}.json'
